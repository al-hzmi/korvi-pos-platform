[package]
name = "korvi-cashier"
version = "0.1.0"
description = "Korvi Cashier installed runtime"
authors = ["Korvi"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "korvi_cashier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "=2.6.3"

[dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["cookies", "rustls"] }
serde = { version = "=1.0.228", features = ["derive"] }
tauri = { version = "=2.11.5", features = [] }
url = "=2.5.7"
