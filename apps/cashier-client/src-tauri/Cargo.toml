[package]
name = "korvi-cashier"
version = "0.1.0"
description = "Korvi Cashier installed runtime"
authors = ["Korvi"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "korvi_cashier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.1", features = [] }

[dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "cookies", "charset"] }
serde = { version = "=1.0.229", features = ["derive"] }
tauri = { version = "=2.11.1", features = [] }
