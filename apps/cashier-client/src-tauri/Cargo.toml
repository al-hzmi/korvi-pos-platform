[package]
name = "korvi-cashier"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[lib]
name = "korvi_cashier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "=2.6.1"

[dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "charset", "json"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
tauri = { version = "=2.11.1", features = [] }

[target.'cfg(windows)'.dependencies]
base64 = "=0.22.1"
sha2 = "=0.10.9"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-korvi-device-identity = { path = "tauri-plugin-korvi-device-identity" }
