name: Temporary AR2 Final Formatter

on:
  push:
    branches:
      - integration/acquisition-ar2

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - run: >
          npx prettier --write
          apps/pos-web/src/components/cashier-return-workflow.tsx
          apps/pos-web/src/components/shift-close-control.tsx
          scripts/browser-cashier-sale-proof.mjs
          .github/workflows/gate-20-cashier-sale-proof.yml
      - name: Commit formatter output and remove one-shot workflow
        run: |
          rm .github/workflows/tmp-ar2-final-format.yml
          git config user.name "korvi-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(format): AR-2 browser proof"
          git push origin HEAD:integration/acquisition-ar2
