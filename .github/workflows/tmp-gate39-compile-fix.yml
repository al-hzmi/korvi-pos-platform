name: Temporary Gate39 Compile Fix

on:
  push:
    branches:
      - review/zatca-39-csid-lifecycle
    paths:
      - .github/workflows/tmp-gate39-compile-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: review/zatca-39-csid-lifecycle

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --registry=https://registry.npmjs.org

      - name: Apply exact type and XMLDSIG contract fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lifecycle = Path('packages/domain/src/zatca/csid-lifecycle.ts')
          text = lifecycle.read_text()
          old = "  const digest = await subtle.digest('SHA-256', bytes);\n"
          new = (
              "  // Own the backing ArrayBuffer before crossing the WebCrypto BufferSource boundary.\n"
              "  // A generic Uint8Array may legally wrap SharedArrayBuffer; certificate bytes must not.\n"
              "  const ownedBytes = new Uint8Array(bytes.length);\n"
              "  ownedBytes.set(bytes);\n"
              "  const digest = await subtle.digest('SHA-256', ownedBytes);\n"
          )
          if text.count(old) != 1:
              raise SystemExit('lifecycle digest anchor mismatch')
          lifecycle.write_text(text.replace(old, new))

          port = Path('packages/domain/src/ports/zatca.ts')
          text = port.read_text()
          anchor = "export type ZatcaSigningAlgorithm = typeof ZATCA_SIGNING_ALGORITHM;\n"
          insertion = (
              anchor
              + "\n/** XMLDSIG ECDSA SignatureValue is fixed-width r || s, not ASN.1 DER. */\n"
              + "export const ZATCA_XMLDSIG_ECDSA_SIGNATURE_BYTES = 64 as const;\n"
          )
          if text.count(anchor) != 1:
              raise SystemExit('signing algorithm anchor mismatch')
          text = text.replace(anchor, insertion)
          old = "  /** Return only the ECDSA signature; never the private key or activation data. */\n  signSha256(input: ZatcaSignInput): Promise<Uint8Array>;\n"
          new = (
              "  /**\n"
              "   * Return the XMLDSIG ECDSA SignatureValue bytes: exactly 64 bytes `r || s`,\n"
              "   * each integer encoded as a 32-byte unsigned I2OSP value. This is NOT ASN.1 DER.\n"
              "   * Provider adapters whose HSM returns DER must convert and validate it at the\n"
              "   * adapter boundary. The private key and activation data are never returned.\n"
              "   */\n"
              "  signSha256(input: ZatcaSignInput): Promise<Uint8Array>;\n"
          )
          if text.count(old) != 1:
              raise SystemExit('signSha256 contract anchor mismatch')
          port.write_text(text.replace(old, new))
          PY
          npx prettier@3.9.6 --write packages/domain/src/zatca/csid-lifecycle.ts packages/domain/src/ports/zatca.ts
          git diff --check

      - name: Commit exact patch only
        run: |
          git add packages/domain/src/zatca/csid-lifecycle.ts packages/domain/src/ports/zatca.ts
          git diff --cached --exit-code && { echo 'Expected a patch but none was produced.' >&2; exit 1; } || true
          git config user.name 'korvi-ci'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix(zatca): own crypto buffers and define XMLDSIG signature bytes'
          git push origin HEAD:review/zatca-39-csid-lifecycle
