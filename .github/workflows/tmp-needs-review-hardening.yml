          anchor = "export async function openKorviOfflineStore(factory?: IDBFactory): Promise<KorviOfflineStore> {"
          addition = r'''async function resolveRejectedQueueReview(
  database: IDBDatabase,
  partition: QueuePartition,
  id: string,
  input: OfflineQueueReviewResolutionInput,
): Promise<void> {
  const normalized = normalizeReviewResolution(input);
  const transaction = database.transaction(OFFLINE_TRANSACTION_QUEUE_STORE, 'readwrite');
  const done = transactionDone(transaction);
  const store = transaction.objectStore(OFFLINE_TRANSACTION_QUEUE_STORE);
  const request = store.get(queueRecordKey(partition, id));
  let failure: OfflineStoreError | null = null;
  request.onerror = () => {
    failure = classifyIndexedDbError(request.error);
    transaction.abort();
  };
  request.onsuccess = () => {
    try {
      if (request.result === undefined) {
        failure = new OfflineStoreError('conflict', 'Rejected queue operation does not exist.');
        transaction.abort();
        return;
      }
      const decoded = decodeStoredQueueRow(request.result, partition);
      if (decoded.operation.state !== 'rejected') {
        failure = new OfflineStoreError('conflict', 'Only a rejected operation can be reviewed.');
        transaction.abort();
        return;
      }
      const current = toOfflineQueueReview(decoded);
      if (current.reviewState === 'resolved') {
        if (
          current.resolution?.reviewedAt !== normalized.reviewedAt ||
          current.resolution.reviewedByUserId !== normalized.reviewedByUserId ||
          current.resolution.resolution !== normalized.resolution ||
          current.resolution.note !== normalized.note
        ) {
          failure = new OfflineStoreError(
            'conflict',
            'A resolved offline review is immutable and cannot be rewritten.',
          );
          transaction.abort();
        }
        return;
      }
      store.put({
        ...decoded.stored,
        reviewState: 'resolved',
        reviewedAt: normalized.reviewedAt,
        reviewedByUserId: normalized.reviewedByUserId,
        reviewResolution: normalized.resolution,
        reviewNote: normalized.note,
      } satisfies StoredQueuedOperation);
    } catch (error) {
      failure = classifyIndexedDbError(error);
      transaction.abort();
    }
  };
  try {
    await done;
  } catch (error) {
    if (failure !== null) throw failure;
    throw classifyIndexedDbError(error);
  }
}

'''
