          "export interface OfflineSaleDraft {\n  readonly lines: readonly CartLine[];\n  readonly cash: string;\n  readonly priceMode: PriceMode;\n  readonly updatedAt: string;\n}\n\nexport type OfflineQueueReviewState = 'needs-review' | 'resolved';\nexport type OfflineQueueReviewResolutionKind = 'acknowledged';\n\nexport interface OfflineQueueReviewResolutionInput {\n  readonly reviewedAt: string;\n  readonly reviewedByUserId: string;\n  readonly resolution: OfflineQueueReviewResolutionKind;\n  readonly note?: string | null | undefined;\n}\n\nexport interface OfflineQueueReview {\n  readonly operation: QueuedOperation;\n  /** Null only for honest legacy rows created before rejection timestamps were introduced. */\n  readonly rejectedAt: string | null;\n  readonly reviewState: OfflineQueueReviewState;\n  readonly resolution: {\n    readonly reviewedAt: string;\n    readonly reviewedByUserId: string;\n    readonly resolution: OfflineQueueReviewResolutionKind;\n    readonly note: string | null;\n  } | null;\n}\n")

          replace_once(store,
          "  readonly claimToken: string | null;\n  readonly rejectionReason: string | null;\n}\n",
          "  readonly claimToken: string | null;\n  readonly rejectionReason: string | null;\n  readonly rejectedAt?: string | null | undefined;\n  readonly reviewState?: OfflineQueueReviewState | null | undefined;\n  readonly reviewedAt?: string | null | undefined;\n  readonly reviewedByUserId?: string | null | undefined;\n  readonly reviewResolution?: OfflineQueueReviewResolutionKind | null | undefined;\n  readonly reviewNote?: string | null | undefined;\n}\n")

          replace_once(store,
          "  queueCount(partition: QueuePartition): Promise<number>;\n  rejected(partition: QueuePartition, limit?: number): Promise<readonly QueuedOperation[]>;\n  describe(): OfflineStoreDescription;",
          "  queueCount(partition: QueuePartition): Promise<number>;\n  rejected(partition: QueuePartition, limit?: number): Promise<readonly QueuedOperation[]>;\n  rejectedReviews(partition: QueuePartition, limit?: number): Promise<readonly OfflineQueueReview[]>;\n  resolveRejectedReview(\n    partition: QueuePartition,\n    id: string,\n    resolution: OfflineQueueReviewResolutionInput,\n  ): Promise<void>;\n  describe(): OfflineStoreDescription;")

          replace_once(store,
          "    claimToken: null,\n    rejectionReason: null,\n  };\n}\n\nfunction decodeStoredQueueRow(",
          "    claimToken: null,\n    rejectionReason: null,\n    rejectedAt: null,\n    reviewState: null,\n    reviewedAt: null,\n    reviewedByUserId: null,\n    reviewResolution: null,\n    reviewNote: null,\n  };\n}\n\ninterface QueueReviewMetadata {\n  readonly rejectedAt: string | null;\n  readonly reviewState: OfflineQueueReviewState | null;\n  readonly reviewedAt: string | null;\n  readonly reviewedByUserId: string | null;\n  readonly reviewResolution: OfflineQueueReviewResolutionKind | null;\n  readonly reviewNote: string | null;\n}\n\nfunction reviewField(value: Readonly<Record<string, unknown>>, key: string): unknown {\n  return Object.prototype.hasOwnProperty.call(value, key) ? value[key] : undefined;\n}\n\nfunction decodeQueueReviewMetadata(\n  value: Readonly<Record<string, unknown>>,\n): QueueReviewMetadata {\n  const rejectedAtRaw = reviewField(value, 'rejectedAt');\n  const reviewStateRaw = reviewField(value, 'reviewState');\n  const reviewedAtRaw = reviewField(value, 'reviewedAt');\n  const reviewedByRaw = reviewField(value, 'reviewedByUserId');\n  const resolutionRaw = reviewField(value, 'reviewResolution');\n  const noteRaw = reviewField(value, 'reviewNote');\n\n  const rejectedAt = rejectedAtRaw === undefined ? null : rejectedAtRaw;\n  const reviewedAt = reviewedAtRaw === undefined ? null : reviewedAtRaw;\n  const reviewedByUserId = reviewedByRaw === undefined ? null : reviewedByRaw;\n  const reviewResolution = resolutionRaw === undefined ? null : resolutionRaw;\n  const reviewNote = noteRaw === undefined ? null : noteRaw;\n\n  if (value.state !== 'rejected') {\n    if (\n      rejectedAt !== null ||\n      reviewStateRaw !== undefined && reviewStateRaw !== null ||\n      reviewedAt !== null ||\n      reviewedByUserId !== null ||\n      reviewResolution !== null ||\n      reviewNote !== null\n    ) {\n      throw new OfflineStoreError('corrupt', 'Non-rejected queue operation contains review metadata.');\n    }\n    return {\n      rejectedAt: null,\n      reviewState: null,\n      reviewedAt: null,\n      reviewedByUserId: null,\n      reviewResolution: null,\n      reviewNote: null,\n    };\n  }\n\n  if (\n    !(rejectedAt === null ||\n      (typeof rejectedAt === 'string' && Number.isFinite(Date.parse(rejectedAt))))\n  ) {\n    throw new OfflineStoreError('corrupt', 'Queue rejection timestamp is invalid.');\n  }\n\n  const reviewState: OfflineQueueReviewState =\n    reviewStateRaw === undefined || reviewStateRaw === null ? 'needs-review' :\n      reviewStateRaw === 'needs-review' || reviewStateRaw === 'resolved'\n        ? reviewStateRaw\n        : (() => { throw new OfflineStoreError('corrupt', 'Queue review state is invalid.'); })();\n\n  if (reviewState === 'needs-review') {\n    if (reviewedAt !== null || reviewedByUserId !== null || reviewResolution !== null || reviewNote !== null) {\n      throw new OfflineStoreError('corrupt', 'Unresolved queue review contains resolution metadata.');\n    }\n    return { rejectedAt, reviewState, reviewedAt: null, reviewedByUserId: null, reviewResolution: null, reviewNote: null };\n  }\n\n  if (\n    typeof reviewedAt !== 'string' ||\n    !Number.isFinite(Date.parse(reviewedAt)) ||\n    typeof reviewedByUserId !== 'string' ||\n    !isUuidV7(reviewedByUserId) ||\n    reviewResolution !== 'acknowledged' ||\n    !(reviewNote === null ||\n      (typeof reviewNote === 'string' &&\n        reviewNote === reviewNote.trim() &&\n        reviewNote.length > 0 &&\n        reviewNote.length <= MAX_REVIEW_NOTE_LENGTH))\n  ) {\n    throw new OfflineStoreError('corrupt', 'Resolved queue review metadata is invalid.');\n  }\n  return { rejectedAt, reviewState, reviewedAt, reviewedByUserId, reviewResolution, reviewNote };\n}\n\nfunction normalizeReviewResolution(\n  input: OfflineQueueReviewResolutionInput,\n): Required<Omit<OfflineQueueReviewResolutionInput, 'note'>> & { readonly note: string | null } {\n  const note = input.note?.trim() ?? null;\n  if (\n    !Number.isFinite(Date.parse(input.reviewedAt)) ||\n    !isUuidV7(input.reviewedByUserId) ||\n    input.resolution !== 'acknowledged' ||\n    (note !== null && (note.length === 0 || note.length > MAX_REVIEW_NOTE_LENGTH))\n  ) {\n    throw new OfflineStoreError('corrupt', 'Queue review resolution is invalid.');\n  }\n  return {\n    reviewedAt: input.reviewedAt,\n    reviewedByUserId: input.reviewedByUserId,\n    resolution: input.resolution,\n    note,\n  };\n}\n\nfunction decodeStoredQueueRow(")

          replace_once(store,
          "  const payload = parseQueuePayload(value.payloadJson);\n  const input: QueueOperationInput = {",
          "  const review = decodeQueueReviewMetadata(value);\n  const payload = parseQueuePayload(value.payloadJson);\n  const input: QueueOperationInput = {")

          replace_once(store,
          "    stored: value as unknown as StoredQueuedOperation,\n    operation: {",
          "    stored: {\n      ...(value as unknown as StoredQueuedOperation),\n      ...review,\n    },\n    operation: {")

          replace_once(store,
          "async function listRejectedQueuedOperations(\n  database: IDBDatabase,\n  partition: QueuePartition,\n  limit: number,\n): Promise<readonly QueuedOperation[]> {",
          "async function listRejectedQueuedOperations(\n  database: IDBDatabase,\n  partition: QueuePartition,\n  limit: number,\n): Promise<readonly QueuedOperation[]> {")

          anchor = "function validateClaimRequest(request: QueueClaimRequest): number {"
          addition = r'''function toOfflineQueueReview(
  decoded: ReturnType<typeof decodeStoredQueueRow>,
): OfflineQueueReview {
  if (decoded.operation.state !== 'rejected') {
    throw new OfflineStoreError('corrupt', 'Only rejected queue operations may enter review.');
  }
  const review = decodeQueueReviewMetadata(decoded.stored as unknown as Readonly<Record<string, unknown>>);
  if (review.reviewState === null) {
    throw new OfflineStoreError('corrupt', 'Rejected queue operation is missing review state.');
  }
  return {
    operation: decoded.operation,
    rejectedAt: review.rejectedAt,
    reviewState: review.reviewState,
    resolution:
      review.reviewState === 'resolved'
        ? {
            reviewedAt: review.reviewedAt!,
            reviewedByUserId: review.reviewedByUserId!,
            resolution: review.reviewResolution!,
            note: review.reviewNote,
          }
        : null,
  };
}

async function listRejectedQueueReviews(
  database: IDBDatabase,
  partition: QueuePartition,
  limit: number,
): Promise<readonly OfflineQueueReview[]> {
  const partitionKey = queuePartitionKey(partition);
  const bounded = Math.min(Math.max(Math.trunc(limit), 1), MAX_QUEUE_READ);
  const transaction = database.transaction(OFFLINE_TRANSACTION_QUEUE_STORE, 'readonly');
  const done = transactionDone(transaction);
  const index = transaction.objectStore(OFFLINE_TRANSACTION_QUEUE_STORE).index(QUEUE_ORDER_INDEX);
  const range = IDBKeyRange.bound([partitionKey, ''], [partitionKey, '\uffff']);
  const request = index.openCursor(range, 'next');
  const reviews: OfflineQueueReview[] = [];
  try {
    await new Promise<void>((resolve, reject) => {
      request.onerror = () => reject(classifyIndexedDbError(request.error));
      request.onsuccess = () => {
        const cursor = request.result;
        if (cursor === null || reviews.length >= bounded) {
          resolve();
          return;
        }
        try {
          const decoded = decodeStoredQueueRow(cursor.value, partition);
          if (decoded.operation.state === 'rejected') reviews.push(toOfflineQueueReview(decoded));
          if (reviews.length >= bounded) {
            resolve();
            return;
          }
          cursor.continue();
        } catch (error) {
          transaction.abort();
          reject(classifyIndexedDbError(error));
        }
      };
    });
    await done;
    return reviews;
  } catch (error) {
    await done.catch(() => undefined);
    throw classifyIndexedDbError(error);
  }
}

'''
