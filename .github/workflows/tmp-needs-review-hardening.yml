name: Temporary Needs Review Hardening

on:
  push:
    branches:
      - strike/product-routing-p0

permissions:
  contents: write

concurrency:
  group: tmp-needs-review-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - name: Apply durable needs-review lifecycle
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}')
              p.write_text(text.replace(old, new, 1))

          store = 'apps/pos-web/src/lib/offline-store.ts'
          replace_once(store,
