          old = '''          {offlineSync.state.needsReview.length > 0 ? (\n            <StatusNote tone="warning" className="mb-3" live>\n              توجد {offlineSync.state.needsReview.length} عملية بيع دون اتصال رفضها الخادم وتحتاج\n              مراجعة. لم تُحذف ولم تُحوّل إلى بيع معتمد محلياً.\n            </StatusNote>\n          ) : null}'''
          new = '''          {offlineSync.state.needsReview.length > 0 ? (\n            <div className="mb-3 space-y-2">\n              <StatusNote tone="warning" live>\n                توجد {offlineSync.state.needsReview.length} عملية بيع دون اتصال رفضها الخادم وتحتاج\n                مراجعة. لم تُحذف ولم تُحوّل إلى بيع معتمد محلياً.\n              </StatusNote>\n              {offlineSync.state.needsReview.map((review) => (\n                <div\n                  key={review.operationId}\n                  className="flex flex-col gap-2 rounded-lg border border-amber-300/70 bg-amber-50/60 p-3 text-sm dark:bg-amber-950/20 sm:flex-row sm:items-center sm:justify-between"\n                >\n                  <div className="min-w-0">\n                    <p className="font-semibold">عملية مرفوضة محفوظة للمراجعة</p>\n                    <p className="break-all text-muted-foreground">{review.operationId}</p>\n                    <p className="text-muted-foreground">السبب: {review.reason}</p>\n                    <p className="text-muted-foreground">\n                      الدليل المحلي: {review.localEvidence === 'decoded' ? 'مقروء' : 'محمي وغير قابل للفك'}\n                    </p>\n                  </div>\n                  <Button\n                    type="button"\n                    className="shrink-0"\n                    onClick={() => offlineSync.resolveReview(review.operationId)}\n                  >\n                    تسجيل المراجعة\n                  </Button>\n                </div>\n              ))}\n            </div>\n          ) : null}'''
