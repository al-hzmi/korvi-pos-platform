name: V2 One-Shot Format Fix

on:
  push:
    branches:
      - mastermind/v2-strengthening
    paths:
      - .github/workflows/v2-one-shot-format-fix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: mastermind/v2-strengthening
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact lockfile
        run: npm ci --registry=https://registry.npmjs.org

      - name: Format V2-2 authority files and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write             apps/api/src/checkout/service.ts             apps/api/src/routes/business.ts             packages/database/src/__tests__/promotions-authority-live.test.ts             packages/database/src/errors.ts             packages/database/src/repositories/promotion-repository.ts             packages/database/src/repositories/sale-repository.ts
          rm .github/workflows/v2-one-shot-format-fix.yml
          git diff --check

      - name: Commit exact formatter output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "korvi-v2-format"
          git config user.email "actions@users.noreply.github.com"
          git add             apps/api/src/checkout/service.ts             apps/api/src/routes/business.ts             packages/database/src/__tests__/promotions-authority-live.test.ts             packages/database/src/errors.ts             packages/database/src/repositories/promotion-repository.ts             packages/database/src/repositories/sale-repository.ts             .github/workflows/v2-one-shot-format-fix.yml
          git commit -m "style(v2-2): apply canonical formatter"
          git push origin HEAD:mastermind/v2-strengthening
