name: Dispatch Runtime Promotion Proof

on:
  push:
    branches:
      - review/runtime-promotion-proof-dispatch

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch Stage 5D against clean promotion candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/stage-5d-browser-proof.yml/dispatches" \
            -f ref='review/runtime-19-3-promotion'

      - name: Check out helper branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Remove dispatcher
        run: |
          set -euo pipefail
          rm .github/workflows/dispatch-runtime-promotion-proof.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/dispatch-runtime-promotion-proof.yml
          git diff --cached --check
          git commit -m "chore(review): remove runtime promotion proof dispatcher"
          git push origin HEAD:review/runtime-promotion-proof-dispatch
