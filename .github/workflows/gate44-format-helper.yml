name: Gate 44 Format Helper

on:
  push:
    branches:
      - review/offline-44-sync-engine

permissions:
  contents: write

jobs:
  format-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: review/offline-44-sync-engine
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - name: Format Gate 44 implementation
        run: |
          npx prettier --write \
            packages/domain/src/ports/offline.ts \
            apps/pos-web/src/lib/offline-store.ts \
            apps/pos-web/src/lib/sync-engine.ts \
            apps/pos-web/src/lib/checkout-sync-executor.ts
      - name: Commit formatting only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/domain/src/ports/offline.ts apps/pos-web/src/lib/offline-store.ts apps/pos-web/src/lib/sync-engine.ts apps/pos-web/src/lib/checkout-sync-executor.ts
          if git diff --cached --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'style(offline): format Gate 44 implementation'
          git push origin HEAD:review/offline-44-sync-engine
