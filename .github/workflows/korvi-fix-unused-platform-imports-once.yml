name: Korvi fix unused platform imports once

on:
  push:
    branches:
      - strike/product-routing-p0
    paths:
      - .github/workflows/korvi-fix-unused-platform-imports-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: strike/product-routing-p0
          fetch-depth: 1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node scripts/verify-package-manager.mjs
      - run: npm ci --registry=https://registry.npmjs.org
      - name: Remove dead imports and verify formatting
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              'apps/api/src/__tests__/platform-auth-routes.test.ts': (
                  "import { afterEach, describe, expect, it, vi } from 'vitest';",
                  "import { afterEach, describe, expect, it } from 'vitest';",
              ),
              'apps/api/src/platform/auth.ts': (
                  "import type { FastifyReply, FastifyRequest, preHandlerAsyncHookHandler } from 'fastify';",
                  "import type { FastifyReply, preHandlerAsyncHookHandler } from 'fastify';",
              ),
              'apps/pos-web/src/components/platform/platform-tenant.tsx': (
                  "import { useCallback, useEffect, useMemo, useState } from 'react';",
                  "import { useCallback, useEffect, useState } from 'react';",
              ),
          }
          for filename, (old, new) in replacements.items():
              path = Path(filename)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'expected import not found: {filename}')
              path.write_text(text.replace(old, new, 1))
          PY
          npx prettier --write apps/api/src/__tests__/platform-auth-routes.test.ts apps/api/src/platform/auth.ts apps/pos-web/src/components/platform/platform-tenant.tsx
          npm run lint
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/korvi-fix-unused-platform-imports-once.yml
          git config user.name korvi-ci
          git config user.email korvi-ci@users.noreply.github.com
          git add apps/api/src/__tests__/platform-auth-routes.test.ts apps/api/src/platform/auth.ts apps/pos-web/src/components/platform/platform-tenant.tsx .github/workflows/korvi-fix-unused-platform-imports-once.yml
          git commit -m "fix(platform): remove dead imports blocking verification"
          git push origin HEAD:strike/product-routing-p0
