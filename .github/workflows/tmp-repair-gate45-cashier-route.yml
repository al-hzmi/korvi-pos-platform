name: Temporary Repair Gate 45 Cashier Route

on:
  push:
    branches:
      - strike/product-routing-p0
    paths:
      - .github/workflows/tmp-repair-gate45-cashier-route.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out authoritative branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: strike/product-routing-p0
          fetch-depth: 0

      - name: Repair Gate 45 browser entry route
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/gate45-offline-reconciliation-proof.mjs')
          text = path.read_text()
          old = "const target = await createTarget(`${baseUrl}/`);"
          new = "const target = await createTarget(`${baseUrl}/cashier`);"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale Gate 45 target, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          git diff -- scripts/gate45-offline-reconciliation-proof.mjs

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/gate45-offline-reconciliation-proof.mjs
          git diff --cached --check
          git commit -m "test(gate45): use explicit cashier route"
          git push origin HEAD:strike/product-routing-p0
