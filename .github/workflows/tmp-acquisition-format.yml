name: Temporary Acquisition Formatter

on:
  push:
    branches:
      - integration/acquisition-ar0-ar1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npx prettier --write scripts/verify-versions.mjs
      - name: Commit formatted policy and remove one-shot workflow
        run: |
          rm .github/workflows/tmp-acquisition-format.yml
          git config user.name "korvi-ci"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/verify-versions.mjs .github/workflows/tmp-acquisition-format.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(format): acquisition release version policy"
          git push origin HEAD:integration/acquisition-ar0-ar1
