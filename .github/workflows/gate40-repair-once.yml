name: Gate 40 Repair Once

on:
  push:
    branches: [review/zatca-40-submission-pipeline]
    paths: [.github/workflows/gate40-repair-once.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: review/zatca-40-submission-pipeline
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - name: Repair reconciliation state clearing and replay-safe live fixtures
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          repo = Path('packages/database/src/zatca/invoice-submission-repository.ts')
          text = repo.read_text()
          old = '''             "authorityStatus" = ${result.authorityStatus},
             "clearedInvoiceXml" = ${cleared},
             "updatedAt" = ${new Date(result.resolvedAt)}'''
          new = '''             "authorityStatus" = ${result.authorityStatus},
             "rejectionCode" = NULL,
             "uncertaintyReason" = NULL,
             "clearedInvoiceXml" = ${cleared},
             "updatedAt" = ${new Date(result.resolvedAt)}'''
          if old not in text:
              raise SystemExit('accepted transition anchor not found')
          text = text.replace(old, new, 1)

          old = '''             "httpStatus" = ${result.httpStatus},
             "rejectionCode" = ${result.rejectionCode},
             "updatedAt" = ${new Date(result.resolvedAt)}'''
          new = '''             "httpStatus" = ${result.httpStatus},
             "authorityStatus" = NULL,
             "rejectionCode" = ${result.rejectionCode},
             "uncertaintyReason" = NULL,
             "clearedInvoiceXml" = NULL,
             "updatedAt" = ${new Date(result.resolvedAt)}'''
          if old not in text:
              raise SystemExit('rejected transition anchor not found')
          text = text.replace(old, new, 1)
          repo.write_text(text)

          test = Path('packages/database/src/__tests__/zatca-invoice-submission-live.test.ts')
          text = test.read_text()
          if "import { randomBytes } from 'node:crypto';" not in text:
              text = text.replace(
                  "import { afterAll, beforeAll, describe, expect, it } from 'vitest';",
                  "import { randomBytes } from 'node:crypto';\nimport { afterAll, beforeAll, describe, expect, it } from 'vitest';",
                  1,
              )
          anchor = "const url = process.env['KORVI_TEST_DATABASE_URL'] ?? '';\n"
          if "const RUN_TOKEN = randomBytes(2).toString('hex');" not in text:
              if anchor not in text:
                  raise SystemExit('run token anchor not found')
              text = text.replace(anchor, anchor + "const RUN_TOKEN = randomBytes(2).toString('hex');\n", 1)

          ids = [
              '0000000001a1','0000000001b1','0000000001a2','0000000001b2',
              '0000000001a3','0000000001b3','0000000001a4','0000000001b4',
              '0000000001a5','0000000001b5','0000000001a6','0000000001b6',
              '0000000001a7','0000000001b7','0000000001a8','0000000001b8',
          ]
          for tail in ids:
              old_id = "'018f6a00-0000-7000-8000-" + tail + "'"
              new_id = '`018f6a00-${RUN_TOKEN}-7000-8000-' + tail + '`'
              if old_id not in text:
                  raise SystemExit('fixture id anchor not found: ' + tail)
              text = text.replace(old_id, new_id, 1)

          cleanup = '''    for (const tenant of [D.tenantA, D.tenantB]) {
      await inTenant(admin, tenant, async () => {
        await admin.query('DELETE FROM "tenants" WHERE "id"=$1', [tenant]);
      });
    }
'''
          if text.count(cleanup) != 2:
              raise SystemExit('expected two cleanup blocks, found ' + str(text.count(cleanup)))
          text = text.replace(cleanup, '')

          old = "[tenant, `ZATCA submit ${suffix}`, `zatca-submit-${suffix}`],"
          new = "[tenant, `ZATCA submit ${suffix}`, `zatca-submit-${suffix}-${RUN_TOKEN}`],"
          if old not in text:
              raise SystemExit('tenant slug anchor not found')
          text = text.replace(old, new, 1)

          old = "[user, tenant, `${suffix}@example.test`, `User ${suffix}`],"
          new = "[user, tenant, `${suffix}.${RUN_TOKEN}@example.test`, `User ${suffix}`],"
          if old not in text:
              raise SystemExit('user email anchor not found')
          text = text.replace(old, new, 1)
          test.write_text(text)
          PY
          npx prettier --write \
            packages/database/src/zatca/invoice-submission-repository.ts \
            packages/database/src/__tests__/zatca-invoice-submission-live.test.ts
          git diff --check
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            packages/database/src/zatca/invoice-submission-repository.ts \
            packages/database/src/__tests__/zatca-invoice-submission-live.test.ts
          if git diff --cached --quiet; then
            echo 'No repair needed.'
            exit 0
          fi
          git commit -m 'fix(zatca): harden Gate 40 reconciliation evidence'
          git push origin HEAD:review/zatca-40-submission-pipeline
