name: Strike 5C Format Materializer

on:
  push:
    branches:
      - strike/5c-costing-authority

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci --registry=https://registry.npmjs.org
      - name: Materialize Prettier output
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write packages/domain/src/costing/costing.ts packages/domain/src/costing/__tests__/costing.test.ts
          git diff --check
          if ! git diff --quiet; then
            git config user.name 'Korvi Validation Automation'
            git config user.email 'actions@users.noreply.github.com'
            git add packages/domain/src/costing/costing.ts packages/domain/src/costing/__tests__/costing.test.ts
            git commit -m 'style(costing): materialize prettier output'
            git push origin HEAD:strike/5c-costing-authority
          fi
