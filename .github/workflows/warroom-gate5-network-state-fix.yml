name: War Room Gate 5 Network State Fix

on:
  push:
    branches:
      - warroom/offline-full-shift
    paths:
      - .github/workflows/warroom-gate5-network-state-fix.yml

permissions:
  contents: write

jobs:
  patch-proof-harness:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Gate 5 lane
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: warroom/offline-full-shift
          fetch-depth: 1

      - name: Bind request outage and navigator state explicitly
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/gate5-full-shift-offline-proof.mjs')
          source = path.read_text()
          old = """async function setNetwork(cdp, offline, latency = 0) {
            await cdp.send('Network.emulateNetworkConditions', {
              offline,
              latency,
              downloadThroughput: offline ? 0 : -1,
              uploadThroughput: offline ? 0 : -1,
            });
          }
          """
          new = """async function setNetwork(cdp, offline, latency = 0) {
            const conditions = {
              offline,
              latency,
              downloadThroughput: offline ? 0 : -1,
              uploadThroughput: offline ? 0 : -1,
            };
            await cdp.send('Network.emulateNetworkConditions', conditions);
            await cdp.send('Network.overrideNetworkState', conditions);
          }
          """
          if source.count(old) != 1:
              raise SystemExit('expected exactly one Gate 5 setNetwork implementation')
          path.write_text(source.replace(old, new))
          PY
          rm .github/workflows/warroom-gate5-network-state-fix.yml
          git diff --check

      - name: Commit exact harness correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'korvi-release-integrator'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/gate5-full-shift-offline-proof.mjs .github/workflows/warroom-gate5-network-state-fix.yml
          git diff --cached --check
          git commit -m 'test(offline): explicitly override navigator network state'
          git push origin HEAD:warroom/offline-full-shift
