name: Gate 44 Final Format Helper

on:
  push:
    branches:
      - review/offline-44-sync-engine

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: review/offline-44-sync-engine
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - name: Format exact Gate 44 proof sources
        run: |
          npx prettier --write \
            apps/pos-web/src/lib/__tests__/checkout-sync-executor.test.ts \
            apps/pos-web/src/lib/__tests__/sync-engine.test.ts \
            scripts/gate44-browser/main.ts \
            scripts/gate44-sync-proof.mjs
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/pos-web/src/lib/__tests__/checkout-sync-executor.test.ts \
            apps/pos-web/src/lib/__tests__/sync-engine.test.ts \
            scripts/gate44-browser/main.ts \
            scripts/gate44-sync-proof.mjs
          git diff --cached --check
          git commit -m 'style(offline): format Gate 44 proof sources'
          git push origin HEAD:review/offline-44-sync-engine
