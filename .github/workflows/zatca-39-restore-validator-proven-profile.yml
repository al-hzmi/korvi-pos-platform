name: ZATCA 39 Restore Validator-Proven Sealing Profile

on:
  push:
    branches:
      - review/zatca-39-csid-lifecycle
    paths:
      - .github/workflows/zatca-39-restore-validator-proven-profile.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out live branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: review/zatca-39-csid-lifecycle
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact lockfile
        run: npm ci --registry=https://registry.npmjs.org

      - name: Restore only validator-proven Fatoora representation
        shell: bash
        run: |
          set -euo pipefail
          proven='24962c97a020236112b2e0c4505feb49ace5ba72'

          git checkout "$proven" -- \
            apps/api/src/zatca/seal-simplified-invoice.ts \
            apps/api/src/__tests__/zatca-seal-simplified-invoice.test.ts \
            packages/domain/src/zatca/xades-envelope.ts \
            packages/domain/src/zatca/__tests__/xades-envelope.test.ts \
            packages/domain/src/zatca/tlv.ts \
            packages/domain/src/zatca/__tests__/tlv.test.ts \
            packages/domain/src/zatca/x509.ts \
            packages/domain/src/zatca/__tests__/x509.test.ts \
            packages/domain/src/ports/zatca.ts

          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          function replaceExactlyOnce(path, before, after) {
            const input = readFileSync(path, 'utf8');
            const first = input.indexOf(before);
            if (first < 0 || input.indexOf(before, first + before.length) >= 0) {
              throw new Error(`Expected exactly one target in ${path}`);
            }
            writeFileSync(path, input.slice(0, first) + after + input.slice(first + before.length));
          }

          const provider = 'apps/api/src/zatca/azure-key-vault-signing-key.ts';
          replaceExactlyOnce(
            provider,
            `  public async signSha256(input: ZatcaSignInput): Promise<Uint8Array> {\n    if (input.message.length === 0) {\n      throw new ZatcaInvoiceError('ZATCA signing message must not be empty.');\n    }`,
            `  public async signSha256(input: ZatcaSignInput): Promise<Uint8Array> {\n    if (input.message.length !== SHA256_BYTES) {\n      throw new ZatcaInvoiceError('ZATCA invoice hash must be exactly 32 bytes before stamping.');\n    }`,
          );

          const providerTest = 'apps/api/src/__tests__/zatca-azure-key-vault-signing-key.test.ts';
          replaceExactlyOnce(
            providerTest,
            `  it('hashes canonical SignedInfo once for Azure ES256K, normalizes high-S, and returns verified DER', async () => {\n    const { privateKey, publicKey } = generateKeyPairSync('ec', { namedCurve: 'secp256k1' });\n    const publicJwk = publicKey.export({ format: 'jwk' });\n    const client = fakeClient(bundle(publicJwk), privateKey);\n    const port = new AzureKeyVaultSigningKeyPort({ client });\n    const signedInfo = Buffer.from(\n      '<ds:SignedInfo><ds:Reference URI=""><ds:DigestValue>invoice</ds:DigestValue></ds:Reference><ds:Reference URI="#xadesSignedProperties"><ds:DigestValue>properties</ds:DigestValue></ds:Reference></ds:SignedInfo>',\n      'utf8',\n    );\n\n    const signatureDer = await port.signSha256({\n      scope: SCOPE,\n      terminalId: TERMINAL_ID,\n      key: handle(),\n      message: signedInfo,\n    });\n\n    expect(client.signDigest).toHaveBeenCalledWith(\n      KEY_ID,\n      Uint8Array.from(createHash('sha256').update(signedInfo).digest()),\n    );\n    expect(verify('sha256', signedInfo, publicKey, signatureDer)).toBe(true);\n    const raw = ecdsaDerToXmlDsigSignature(signatureDer);\n    expect(bytesToBigInt(raw.subarray(32))).toBeLessThanOrEqual(LOW_S_LIMIT);\n  });`,
            `  it('hashes the exact 32-byte invoice hash once for Azure ES256K and returns verified DER', async () => {\n    const { privateKey, publicKey } = generateKeyPairSync('ec', { namedCurve: 'secp256k1' });\n    const publicJwk = publicKey.export({ format: 'jwk' });\n    const client = fakeClient(bundle(publicJwk), privateKey);\n    const port = new AzureKeyVaultSigningKeyPort({ client });\n    const invoiceHash = createHash('sha256').update('validator-proven-invoice').digest();\n\n    const signatureDer = await port.signSha256({\n      scope: SCOPE,\n      terminalId: TERMINAL_ID,\n      key: handle(),\n      message: invoiceHash,\n    });\n\n    expect(client.signDigest).toHaveBeenCalledWith(\n      KEY_ID,\n      Uint8Array.from(createHash('sha256').update(invoiceHash).digest()),\n    );\n    expect(verify('sha256', invoiceHash, publicKey, signatureDer)).toBe(true);\n    const raw = ecdsaDerToXmlDsigSignature(signatureDer);\n    expect(bytesToBigInt(raw.subarray(32))).toBeLessThanOrEqual(LOW_S_LIMIT);\n\n    await expect(\n      port.signSha256({\n        scope: SCOPE,\n        terminalId: TERMINAL_ID,\n        key: handle(),\n        message: new Uint8Array(31),\n      }),\n    ).rejects.toThrow(/exactly 32 bytes/);\n    await expect(\n      port.signSha256({\n        scope: SCOPE,\n        terminalId: TERMINAL_ID,\n        key: handle(),\n        message: new Uint8Array(33),\n      }),\n    ).rejects.toThrow(/exactly 32 bytes/);\n  });`,
          );

          const adr = 'docs/decisions/ADR-0033-zatca-csid-and-signing-key-boundary.md';
          replaceExactlyOnce(
            adr,
            `### 6. Signing is message-in/signature-out\n\nThe domain supplies bytes to \`signSha256\`; the security module applies ECDSA **secp256k1** with SHA-256 and returns the signature only. For XAdES, those input bytes are the canonicalised \`ds:SignedInfo\` bytes, whose references bind the invoice digest and the signed-properties digest.\n\nThis follows the current Security Features Implementation Standards' XAdES/XMLDSIG structure. The older detailed signing walkthrough describes the operation more loosely as signing the generated invoice hash; Korvi does not collapse XMLDSIG \`SignedInfo\` signing into a raw-digest shortcut unless the current official validator proves that requirement.\n\nNo caller may ask the provider to return the private key so it can sign locally.`,
            `### 6. Signing is message-in/signature-out, pinned to the live Fatoora validator profile\n\nThe domain supplies the raw 32-byte SHA-256 invoice hash to \`signSha256\`; the security module applies ECDSA **secp256k1** with SHA-256 and returns the signature only. No caller may ask the provider to return the private key so it can sign locally.\n\nThis representation is not inferred from generic XMLDSIG semantics. On 10 September 2026 Korvi ran the production sealer against ZATCA's live public validator as a four-revision differential matrix. The profile that signed the raw invoice hash and serialized DER/Base64 cryptographic values reached the validator with only test-certificate issuer/serial findings. Changing the signed message to canonicalised \`ds:SignedInfo\` introduced \`SIGNATURE_ERROR/signatureValue\`; subsequent raw/P1363 QR reinterpretations introduced additional \`hashedXml\`, public-key and certificate-signature findings.\n\nTherefore the live Fatoora validator behavior is the compatibility authority for this profile. Future changes to the signed message or QR cryptographic byte representation require a fresh official-validator differential proof before merge.`,
          );
          NODE

          npx prettier --write \
            apps/api/src/zatca/seal-simplified-invoice.ts \
            apps/api/src/__tests__/zatca-seal-simplified-invoice.test.ts \
            apps/api/src/zatca/azure-key-vault-signing-key.ts \
            apps/api/src/__tests__/zatca-azure-key-vault-signing-key.test.ts \
            packages/domain/src/zatca/xades-envelope.ts \
            packages/domain/src/zatca/__tests__/xades-envelope.test.ts \
            packages/domain/src/zatca/tlv.ts \
            packages/domain/src/zatca/__tests__/tlv.test.ts \
            packages/domain/src/zatca/x509.ts \
            packages/domain/src/zatca/__tests__/x509.test.ts \
            packages/domain/src/ports/zatca.ts

      - name: Build domain for targeted proof
        run: npm run build -w @korvi/domain

      - name: Targeted validator-profile regression proof
        run: |
          npx vitest run \
            packages/domain/src/zatca/__tests__/ecdsa.test.ts \
            packages/domain/src/zatca/__tests__/x509.test.ts \
            packages/domain/src/zatca/__tests__/tlv.test.ts \
            packages/domain/src/zatca/__tests__/xades.test.ts \
            packages/domain/src/zatca/__tests__/xades-envelope.test.ts \
            packages/config/src/__tests__/zatca-architecture.test.ts \
            apps/api/src/__tests__/zatca-azure-key-vault-signing-key.test.ts \
            apps/api/src/__tests__/zatca-seal-simplified-invoice.test.ts

      - name: Full verify before commit
        run: npm run verify

      - name: Commit only verified restore and remove diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/zatca-39-restore-validator-proven-profile.yml \
            .github/workflows/zatca-39-validator-regression-matrix.yml
          git add \
            apps/api/src/zatca/seal-simplified-invoice.ts \
            apps/api/src/__tests__/zatca-seal-simplified-invoice.test.ts \
            apps/api/src/zatca/azure-key-vault-signing-key.ts \
            apps/api/src/__tests__/zatca-azure-key-vault-signing-key.test.ts \
            packages/domain/src/zatca/xades-envelope.ts \
            packages/domain/src/zatca/__tests__/xades-envelope.test.ts \
            packages/domain/src/zatca/tlv.ts \
            packages/domain/src/zatca/__tests__/tlv.test.ts \
            packages/domain/src/zatca/x509.ts \
            packages/domain/src/zatca/__tests__/x509.test.ts \
            packages/domain/src/ports/zatca.ts \
            docs/decisions/ADR-0033-zatca-csid-and-signing-key-boundary.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(zatca): restore validator-proven sealing profile'
          git push origin HEAD:review/zatca-39-csid-lifecycle
