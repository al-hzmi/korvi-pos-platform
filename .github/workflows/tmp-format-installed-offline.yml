name: Temporary Wire Local Store Protection

on:
  push:
    branches: ['strike/product-routing-p0']

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: strike/product-routing-p0

      - name: Wire Native commands
        shell: python
        run: |
          from pathlib import Path
          p = Path('apps/cashier-client/src-tauri/src/lib.rs')
          text = p.read_text()

          if 'mod local_protection;' not in text:
              text = text.replace('mod device_identity;\nmod offline_authority;', 'mod device_identity;\nmod local_protection;\nmod offline_authority;')

          marker = '#[tauri::command]\nasync fn native_login<R: Runtime>('
          commands = '''#[tauri::command]\nfn protect_local_store<R: Runtime>(\n    app: AppHandle<R>,\n    plaintext_base64: String,\n    aad_base64: String,\n) -> Result<String, String> {\n    local_protection::protect(&app, &plaintext_base64, &aad_base64)\n}\n\n#[tauri::command]\nfn unprotect_local_store<R: Runtime>(\n    app: AppHandle<R>,\n    protected_base64: String,\n    aad_base64: String,\n) -> Result<String, String> {\n    local_protection::unprotect(&app, &protected_base64, &aad_base64)\n}\n\n'''
          if 'fn protect_local_store<R: Runtime>(' not in text:
              if marker not in text:
                  raise SystemExit('native_login marker missing')
              text = text.replace(marker, commands + marker)

          handler_marker = '            offline_authority_material,\n            bind_device,'
          handler_new = '            offline_authority_material,\n            protect_local_store,\n            unprotect_local_store,\n            bind_device,'
          if '            protect_local_store,\n            unprotect_local_store,' not in text:
              if handler_marker not in text:
                  raise SystemExit('invoke handler marker missing')
              text = text.replace(handler_marker, handler_new)

          p.write_text(text)

      - name: Rust format
        run: cargo fmt --manifest-path apps/cashier-client/src-tauri/Cargo.toml

      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Rust host check
        run: cargo check --manifest-path apps/cashier-client/src-tauri/Cargo.toml
        env:
          KORVI_NATIVE_API_ORIGIN: https://api.example.invalid

      - name: Commit Native command wiring
        run: |
          if git diff --quiet -- apps/cashier-client/src-tauri/src/lib.rs apps/cashier-client/src-tauri/src/local_protection.rs apps/cashier-client/src-tauri/tauri-plugin-korvi-device-identity/src/lib.rs apps/cashier-client/src-tauri/tauri-plugin-korvi-device-identity/android/src/main/java/DeviceIdentityPlugin.kt; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/cashier-client/src-tauri/src/lib.rs apps/cashier-client/src-tauri/src/local_protection.rs apps/cashier-client/src-tauri/tauri-plugin-korvi-device-identity/src/lib.rs apps/cashier-client/src-tauri/tauri-plugin-korvi-device-identity/android/src/main/java/DeviceIdentityPlugin.kt
          git commit -m "feat(cashier): wire OS-backed local store protection"
          git push origin HEAD:strike/product-routing-p0
