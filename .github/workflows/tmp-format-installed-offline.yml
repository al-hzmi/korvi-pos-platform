            ("    [api, offlinePartition, onUnauthenticated],",
             "    [api, offlinePartition, offlineProtector, onUnauthenticated],")
          ])

          patch('apps/pos-web/src/hooks/use-offline-sale-sync.ts', [
            ("import { syncOfflineCheckouts, type OfflineSaleReviewCase } from '../lib/offline-checkout';",
             "import { syncOfflineCheckouts, type OfflineSaleReviewCase } from '../lib/offline-checkout';\nimport { openKorviOfflineStore } from '../lib/offline-store';\nimport type { OfflineStoreProtector } from '../lib/offline-protection';"),
            ("  onUnauthenticated: () => void,\n): { readonly state: OfflineSaleSyncState; readonly retry: () => void } {",
             "  onUnauthenticated: () => void,\n  protector?: OfflineStoreProtector,\n): { readonly state: OfflineSaleSyncState; readonly retry: () => void } {"),
            ("    void syncOfflineCheckouts(api, partition, onUnauthenticated)",
