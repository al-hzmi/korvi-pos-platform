name: Temporary Protect Installed Durable State

on:
  push:
    branches: ['strike/product-routing-p0']

permissions:
  contents: write

jobs:
  protect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: strike/product-routing-p0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --registry=https://registry.npmjs.org

      - name: Apply installed durable-state protection
        shell: python
        run: |
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              text = p.read_text()
              for old, new in replacements:
                  if old in text:
                      if text.count(old) != 1:
                          raise SystemExit(f"ambiguous patch in {path}: {old[:100]!r}")
                      text = text.replace(old, new)
                  elif new not in text:
                      raise SystemExit(f"patch context missing in {path}: {old[:100]!r}")
              p.write_text(text)

          protection = r'''import type {
            QueueOperationInput,
            QueuePartition,
            QueuedOperation,
          } from '@korvi/domain';
          import type { CheckoutRequest } from './api-types';
          import { isCheckoutQueuePayload } from './checkout-sync-executor';
          import {
            OFFLINE_DB_VERSION,
            OfflineStoreError,
            isOfflineSaleDraft,
            type OfflineSaleDraft,
            type OfflineSaleScope,
            type ProtectedSaleDraftPayload,
          } from './offline-store';

          export const LOCAL_STORE_PROTECTION_VERSION = 1 as const;
          const INSTALLATION_ID = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;

          export interface OfflineStoreProtector {
            readonly installationId: string;
            readonly deviceEnrollmentId: string;
            protect(plaintextUtf8: string, aadUtf8: string): Promise<string>;
            unprotect(ciphertextBase64: string, aadUtf8: string): Promise<string>;
          }

          export interface ProtectedCheckoutPayload {
            readonly protection: 'korvi-native-v1';
            readonly protectionVersion: 1;
            readonly databaseVersion: number;
            readonly ciphertext: string;
          }

          function fail(message: string): never {
            throw new OfflineStoreError('corrupt', message);
          }

          function assertProtectorBinding(
            deviceEnrollmentId: string | undefined,
            protector: OfflineStoreProtector,
          ): void {
            if (
              deviceEnrollmentId === undefined ||
              deviceEnrollmentId !== protector.deviceEnrollmentId ||
              !INSTALLATION_ID.test(protector.installationId)
            ) {
              fail('Installed local-store protection identity does not match the active device binding.');
            }
          }

          function isRecord(value: unknown): value is Readonly<Record<string, unknown>> {
            return typeof value === 'object' && value !== null;
          }

          export function isProtectedCheckoutPayload(value: unknown): value is ProtectedCheckoutPayload {
            return (
              isRecord(value) &&
              value.protection === 'korvi-native-v1' &&
              value.protectionVersion === LOCAL_STORE_PROTECTION_VERSION &&
              value.databaseVersion === OFFLINE_DB_VERSION &&
              typeof value.ciphertext === 'string' &&
              value.ciphertext.length > 0
            );
          }

          function queueAad(
            partition: QueuePartition,
            operation: Pick<QueueOperationInput, 'id' | 'kind' | 'enqueuedAt'>,
            protector: OfflineStoreProtector,
            databaseVersion: number,
          ): string {
            assertProtectorBinding(partition.deviceEnrollmentId, protector);
            return JSON.stringify([
              'korvi-local-store',
              LOCAL_STORE_PROTECTION_VERSION,
              databaseVersion,
              'sale.checkout',
              partition.tenantId,
              partition.branchId,
              partition.terminalId,
              partition.deviceEnrollmentId,
              protector.installationId,
              operation.id,
              operation.kind,
              operation.enqueuedAt,
            ]);
          }

          function draftAad(
            scope: OfflineSaleScope,
            updatedAt: string,
            protector: OfflineStoreProtector,
            databaseVersion: number,
          ): string {
            assertProtectorBinding(scope.deviceEnrollmentId, protector);
            return JSON.stringify([
              'korvi-local-store',
              LOCAL_STORE_PROTECTION_VERSION,
              databaseVersion,
              'sale-draft',
              scope.tenantId,
              scope.branchId,
              scope.terminalId,
              scope.deviceEnrollmentId,
              protector.installationId,
              scope.userId,
              scope.shiftId,
              updatedAt,
            ]);
          }

          export async function protectCheckoutQueueOperation(
            partition: QueuePartition,
            operation: QueueOperationInput<CheckoutRequest>,
            protector: OfflineStoreProtector,
          ): Promise<QueueOperationInput<ProtectedCheckoutPayload>> {
            if (!isCheckoutQueuePayload(operation.payload) || operation.payload.operationId !== operation.id) {
              fail('Refusing to protect an invalid checkout queue payload.');
            }
            const ciphertext = await protector.protect(
              JSON.stringify(operation.payload),
              queueAad(partition, operation, protector, OFFLINE_DB_VERSION),
            );
            if (ciphertext.length === 0) fail('Native local-store protection returned an empty ciphertext.');
            return {
              ...operation,
              payload: {
                protection: 'korvi-native-v1',
                protectionVersion: LOCAL_STORE_PROTECTION_VERSION,
                databaseVersion: OFFLINE_DB_VERSION,
                ciphertext,
              },
            };
          }

          export async function decodeProtectedCheckoutOperation(
            partition: QueuePartition,
            operation: QueuedOperation,
            protector: OfflineStoreProtector,
          ): Promise<QueuedOperation<CheckoutRequest>> {
            if (!isProtectedCheckoutPayload(operation.payload)) {
              fail('Queued checkout is not protected with the supported installed-store envelope.');
            }
            const plaintext = await protector.unprotect(
              operation.payload.ciphertext,
              queueAad(partition, operation, protector, operation.payload.databaseVersion),
            );
            let payload: unknown;
            try {
              payload = JSON.parse(plaintext) as unknown;
            } catch {
              fail('Protected checkout plaintext is not valid JSON.');
            }
            if (!isCheckoutQueuePayload(payload) || payload.operationId !== operation.id) {
              fail('Protected checkout plaintext failed immutable command validation.');
            }
            return { ...operation, payload } as QueuedOperation<CheckoutRequest>;
          }

          export async function protectSaleDraft(
            scope: OfflineSaleScope,
            draft: OfflineSaleDraft,
            protector: OfflineStoreProtector,
          ): Promise<ProtectedSaleDraftPayload> {
            if (!isOfflineSaleDraft(draft)) fail('Refusing to protect an invalid sale draft.');
            const ciphertext = await protector.protect(
              JSON.stringify(draft),
              draftAad(scope, draft.updatedAt, protector, OFFLINE_DB_VERSION),
            );
            if (ciphertext.length === 0) fail('Native local-store protection returned an empty draft ciphertext.');
            return {
              protectionVersion: LOCAL_STORE_PROTECTION_VERSION,
              databaseVersion: OFFLINE_DB_VERSION,
              ciphertext,
              updatedAt: draft.updatedAt,
            };
          }

          export async function decodeProtectedSaleDraft(
            scope: OfflineSaleScope,
            protectedDraft: ProtectedSaleDraftPayload,
            protector: OfflineStoreProtector,
          ): Promise<OfflineSaleDraft> {
            if (
              protectedDraft.protectionVersion !== LOCAL_STORE_PROTECTION_VERSION ||
              protectedDraft.databaseVersion !== OFFLINE_DB_VERSION ||
              protectedDraft.ciphertext.length === 0
            ) {
              fail('Protected sale draft uses an unsupported local-store envelope.');
            }
            const plaintext = await protector.unprotect(
              protectedDraft.ciphertext,
              draftAad(
                scope,
                protectedDraft.updatedAt,
                protector,
                protectedDraft.databaseVersion,
              ),
            );
            let draft: unknown;
            try {
              draft = JSON.parse(plaintext) as unknown;
            } catch {
              fail('Protected sale draft plaintext is not valid JSON.');
            }
            if (!isOfflineSaleDraft(draft) || draft.updatedAt !== protectedDraft.updatedAt) {
              fail('Protected sale draft failed structural or binding validation.');
            }
            return draft;
          }
          '''
          Path('apps/pos-web/src/lib/offline-protection.ts').write_text(protection)

          patch('apps/pos-web/src/lib/offline-store.ts', [
            ("export const OFFLINE_DB_VERSION = 4;\nexport const OFFLINE_CATALOGUE_STORE = 'catalogue-v1';\nexport const OFFLINE_SALE_DRAFT_STORE = 'sale-drafts-v1';",
             "export const OFFLINE_DB_VERSION = 5;\nexport const OFFLINE_CATALOGUE_STORE = 'catalogue-v1';\nexport const OFFLINE_SALE_DRAFT_STORE = 'sale-drafts-v1';\nexport const OFFLINE_PROTECTED_SALE_DRAFT_STORE = 'protected-sale-drafts-v1';"),
            ("interface StoredSaleDraft extends OfflineSaleDraft, OfflineSaleScope {\n  readonly scopeKey: string;\n}\n\ninterface StoredQueuedOperation {",
             "interface StoredSaleDraft extends OfflineSaleDraft, OfflineSaleScope {\n  readonly scopeKey: string;\n}\n\nexport interface ProtectedSaleDraftPayload {\n  readonly protectionVersion: 1;\n  readonly databaseVersion: number;\n  readonly ciphertext: string;\n  readonly updatedAt: string;\n}\n\ninterface StoredProtectedSaleDraft extends ProtectedSaleDraftPayload, OfflineSaleScope {\n  readonly scopeKey: string;\n}\n\ninterface StoredQueuedOperation {"),
            ("  deleteSaleDraft(scope: OfflineSaleScope): Promise<void>;\n  queueCount(partition: QueuePartition): Promise<number>;",
             "  deleteSaleDraft(scope: OfflineSaleScope): Promise<void>;\n  saveProtectedSaleDraft(\n    scope: OfflineSaleScope,\n    payload: ProtectedSaleDraftPayload,\n  ): Promise<void>;\n  loadProtectedSaleDraft(scope: OfflineSaleScope): Promise<ProtectedSaleDraftPayload | null>;\n  deleteProtectedSaleDraft(scope: OfflineSaleScope): Promise<void>;\n  migrateQueuePayload(\n    partition: QueuePartition,\n    id: string,\n    expectedPayload: unknown,\n    replacementPayload: unknown,\n  ): Promise<void>;\n  queueCount(partition: QueuePartition): Promise<number>;"),
            ("function createQueueSchema(database: IDBDatabase): void {\n  const queue = database.createObjectStore(OFFLINE_TRANSACTION_QUEUE_STORE, {\n    keyPath: 'queueKey',\n  });\n  queue.createIndex(QUEUE_PARTITION_INDEX, 'partitionKey', { unique: false });\n  queue.createIndex(QUEUE_ORDER_INDEX, ['partitionKey', 'id'], { unique: true });\n  queue.createIndex(QUEUE_ID_INDEX, 'id', { unique: true });\n}\n",
             "function createQueueSchema(database: IDBDatabase): void {\n  const queue = database.createObjectStore(OFFLINE_TRANSACTION_QUEUE_STORE, {\n    keyPath: 'queueKey',\n  });\n  queue.createIndex(QUEUE_PARTITION_INDEX, 'partitionKey', { unique: false });\n  queue.createIndex(QUEUE_ORDER_INDEX, ['partitionKey', 'id'], { unique: true });\n  queue.createIndex(QUEUE_ID_INDEX, 'id', { unique: true });\n}\n\nfunction createProtectedDraftSchema(database: IDBDatabase): void {\n  const drafts = database.createObjectStore(OFFLINE_PROTECTED_SALE_DRAFT_STORE, {\n    keyPath: 'scopeKey',\n  });\n  drafts.createIndex(TENANT_INDEX, TENANT_INDEX, { unique: false });\n}\n"),
            ("      if (event.oldVersion < 4 && request.transaction !== null)\n        migrateDraftPriceModeV4(request.transaction);",
             "      if (event.oldVersion < 4 && request.transaction !== null)\n        migrateDraftPriceModeV4(request.transaction);\n      if (event.oldVersion < 5) createProtectedDraftSchema(request.result);"),
            ("    async deleteSaleDraft(scope) {\n      const transaction = database.transaction(OFFLINE_SALE_DRAFT_STORE, 'readwrite');\n      transaction.objectStore(OFFLINE_SALE_DRAFT_STORE).delete(offlineSaleScopeKey(scope));\n      await transactionDone(transaction);\n    },\n\n    async enqueue(partition, operation) {",
             "    async deleteSaleDraft(scope) {\n      const transaction = database.transaction(OFFLINE_SALE_DRAFT_STORE, 'readwrite');\n      transaction.objectStore(OFFLINE_SALE_DRAFT_STORE).delete(offlineSaleScopeKey(scope));\n      await transactionDone(transaction);\n    },\n\n    async saveProtectedSaleDraft(scope, payload) {\n      if (\n        scope.deviceEnrollmentId === undefined ||\n        !isUuidV7(scope.tenantId) ||\n        !isUuidV7(scope.branchId) ||\n        !isUuidV7(scope.terminalId) ||\n        !isUuidV7(scope.deviceEnrollmentId) ||\n        !isUuidV7(scope.userId) ||\n        !isUuidV7(scope.shiftId) ||\n        payload.protectionVersion !== 1 ||\n        payload.databaseVersion !== OFFLINE_DB_VERSION ||\n        payload.ciphertext.length === 0 ||\n        !Number.isFinite(Date.parse(payload.updatedAt))\n      ) {\n        throw new OfflineStoreError('corrupt', 'Protected sale draft metadata is invalid.');\n      }\n      const row: StoredProtectedSaleDraft = {\n        ...scope,\n        ...payload,\n        scopeKey: offlineSaleScopeKey(scope),\n      };\n      const transaction = database.transaction(OFFLINE_PROTECTED_SALE_DRAFT_STORE, 'readwrite');\n      transaction.objectStore(OFFLINE_PROTECTED_SALE_DRAFT_STORE).put(row);\n      await transactionDone(transaction);\n    },\n\n    async loadProtectedSaleDraft(scope) {\n      const transaction = database.transaction(OFFLINE_PROTECTED_SALE_DRAFT_STORE, 'readonly');\n      const request = transaction\n        .objectStore(OFFLINE_PROTECTED_SALE_DRAFT_STORE)\n        .get(offlineSaleScopeKey(scope));\n      const value = await requestValue(request);\n      await transactionDone(transaction);\n      if (value === undefined) return null;\n      if (\n        !isRecord(value) ||\n        value.scopeKey !== offlineSaleScopeKey(scope) ||\n        value.tenantId !== scope.tenantId ||\n        value.branchId !== scope.branchId ||\n        value.terminalId !== scope.terminalId ||\n        !recordMatchesDeviceEnrollment(value, scope.deviceEnrollmentId) ||\n        value.userId !== scope.userId ||\n        value.shiftId !== scope.shiftId ||\n        value.protectionVersion !== 1 ||\n        value.databaseVersion !== OFFLINE_DB_VERSION ||\n        typeof value.ciphertext !== 'string' ||\n        value.ciphertext.length === 0 ||\n        typeof value.updatedAt !== 'string' ||\n        !Number.isFinite(Date.parse(value.updatedAt))\n      ) {\n        throw new OfflineStoreError('corrupt', 'Protected sale draft failed binding validation.');\n      }\n      return {\n        protectionVersion: 1,\n        databaseVersion: OFFLINE_DB_VERSION,\n        ciphertext: value.ciphertext,\n        updatedAt: value.updatedAt,\n      };\n    },\n\n    async deleteProtectedSaleDraft(scope) {\n      const transaction = database.transaction(OFFLINE_PROTECTED_SALE_DRAFT_STORE, 'readwrite');\n      transaction.objectStore(OFFLINE_PROTECTED_SALE_DRAFT_STORE).delete(offlineSaleScopeKey(scope));\n      await transactionDone(transaction);\n    },\n\n    async migrateQueuePayload(partition, id, expectedPayload, replacementPayload) {\n      const key = queueRecordKey(partition, id);\n      const expectedJson = serializeQueuePayload(expectedPayload);\n      const replacementJson = serializeQueuePayload(replacementPayload);\n      const transaction = database.transaction(OFFLINE_TRANSACTION_QUEUE_STORE, 'readwrite');\n      const done = transactionDone(transaction);\n      const store = transaction.objectStore(OFFLINE_TRANSACTION_QUEUE_STORE);\n      const request = store.get(key);\n      let failure: OfflineStoreError | null = null;\n      request.onerror = () => {\n        failure = classifyIndexedDbError(request.error);\n        transaction.abort();\n      };\n      request.onsuccess = () => {\n        try {\n          if (request.result === undefined) {\n            failure = new OfflineStoreError('conflict', 'Queue operation is missing during protection migration.');\n            transaction.abort();\n            return;\n          }\n          const decoded = decodeStoredQueueRow(request.result, partition);\n          if (serializeQueuePayload(decoded.operation.payload) !== expectedJson) {\n            failure = new OfflineStoreError('conflict', 'Queue payload changed during protection migration.');\n            transaction.abort();\n            return;\n          }\n          store.put({ ...decoded.stored, payloadJson: replacementJson } satisfies StoredQueuedOperation);\n        } catch (error) {\n          failure = classifyIndexedDbError(error);\n          transaction.abort();\n        }\n      };\n      try {\n        await done;\n      } catch (error) {\n        if (failure !== null) throw failure;\n        throw classifyIndexedDbError(error);\n      }\n    },\n\n    async enqueue(partition, operation) {")
          ])

          patch('apps/pos-web/src/lib/offline-checkout.ts', [
            ("import { OfflineStoreError, openKorviOfflineStore, type KorviOfflineStore } from './offline-store';\nimport { createQueuePushSyncEngine } from './sync-engine';",
             "import { OfflineStoreError, openKorviOfflineStore, type KorviOfflineStore } from './offline-store';\nimport {\n  decodeProtectedCheckoutOperation,\n  isProtectedCheckoutPayload,\n  protectCheckoutQueueOperation,\n  type OfflineStoreProtector,\n} from './offline-protection';\nimport { createQueuePushSyncEngine } from './sync-engine';"),
            ("  readonly intent: CheckoutRequest;\n  readonly disposition: 'needs-review';",
             "  readonly intent: CheckoutRequest | null;\n  readonly localEvidence: 'decoded' | 'protected-unreadable';\n  readonly disposition: 'needs-review';"),
            ("export async function enqueueOfflineCheckout(\n  partition: QueuePartition,\n  intent: CheckoutIntent,\n  openStore: OpenStore = () => openKorviOfflineStore(),\n): Promise<void> {\n  const store = await openStore();\n  try {\n    await store.enqueue(partition, checkoutQueueOperation(intent));\n  } finally {\n    store.close();\n  }\n}",
             "export async function enqueueOfflineCheckout(\n  partition: QueuePartition,\n  intent: CheckoutIntent,\n  openStore: OpenStore = () => openKorviOfflineStore(),\n  protector?: OfflineStoreProtector,\n): Promise<void> {\n  const store = await openStore();\n  try {\n    const operation = checkoutQueueOperation(intent);\n    await store.enqueue(\n      partition,\n      protector === undefined\n        ? operation\n        : await protectCheckoutQueueOperation(partition, operation, protector),\n    );\n  } finally {\n    store.close();\n  }\n}"),
            ("export async function syncOfflineCheckouts(\n  api: ApiClient,\n  partition: QueuePartition,\n  onUnauthenticated?: () => void,\n  openStore: OpenStore = () => openKorviOfflineStore(),\n): Promise<OfflineCheckoutSyncSnapshot> {\n  const store = await openStore();\n  try {\n    const engine = createQueuePushSyncEngine(\n      store,\n      partition,\n      createCheckoutSyncExecutor(api, { onUnauthenticated }),\n    );\n    const report = await engine.push();",
             "export async function syncOfflineCheckouts(\n  api: ApiClient,\n  partition: QueuePartition,\n  onUnauthenticated?: () => void,\n  openStore: OpenStore = () => openKorviOfflineStore(),\n  protector?: OfflineStoreProtector,\n): Promise<OfflineCheckoutSyncSnapshot> {\n  const store = await openStore();\n  try {\n    if (protector !== undefined) {\n      const legacy = [\n        ...(await store.pending(partition, 500)),\n        ...(await store.rejected(partition, 500)),\n      ];\n      for (const operation of legacy) {\n        if (!isCheckoutQueuePayload(operation.payload)) continue;\n        const protectedOperation = await protectCheckoutQueueOperation(\n          partition,\n          {\n            id: operation.id,\n            kind: operation.kind,\n            payload: operation.payload,\n            enqueuedAt: operation.enqueuedAt,\n          },\n          protector,\n        );\n        await store.migrateQueuePayload(\n          partition,\n          operation.id,\n          operation.payload,\n          protectedOperation.payload,\n        );\n      }\n    }\n\n    const checkoutExecutor = createCheckoutSyncExecutor(api, { onUnauthenticated });\n    const engine = createQueuePushSyncEngine(store, partition, {\n      async execute(operation) {\n        if (protector === undefined) return checkoutExecutor.execute(operation);\n        try {\n          if (isCheckoutQueuePayload(operation.payload)) {\n            const protectedOperation = await protectCheckoutQueueOperation(\n              partition,\n              {\n                id: operation.id,\n                kind: operation.kind,\n                payload: operation.payload,\n                enqueuedAt: operation.enqueuedAt,\n              },\n              protector,\n            );\n            await store.migrateQueuePayload(\n              partition,\n              operation.id,\n              operation.payload,\n              protectedOperation.payload,\n            );\n            return checkoutExecutor.execute(operation);\n          }\n          const decoded = await decodeProtectedCheckoutOperation(partition, operation, protector);\n          return checkoutExecutor.execute(decoded);\n        } catch {\n          return { outcome: 'rejected', reason: 'local-protection-invalid' } as const;\n        }\n      },\n    });\n    const report = await engine.push();"),
            ("    for (const operation of rejected) {\n      if (operation.kind !== 'sale.checkout') continue;\n      if (!isCheckoutQueuePayload(operation.payload) || operation.rejectionReason === null) {\n        throw new OfflineStoreError(\n          'corrupt',\n          'Rejected checkout reconciliation evidence is corrupt.',\n        );\n      }\n      needsReview.push({\n        operationId: operation.id,\n        enqueuedAt: operation.enqueuedAt,\n        attempts: operation.attempts,\n        reason: operation.rejectionReason,\n        intent: operation.payload,\n        disposition: 'needs-review',\n      });\n    }",
             "    for (const operation of rejected) {\n      if (operation.kind !== 'sale.checkout' || operation.rejectionReason === null) continue;\n      let intent: CheckoutRequest | null = null;\n      let localEvidence: OfflineSaleReviewCase['localEvidence'] = 'decoded';\n      try {\n        if (isCheckoutQueuePayload(operation.payload)) {\n          intent = operation.payload;\n          if (protector !== undefined) {\n            const protectedOperation = await protectCheckoutQueueOperation(\n              partition,\n              {\n                id: operation.id,\n                kind: operation.kind,\n                payload: operation.payload,\n                enqueuedAt: operation.enqueuedAt,\n              },\n              protector,\n            );\n            await store.migrateQueuePayload(\n              partition,\n              operation.id,\n              operation.payload,\n              protectedOperation.payload,\n            );\n          }\n        } else if (protector !== undefined && isProtectedCheckoutPayload(operation.payload)) {\n          intent = (await decodeProtectedCheckoutOperation(partition, operation, protector)).payload;\n        } else {\n          throw new OfflineStoreError('corrupt', 'Rejected checkout payload is unreadable.');\n        }\n      } catch {\n        localEvidence = 'protected-unreadable';\n      }\n      needsReview.push({\n        operationId: operation.id,\n        enqueuedAt: operation.enqueuedAt,\n        attempts: operation.attempts,\n        reason: operation.rejectionReason,\n        intent,\n        localEvidence,\n        disposition: 'needs-review',\n      });\n    }")
          ])

          patch('apps/pos-web/src/hooks/use-durable-sale-draft.ts', [
            ("} from '../lib/offline-store';\nimport type {",
             "} from '../lib/offline-store';\nimport {\n  decodeProtectedSaleDraft,\n  protectSaleDraft,\n  type OfflineStoreProtector,\n} from '../lib/offline-protection';\nimport type {"),
            ("export function useDurableSaleDraft(scope: OfflineSaleScope): DurableDraftHandle {",
             "export function useDurableSaleDraft(\n  scope: OfflineSaleScope,\n  protector?: OfflineStoreProtector,\n): DurableDraftHandle {"),
            ("          const draft = await store.loadSaleDraft(stableScope);",
             "          let draft: OfflineSaleDraft | null;\n          if (protector === undefined) {\n            draft = await store.loadSaleDraft(stableScope);\n          } else {\n            const protectedDraft = await store.loadProtectedSaleDraft(stableScope);\n            if (protectedDraft !== null) {\n              draft = await decodeProtectedSaleDraft(stableScope, protectedDraft, protector);\n            } else {\n              draft = await store.loadSaleDraft(stableScope);\n              if (draft !== null) {\n                const protectedPayload = await protectSaleDraft(stableScope, draft, protector);\n                await store.saveProtectedSaleDraft(stableScope, protectedPayload);\n                await store.deleteSaleDraft(stableScope);\n              }\n            }\n          }"),
            ("  }, [key, stableScope]);",
             "  }, [key, protector, stableScope]);"),
            ("        .then(() => current.store.saveSaleDraft(stableScope, draft))",
             "        .then(async () => {\n          if (protector === undefined) {\n            await current.store.saveSaleDraft(stableScope, draft);\n            return;\n          }\n          const protectedPayload = await protectSaleDraft(stableScope, draft, protector);\n          await current.store.saveProtectedSaleDraft(stableScope, protectedPayload);\n          await current.store.deleteSaleDraft(stableScope);\n        })"),
            ("    [key, recordFailure, stableScope],",
             "    [key, protector, recordFailure, stableScope],"),
            ("      .then(() => current.store.deleteSaleDraft(stableScope))",
             "      .then(async () => {\n        await current.store.deleteProtectedSaleDraft(stableScope);\n        await current.store.deleteSaleDraft(stableScope);\n      })"),
