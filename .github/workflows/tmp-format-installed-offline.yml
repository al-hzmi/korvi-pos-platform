          patch('apps/pos-web/src/hooks/use-checkout.ts', [
            ("import { enqueueOfflineCheckout } from '../lib/offline-checkout';",
             "import { enqueueOfflineCheckout } from '../lib/offline-checkout';\nimport { openKorviOfflineStore } from '../lib/offline-store';\nimport type { OfflineStoreProtector } from '../lib/offline-protection';"),
            ("  offlinePartition?: QueuePartition,\n): CheckoutHandle {",
             "  offlinePartition?: QueuePartition,\n  offlineProtector?: OfflineStoreProtector,\n): CheckoutHandle {"),
            (": (intent) => enqueueOfflineCheckout(offlinePartition, intent),",
