                    } else {
                      const leaseUntil = decoded.operation.leaseUntil;
                      if (leaseUntil === null) {
                        throw new OfflineStoreError('corrupt', 'In-flight queue operation has no lease.');
                      }
                      if (Date.parse(leaseUntil) > nowMs) {
                        result = { status: 'blocked', reason: 'active-lease', until: leaseUntil };
                        resolve();
                        return;
                      }
                    }

                    const attempts = decoded.operation.attempts + 1;
                    const stored: StoredQueuedOperation = {
                      ...decoded.stored,
                      state: 'in-flight',
                      attempts,
                      leaseUntil: claimRequest.leaseUntil,
                      claimToken: claimRequest.token,
                      rejectionReason: null,
                    };
                    cursor.update(stored);
                    result = {
                      status: 'claimed',
                      claim: {
                        token: claimRequest.token,
                        operation: {
