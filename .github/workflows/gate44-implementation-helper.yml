          claim_impl = r'''
          function validateClaimRequest(request: QueueClaimRequest): { readonly nowMs: number } {
            const nowMs = Date.parse(request.now);
            const leaseUntilMs = Date.parse(request.leaseUntil);
            if (
              !isUuidV7(request.token) ||
              !Number.isFinite(nowMs) ||
              !Number.isFinite(leaseUntilMs) ||
              leaseUntilMs <= nowMs ||
              leaseUntilMs - nowMs > MAX_QUEUE_LEASE_MS
            ) {
              throw new OfflineStoreError('corrupt', 'Queue claim request is invalid or exceeds the lease limit.');
            }
            return { nowMs };
