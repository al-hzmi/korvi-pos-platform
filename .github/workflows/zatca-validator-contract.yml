name: ZATCA Validator Function Extraction

on:
  push:
    branches: [review/zatca-validator-contract]
    paths: [.github/workflows/zatca-validator-contract.yml]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Extract exact public validator call functions
        shell: bash
        run: |
          set -euo pipefail
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36'
          curl --fail --show-error --location --retry 3 --retry-all-errors -A "$ua" \
            https://sandbox.zatca.gov.sa/assets/index-CqfbJeRB.js -o "$RUNNER_TEMP/index.js"
          python - <<'PY'
          import os, re
          from pathlib import Path
          js = (Path(os.environ['RUNNER_TEMP'])/'index.js').read_text('utf-8', errors='replace')
          for needle in ('pKA=', 'QKA=', 'const pKA', 'const QKA', 'validate-e-invoice/invoice/validate'):
              pos = js.find(needle)
              print(f'needle={needle} pos={pos}')
              if pos >= 0:
                  s = js[max(0,pos-1800):min(len(js),pos+3200)]
                  s = re.sub(r'Authorization:`[^`]*`', 'Authorization:`<redacted>`', s)
                  s = re.sub(r'captcha[^,;}]{0,200}', 'captcha:<redacted>', s, flags=re.I)
                  print(' '.join(s.split()))
                  print('---')
          PY
      - name: Remove extraction workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/zatca-validator-contract.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/zatca-validator-contract.yml
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --check
          git commit -m 'chore(review): remove ZATCA validator extraction workflow'
          git push origin HEAD:review/zatca-validator-contract
