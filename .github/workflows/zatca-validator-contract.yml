name: ZATCA Axios Instance Extraction

on:
  push:
    branches: [review/zatca-validator-contract]
    paths: [.github/workflows/zatca-validator-contract.yml]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {fetch-depth: 0}
      - name: Extract validator Axios instance
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --location --retry 3 --retry-all-errors https://sandbox.zatca.gov.sa/assets/index-CqfbJeRB.js -o "$RUNNER_TEMP/index.js"
          python - <<'PY'
          import os,re
          from pathlib import Path
          js=(Path(os.environ['RUNNER_TEMP'])/'index.js').read_text('utf-8',errors='replace')
          for needle in ('jN=', 'jN =', 'axios.create', '.create({baseURL', 'baseURL:'):
              print('NEEDLE',needle)
              start=0; n=0
              while True:
                  i=js.find(needle,start)
                  if i<0: break
                  s=js[max(0,i-1200):min(len(js),i+2200)]
                  if needle.startswith('jN') or 'validate-e-invoice' in s or 'VALIDATE_XML' in s or 'xmlService' in s:
                      s=re.sub(r'Authorization:`[^`]*`','Authorization:`<redacted>`',s)
                      print(f'[{n}] pos={i} '+ ' '.join(s.split()))
                      n+=1
                  start=i+1
                  if n>=8: break
          PY
      - name: Remove workflow
        if: always()
        run: |
          set -euo pipefail
          rm -f .github/workflows/zatca-validator-contract.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/zatca-validator-contract.yml
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --check
          git commit -m 'chore(review): remove ZATCA axios extraction workflow'
          git push origin HEAD:review/zatca-validator-contract
