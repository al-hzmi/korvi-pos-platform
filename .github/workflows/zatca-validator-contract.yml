name: ZATCA XML Service BaseURL Extraction

on:
  push:
    branches: [review/zatca-validator-contract]
    paths: [.github/workflows/zatca-validator-contract.yml]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {fetch-depth: 0}
      - name: Extract xmlServiceInstance construction
        shell: bash
        run: |
          set -euo pipefail
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36'
          curl --fail --show-error --location --retry 3 --retry-all-errors -A "$ua" https://sandbox.zatca.gov.sa/env-config.js -o "$RUNNER_TEMP/env.js"
          curl --fail --show-error --location --retry 3 --retry-all-errors -A "$ua" https://sandbox.zatca.gov.sa/assets/index-CqfbJeRB.js -o "$RUNNER_TEMP/index.js"
          python - <<'PY'
          import os, re
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          env=(root/'env.js').read_text('utf-8',errors='replace')
          js=(root/'index.js').read_text('utf-8',errors='replace')
          print('--- env validation lines ---')
          for l in env.splitlines():
              if 'VALIDATE_XML' in l: print(l)
          print('--- xmlServiceInstance occurrences ---')
          start=0; count=0
          while True:
              i=js.find('xmlServiceInstance', start)
              if i<0: break
              s=js[max(0,i-1800):min(len(js),i+2400)]
              s=re.sub(r'Authorization:`[^`]*`','Authorization:`<redacted>`',s)
              print(f'[{count}] pos={i} '+ ' '.join(s.split()))
              count+=1; start=i+1
          print('occurrence_count='+str(count))
          if count==0: raise SystemExit('xmlServiceInstance not found')
          print('--- discovered fatoora gateway strings from env+bundle ---')
          alltext=env+'\n'+js
          for m in sorted(set(re.findall(r'https://[^"\'`\\ ]+',alltext))):
              if 'fatoora' in m.lower() or 'validate-e-invoice' in m.lower(): print(m[:500])
          PY
      - name: Remove workflow
        if: always()
        run: |
          set -euo pipefail
          rm -f .github/workflows/zatca-validator-contract.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/zatca-validator-contract.yml
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --check
          git commit -m 'chore(review): remove ZATCA service extraction workflow'
          git push origin HEAD:review/zatca-validator-contract
