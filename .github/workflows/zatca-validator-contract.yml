name: ZATCA Validator Contract Discovery

on:
  push:
    branches:
      - review/zatca-validator-contract
    paths:
      - .github/workflows/zatca-validator-contract.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Read official public validator configuration and request contract
        shell: bash
        run: |
          set -euo pipefail
          base='https://sandbox.zatca.gov.sa'
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36'
          curl --fail --show-error --location --retry 3 --retry-all-errors -A "$ua" \
            "$base/env-config.js" -o "$RUNNER_TEMP/env-config.js"
          curl --fail --show-error --location --retry 3 --retry-all-errors -A "$ua" \
            "$base/assets/index-CqfbJeRB.js" -o "$RUNNER_TEMP/index.js"
          python - <<'PY'
          import os, re
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          env = (root / 'env-config.js').read_text('utf-8', errors='replace')
          print('--- official env keys relevant to XML validation ---')
          for line in env.splitlines():
              if 'VALIDATE_XML' in line or 'CAPTCHA' in line:
                  safe = re.sub(r'(CAPTCHA[^:=]*[:=]\s*["\']).*?(["\'])', r'\1<redacted>\2', line, flags=re.I)
                  print(safe)
          js = (root / 'index.js').read_text('utf-8', errors='replace')
          needles = ['validateXMLApi', 'REACT_APP_VALIDATE_XML', 'validationXml', 'validate-e-invoice/invoice/validate']
          print('--- sanitized request-contract contexts ---')
          emitted = set()
          for needle in needles:
              start = 0
              while True:
                  i = js.find(needle, start)
                  if i < 0:
                      break
                  context = js[max(0, i-900):min(len(js), i+1600)]
                  context = re.sub(r'Authorization:`[^`]*`', 'Authorization:`<redacted>`', context)
                  context = re.sub(r'captcha[^,;}]{0,200}', 'captcha:<redacted>', context, flags=re.I)
                  context = ' '.join(context.split())
                  if context not in emitted:
                      emitted.add(context)
                      print(f'[{needle}] {context}')
                  start = i + len(needle)
          if not emitted:
              raise SystemExit('Could not locate public XML validator request contract.')
          PY

      - name: Remove contract-discovery workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/zatca-validator-contract.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/zatca-validator-contract.yml
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --check
          git commit -m 'chore(review): remove ZATCA validator contract workflow'
          git push origin HEAD:review/zatca-validator-contract
