name: Temporary Dependency Lock Refresh

on:
  push:
    branches:
      - product/post-v1-restaurant-production

permissions:
  contents: read

jobs:
  refresh:
    name: Generate exact dependency lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install current lock
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org

      - name: Refresh typescript-eslint patch pin
        run: npm install typescript-eslint@8.70.1 --save-dev --package-lock-only --ignore-scripts --registry=https://registry.npmjs.org

      - name: Preserve generated lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-lock-refresh
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1
