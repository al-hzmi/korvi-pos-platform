name: Temporary version policy formatter

on:
  push:
    branches:
      - product/post-v1-restaurant-split-payment

permissions:
  contents: write

jobs:
  format:
    if: "${{ github.event.head_commit.message != 'chore(format): version policy' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npx --no-install prettier --write scripts/verify-versions.mjs
      - run: git diff --check
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "korvi-ci"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/verify-versions.mjs
          git commit -m "chore(format): version policy"
          git push origin HEAD:product/post-v1-restaurant-split-payment
