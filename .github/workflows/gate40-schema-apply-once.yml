name: Gate 40 Schema Apply Once
on:
  push:
    branches: [review/zatca-40-submission-pipeline]
    paths: [.github/workflows/gate40-schema-apply-once.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: review/zatca-40-submission-pipeline
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - name: Apply schema model and export
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('packages/database/prisma/schema.prisma')
          s=p.read_text()
          pairs=[
            ('  zatcaFatooraCredentials       ZatcaFatooraCredential[]\n\n  @@unique([provisioningOperationId])','  zatcaFatooraCredentials       ZatcaFatooraCredential[]\n  zatcaInvoiceSubmissions       ZatcaInvoiceSubmission[]\n\n  @@unique([provisioningOperationId])'),
            ('  zatcaFatooraCredentials       ZatcaFatooraCredential[]\n\n  @@unique([tenantId, code])','  zatcaFatooraCredentials       ZatcaFatooraCredential[]\n  zatcaInvoiceSubmissions       ZatcaInvoiceSubmission[]\n\n  @@unique([tenantId, code])'),
            ('  taxBreakdown InvoiceTaxBreakdown[]\n  refunds      Refund[]\n\n  @@unique([tenantId, invoiceNumber])','  taxBreakdown     InvoiceTaxBreakdown[]\n  refunds          Refund[]\n  zatcaSubmissions ZatcaInvoiceSubmission[]\n\n  @@unique([tenantId, invoiceNumber])')]
          for old,new in pairs:
            if s.count(old)!=1: raise SystemExit('schema anchor mismatch')
            s=s.replace(old,new,1)
          model='''\n\nmodel ZatcaInvoiceSubmission {\n  id String @id @db.Uuid\n  tenantId String @db.Uuid\n  invoiceId String @db.Uuid\n  terminalId String @db.Uuid\n  environment String\n  mode String\n  invoiceUuid String @db.Uuid\n  invoiceHash Bytes\n  sealedInvoiceXml Bytes\n  secretProvider String\n  secretId String\n  state String @default("pending")\n  attemptCount Int @default(0)\n  queuedAt DateTime\n  requestStartedAt DateTime?\n  resolvedAt DateTime?\n  httpStatus Int?\n  authorityStatus String?\n  rejectionCode String?\n  uncertaintyReason String?\n  clearedInvoiceXml Bytes?\n  createdAt DateTime @default(now())\n  updatedAt DateTime @updatedAt\n  tenant Tenant @relation(fields: [tenantId], references: [id], onDelete: Cascade)\n  invoice Invoice @relation(fields: [tenantId, invoiceId], references: [tenantId, id], onDelete: NoAction)\n  terminal Terminal @relation(fields: [tenantId, terminalId], references: [tenantId, id], onDelete: NoAction)\n  @@unique([tenantId, id], map: "zatca_invoice_submissions_tenantId_id_key")\n  @@unique([tenantId, invoiceId, mode], map: "zatca_invoice_submissions_tenantId_invoiceId_mode_key")\n  @@index([tenantId, state, queuedAt], map: "zatca_invoice_submissions_tenantId_state_queuedAt_idx")\n  @@index([tenantId, terminalId, state], map: "zatca_invoice_submissions_tenantId_terminalId_state_idx")\n  @@map("zatca_invoice_submissions")\n}\n'''
          if 'model ZatcaInvoiceSubmission {' in s: raise SystemExit('model already exists')
          p.write_text(s.rstrip()+model)
          q=Path('packages/database/src/index.ts')
          i=q.read_text()
          e="export { createZatcaInvoiceSubmissionRepository } from './zatca/invoice-submission-repository.js';\n"
          if e not in i: q.write_text(i.rstrip()+'\n'+e)
          PY
      - name: Format source
        run: |
          npm exec -w @korvi/database -- prisma format --schema prisma/schema.prisma
          npx prettier --write packages/database/src/index.ts packages/database/src/zatca/invoice-submission-repository.ts packages/database/src/__tests__/zatca-invoice-submission-live.test.ts .github/workflows/zatca-40-submission-postgres-proof.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/database/prisma/schema.prisma packages/database/src/index.ts packages/database/src/zatca/invoice-submission-repository.ts packages/database/src/__tests__/zatca-invoice-submission-live.test.ts .github/workflows/zatca-40-submission-postgres-proof.yml
          git diff --cached --check
          git commit -m 'feat(zatca): bind Gate 40 queue to Prisma authority'
          git push origin HEAD:review/zatca-40-submission-pipeline
