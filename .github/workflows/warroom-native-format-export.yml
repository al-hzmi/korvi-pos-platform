name: War Room Native Auth Format Export

on:
  push:
    branches:
      - strike/product-routing-p0

permissions:
  contents: write

jobs:
  format-export:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact lockfile
        run: npm ci --registry=https://registry.npmjs.org

      - name: Format native auth files with repository Prettier
        run: |
          npx prettier --write \
            apps/api/src/native-auth/lazy.ts \
            apps/api/src/native-auth/service.ts \
            packages/database/src/native-auth/device-session.ts
          git diff --check

      - name: Commit exact formatter output
        run: |
          if git diff --quiet -- \
            apps/api/src/native-auth/lazy.ts \
            apps/api/src/native-auth/service.ts \
            packages/database/src/native-auth/device-session.ts; then
            echo 'Native auth sources already match repository Prettier.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/api/src/native-auth/lazy.ts \
            apps/api/src/native-auth/service.ts \
            packages/database/src/native-auth/device-session.ts
          git commit -m 'style(native-auth): apply repository Prettier'
          git push origin HEAD:strike/product-routing-p0
