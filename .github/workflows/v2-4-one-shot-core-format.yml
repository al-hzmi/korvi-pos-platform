name: V2-4 One-Shot Core Format

on:
  push:
    branches:
      - mastermind/v2-strengthening
    paths:
      - .github/workflows/v2-4-one-shot-core-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: mastermind/v2-strengthening
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install exact lockfile
        run: npm ci --registry=https://registry.npmjs.org
      - name: Format V2-4 core files and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write             packages/database/src/lots/authority.ts             packages/database/src/repositories/inventory-repository.ts
          rm .github/workflows/v2-4-one-shot-core-format.yml
          git diff --check
      - name: Commit canonical formatter output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "korvi-v2-format"
          git config user.email "actions@users.noreply.github.com"
          git add             packages/database/src/lots/authority.ts             packages/database/src/repositories/inventory-repository.ts             .github/workflows/v2-4-one-shot-core-format.yml
          git commit -m "style(v2-4): format lot movement authority"
          git push origin HEAD:mastermind/v2-strengthening
