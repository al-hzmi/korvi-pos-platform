name: ZATCA Format Diff Temporary

on:
  push:
    branches:
      - strike/product-routing-p0
    paths:
      - 'packages/database/src/zatca/csid-binding-repository.ts'
      - '.github/workflows/zatca-format-diff-temporary.yml'

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install exact lockfile
        run: npm ci --registry=https://registry.npmjs.org
      - name: Print exact Prettier diff
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install prettier packages/database/src/zatca/csid-binding-repository.ts --write
          git diff -- packages/database/src/zatca/csid-binding-repository.ts
