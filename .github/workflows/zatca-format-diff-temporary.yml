name: ZATCA Format Diff Temporary

on:
  push:
    branches:
      - strike/product-routing-p0
    paths:
      - '.github/workflows/zatca-format-diff-temporary.yml'
      - 'apps/api/src/__tests__/zatca-provision-production-csid.test.ts'

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci --registry=https://registry.npmjs.org
      - name: Show exact Prettier diff
        run: |
          npx prettier --write apps/api/src/__tests__/zatca-provision-production-csid.test.ts
          git --no-pager diff -- apps/api/src/__tests__/zatca-provision-production-csid.test.ts
