name: Temporary AR2 Return Proof Formatter

on:
  push:
    branches:
      - integration/acquisition-ar2

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npx prettier --write scripts/browser-cashier-sale-proof.mjs
      - name: Commit formatter output and remove one-shot workflow
        run: |
          rm .github/workflows/tmp-ar2-return-proof-format.yml
          git config user.name "korvi-ci"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/browser-cashier-sale-proof.mjs .github/workflows/tmp-ar2-return-proof-format.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(format): AR-2 return browser proof"
          git push origin HEAD:integration/acquisition-ar2
