name: Refresh zod lock

on:
  push:
    branches:
      - review/operations-50-production-readiness

permissions:
  contents: write

concurrency:
  group: refresh-zod-lock-review
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: review/operations-50-production-readiness
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify package manager
        run: node scripts/verify-package-manager.mjs

      - name: Refresh zod manifest and lock from npm registry
        run: |
          set -euo pipefail
          npm install \
            --workspace @korvi/api \
            --save-exact \
            --package-lock-only \
            --ignore-scripts \
            --registry=https://registry.npmjs.org \
            zod@4.6.4
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const api = JSON.parse(fs.readFileSync('apps/api/package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (api.dependencies?.zod !== '4.6.4') throw new Error('apps/api zod pin is not exactly 4.6.4');
          if (lock.packages?.['apps/api']?.dependencies?.zod !== '4.6.4') throw new Error('workspace lock zod pin is not exactly 4.6.4');
          const resolved = lock.packages?.['node_modules/zod'];
          if (resolved?.version !== '4.6.4') throw new Error('resolved zod version is not 4.6.4');
          if (typeof resolved.integrity !== 'string' || !resolved.integrity.startsWith('sha512-')) throw new Error('zod registry integrity is missing');
          NODE
          npm audit --package-lock-only --registry=https://registry.npmjs.org

      - name: Remove one-shot workflow and commit exact registry result
        run: |
          set -euo pipefail
          rm -f .github/workflows/refresh-zod-lock.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'Expected a zod refresh diff but tree is unchanged.' >&2; exit 1; }
          git commit -m 'chore(deps): update zod to 4.6.4'
          git push origin HEAD:review/operations-50-production-readiness
