name: TEMP Gate39 HTTP Issuer Format

on:
  push:
    branches:
      - review/zatca-39-csid-lifecycle
    paths:
      - '.github/workflows/tmp-gate39-http-issuer-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: review/zatca-39-csid-lifecycle
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - name: Format exact Gate39 files
        run: npx --no-install prettier --write apps/api/src/zatca/compliance-csid-http-issuer.ts apps/api/src/__tests__/zatca-compliance-csid-http-issuer.test.ts
      - name: Commit formatter output
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No formatter changes required.'
            exit 0
          fi
          git config user.name 'korvi-ci'
          git config user.email 'korvi-ci@users.noreply.github.com'
          git add apps/api/src/zatca/compliance-csid-http-issuer.ts apps/api/src/__tests__/zatca-compliance-csid-http-issuer.test.ts
          git commit -m 'style(zatca): format Compliance CSID HTTP issuer'
          git push origin HEAD:review/zatca-39-csid-lifecycle
