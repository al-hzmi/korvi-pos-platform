name: Temporary AR46 Formatter

on:
  push:
    branches:
      - release/acquisition-ops-handoff

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - run: >
          npx prettier --write
          docs/handoff/KORVI-ACQUISITION-HANDOFF.md
          docs/handoff/MERCHANT-ONBOARDING-MIGRATION.md
          docs/operations/PRODUCTION-DEPLOYMENT-REFERENCE.md
          docs/operations/ZATCA-PRODUCTION-OPERATIONS.md
      - name: Commit formatter output and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-ar46-format.yml
          git config user.name "korvi-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(format): AR-4 AR-6 handoff docs"
          git push origin HEAD:release/acquisition-ops-handoff
