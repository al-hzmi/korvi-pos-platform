name: TEMP Gate39 Vite Refresh

on:
  push:
    branches:
      - review/zatca-39-csid-lifecycle
    paths:
      - '.github/workflows/tmp-gate39-vite-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: review/zatca-39-csid-lifecycle
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Refresh Vite to current stable exact pin
        run: |
          set -euo pipefail
          npm install --save-dev --save-exact vite@8.3.0 --registry=https://registry.npmjs.org
          npm ls vite
          node -e "const p=require('./package.json'); if(p.devDependencies.vite!=='8.3.0') process.exit(1)"
      - name: Commit exact manifest and lockfile
        run: |
          set -euo pipefail
          git config user.name 'korvi-ci'
          git config user.email 'korvi-ci@users.noreply.github.com'
          git add package.json package-lock.json
          git diff --cached --check
          git commit -m 'chore(deps): update Vite to 8.3.0'
          git push origin HEAD:review/zatca-39-csid-lifecycle
