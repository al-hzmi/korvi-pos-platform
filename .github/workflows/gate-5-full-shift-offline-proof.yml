name: Gate 5 Full Shift Offline Proof

on:
  push:
    branches:
      - warroom/offline-full-shift
  pull_request:
    branches:
      - strike/product-routing-p0
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-shift-offline:
    name: Chrome / PostgreSQL 17 / representative full-shift outage and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      POSTGRES_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/korvi_gate5
      DATABASE_URL: postgresql://korvi_gate5:korvi_gate5_ci@localhost:5432/korvi_gate5?schema=public
      KORVI_BROWSER_TENANT_SLUG: stage5d-browser-proof
      KORVI_BROWSER_OWNER_EMAIL: owner@stage5d-browser-proof.test
      KORVI_BROWSER_BASE_URL: http://localhost:3000
      KORVI_API_ORIGIN: http://localhost:3001
      KORVI_BROWSER_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/gate5-stage5d-prep
      KORVI_CHROME_DEBUG_PORT: '9227'
      KORVI_GATE5_BASE_URL: http://localhost:3000
      KORVI_GATE5_CHROME_PORT: '9227'
      KORVI_GATE5_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/gate5-full-shift-offline
      KORVI_GATE5_CHROME_PID_FILE: ${{ github.workspace }}/artifacts/gate5-full-shift-offline/chrome.pid
      KORVI_GATE5_SALES: '150'
      KORVI_GATE5_TARGET_STOCK: '200'

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: korvi_gate5
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d korvi_gate5"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432

    steps:
      - name: Check out exact commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify package manager
        run: node scripts/verify-package-manager.mjs

      - name: Install exact lockfile
        run: npm ci --registry=https://registry.npmjs.org

      - name: Locate Chrome and record authority
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$KORVI_GATE5_ARTIFACT_DIR" "$KORVI_BROWSER_ARTIFACT_DIR"
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$chrome" ]; then
            echo 'No Chrome/Chromium binary exists on this runner.' >&2
            exit 1
          fi
          echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"
          {
            echo "commit=$GITHUB_SHA"
            echo "runner_image=${ImageOS:-unknown}-${ImageVersion:-unknown}"
            echo "representative_sales=$KORVI_GATE5_SALES"
            echo 'wall_clock_claim=NOT_CLAIMED'
            echo 'outage_duration_semantics=time-compressed representative workload'
            "$chrome" --version
            psql "$POSTGRES_ADMIN_URL" --no-psqlrc --tuples-only --no-align --command 'SHOW server_version;'
          } | tee "$KORVI_GATE5_ARTIFACT_DIR/authority.txt"

      - name: Create restricted application role
        shell: bash
        run: |
          set -euo pipefail
          psql "$POSTGRES_ADMIN_URL" --no-psqlrc --set=ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE korvi_gate5
            LOGIN PASSWORD 'korvi_gate5_ci'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          GRANT CONNECT, CREATE, TEMPORARY ON DATABASE korvi_gate5 TO korvi_gate5;
          GRANT USAGE, CREATE ON SCHEMA public TO korvi_gate5;
          SQL

          flags="$(psql "$POSTGRES_ADMIN_URL" --no-psqlrc --tuples-only --no-align --command \
            "SELECT rolsuper, rolcreatedb, rolcreaterole, rolinherit, rolreplication, rolbypassrls FROM pg_roles WHERE rolname = 'korvi_gate5'")"
          if [ "$flags" != 'f|f|f|f|f|f' ]; then
            echo "Gate 5 application role has unsafe authority: $flags" >&2
            exit 1
          fi
          echo "app_role_flags=$flags" | tee -a "$KORVI_GATE5_ARTIFACT_DIR/authority.txt"

      - name: Apply every migration and prove exact migration history
        shell: bash
        working-directory: packages/database
        run: |
          set -euo pipefail
          migration_directories="$(find prisma/migrations -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')"
          bash ../../scripts/prove-migration-state.sh
          ledger="$(psql "${DATABASE_URL%%\?*}" --no-psqlrc --tuples-only --no-align --command \
            'SELECT count(*) FROM "_prisma_migrations" WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL;')"
          if [ "$ledger" != "$migration_directories" ]; then
            echo "Migration ledger mismatch: directories=$migration_directories ledger=$ledger" >&2
            exit 1
          fi
          echo "migration_directories=$migration_directories" | tee -a "$KORVI_GATE5_ARTIFACT_DIR/authority.txt"
          echo "migration_ledger=$ledger" | tee -a "$KORVI_GATE5_ARTIFACT_DIR/authority.txt"
          echo 'migration_history_drift=none' | tee -a "$KORVI_GATE5_ARTIFACT_DIR/authority.txt"

      - name: Build actual production API and POS
        run: |
          set -euo pipefail
          npm run db:generate
          npm run build

      - name: Generate ephemeral synthetic credentials
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -base64 36 | tr -d '\n')"
          signing_key="$(openssl rand -base64 48 | tr -d '\n')"
          echo "::add-mask::$password"
          echo "::add-mask::$signing_key"
          umask 077
          {
            printf 'export KORVI_BROWSER_PASSWORD=%q\n' "$password"
            printf 'export BOOTSTRAP_SIGNING_KEY=%q\n' "$signing_key"
          } > "$RUNNER_TEMP/gate5-secrets.env"

      - name: Provision synthetic merchant through Korvi control-plane authorities
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/gate5-secrets.env"
          node scripts/browser-stage5d-seed.mjs

      - name: Start API, production web and Stage 5D setup browser
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/gate5-secrets.env"
          mkdir -p "$KORVI_GATE5_ARTIFACT_DIR" "$KORVI_BROWSER_ARTIFACT_DIR"

          NODE_ENV=development \
            API_PORT=3001 \
            LOG_LEVEL=warn \
            DATABASE_URL="$DATABASE_URL" \
            BOOTSTRAP_SIGNING_KEY="$BOOTSTRAP_SIGNING_KEY" \
            node apps/api/dist/index.js >"$KORVI_GATE5_ARTIFACT_DIR/api.log" 2>&1 &
          echo "$!" > "$KORVI_GATE5_ARTIFACT_DIR/api.pid"

          KORVI_API_ORIGIN="$KORVI_API_ORIGIN" \
            npm run start -w @korvi/pos-web -- --hostname 127.0.0.1 --port 3000 \
            >"$KORVI_GATE5_ARTIFACT_DIR/web.log" 2>&1 &
          echo "$!" > "$KORVI_GATE5_ARTIFACT_DIR/web.pid"

          "$CHROME_BIN" \
            --headless=new \
            --disable-dev-shm-usage \
            --no-first-run \
            --no-default-browser-check \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port="$KORVI_GATE5_CHROME_PORT" \
            --user-data-dir="$RUNNER_TEMP/korvi-gate5-stage5d-chrome" \
            --window-size=1440,1200 \
            about:blank >"$KORVI_GATE5_ARTIFACT_DIR/chrome.log" 2>&1 &
          echo "$!" > "$KORVI_GATE5_ARTIFACT_DIR/chrome.pid"

          for attempt in $(seq 1 160); do
            if curl --fail --silent http://localhost:3001/health >/dev/null && \
               curl --fail --silent http://localhost:3000/control >/dev/null && \
               curl --fail --silent "http://127.0.0.1:$KORVI_GATE5_CHROME_PORT/json/version" >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          echo 'Gate 5 runtime did not become ready.' >&2
          exit 1

      - name: Establish legitimate product stock and cost through actual workflows
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/gate5-secrets.env"
          node scripts/browser-stage5d-proof.mjs

      - name: Start fresh persistent cashier profile
        shell: bash
        run: |
          set -euo pipefail
          kill "$(cat "$KORVI_GATE5_ARTIFACT_DIR/chrome.pid")" 2>/dev/null || true
          for attempt in $(seq 1 80); do
            if ! curl --silent "http://127.0.0.1:$KORVI_GATE5_CHROME_PORT/json/version" >/dev/null 2>&1; then
              break
            fi
            sleep 0.25
          done
          rm -rf "$RUNNER_TEMP/korvi-gate5-cashier-chrome"
          "$CHROME_BIN" \
            --headless=new \
            --disable-dev-shm-usage \
            --no-first-run \
            --no-default-browser-check \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port="$KORVI_GATE5_CHROME_PORT" \
            --user-data-dir="$RUNNER_TEMP/korvi-gate5-cashier-chrome" \
            --window-size=1440,1200 \
            about:blank >>"$KORVI_GATE5_ARTIFACT_DIR/chrome.log" 2>&1 &
          echo "$!" > "$KORVI_GATE5_ARTIFACT_DIR/chrome.pid"
          for attempt in $(seq 1 120); do
            if curl --fail --silent "http://127.0.0.1:$KORVI_GATE5_CHROME_PORT/json/version" >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          echo 'Fresh Gate 5 cashier Chrome profile did not become ready.' >&2
          exit 1

      - name: Queue representative full-shift workload while WAN is unavailable
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/gate5-secrets.env"
          node scripts/gate5-full-shift-offline-proof.mjs queue

      - name: Restart cashier process with the same local profile while still offline
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 80); do
            if ! curl --silent "http://127.0.0.1:$KORVI_GATE5_CHROME_PORT/json/version" >/dev/null 2>&1; then
              break
            fi
            sleep 0.25
          done
          if curl --silent "http://127.0.0.1:$KORVI_GATE5_CHROME_PORT/json/version" >/dev/null 2>&1; then
            echo 'Cashier process remained alive after forced outage restart.' >&2
            exit 1
          fi
          "$CHROME_BIN" \
            --headless=new \
            --disable-dev-shm-usage \
            --no-first-run \
            --no-default-browser-check \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port="$KORVI_GATE5_CHROME_PORT" \
            --user-data-dir="$RUNNER_TEMP/korvi-gate5-cashier-chrome" \
            --window-size=1440,1200 \
            about:blank >>"$KORVI_GATE5_ARTIFACT_DIR/chrome.log" 2>&1 &
          echo "$!" > "$KORVI_GATE5_ARTIFACT_DIR/chrome.pid"
          for attempt in $(seq 1 120); do
            if curl --fail --silent "http://127.0.0.1:$KORVI_GATE5_CHROME_PORT/json/version" >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          echo 'Offline restart Chrome profile did not become ready.' >&2
          exit 1

      - name: Prove catalogue draft queue and operation order survived restart offline
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/gate5-secrets.env"
          node scripts/gate5-full-shift-offline-proof.mjs restart-offline

      - name: Restore WAN then force process death during active synchronization
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/gate5-secrets.env"
          node scripts/gate5-full-shift-offline-proof.mjs interrupt-sync

      - name: Restart cashier after interrupted synchronization
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 80); do
            if ! curl --silent "http://127.0.0.1:$KORVI_GATE5_CHROME_PORT/json/version" >/dev/null 2>&1; then
              break
            fi
            sleep 0.25
          done
          if curl --silent "http://127.0.0.1:$KORVI_GATE5_CHROME_PORT/json/version" >/dev/null 2>&1; then
            echo 'Cashier process remained alive after synchronization interruption.' >&2
            exit 1
          fi
          "$CHROME_BIN" \
            --headless=new \
            --disable-dev-shm-usage \
            --no-first-run \
            --no-default-browser-check \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port="$KORVI_GATE5_CHROME_PORT" \
            --user-data-dir="$RUNNER_TEMP/korvi-gate5-cashier-chrome" \
            --window-size=1440,1200 \
            about:blank >>"$KORVI_GATE5_ARTIFACT_DIR/chrome.log" 2>&1 &
          echo "$!" > "$KORVI_GATE5_ARTIFACT_DIR/chrome.pid"
          for attempt in $(seq 1 120); do
            if curl --fail --silent "http://127.0.0.1:$KORVI_GATE5_CHROME_PORT/json/version" >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          echo 'Post-sync-restart Chrome profile did not become ready.' >&2
          exit 1

      - name: Complete ordered reconnect synchronization after restart
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/gate5-secrets.env"
          node scripts/gate5-full-shift-offline-proof.mjs finalize

      - name: Prove zero loss zero duplication and exact financial inventory effects in PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          operations="$KORVI_GATE5_ARTIFACT_DIR/operations.json"
          node --input-type=module -e \
            "import fs from 'node:fs'; const o=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); if(o.commit!==process.env.GITHUB_SHA) throw new Error('proof commit mismatch'); if(o.operationIds.length!==Number(process.env.KORVI_GATE5_SALES)) throw new Error('operation count mismatch');" \
            "$operations"

          ids="$(node --input-type=module -e "import fs from 'node:fs'; const o=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); process.stdout.write(o.operationIds.map((id)=>\"'\"+id+\"'\").join(','));" "$operations")"
          expected="$KORVI_GATE5_SALES"

          sale_counts="$(psql "$POSTGRES_ADMIN_URL" --no-psqlrc --tuples-only --no-align --set=ON_ERROR_STOP=1 --command \
            "SELECT count(*)::text || '|' || count(DISTINCT \"operationId\")::text FROM sales WHERE \"operationId\" IN ($ids);")"
          if [ "$sale_counts" != "$expected|$expected" ]; then
            echo "Expected $expected unique authoritative sales, got $sale_counts" >&2
            exit 1
          fi

          invoice_counts="$(psql "$POSTGRES_ADMIN_URL" --no-psqlrc --tuples-only --no-align --set=ON_ERROR_STOP=1 --command \
            "SELECT count(*)::text || '|' || count(DISTINCT s.\"operationId\")::text FROM invoices i JOIN sales s ON s.id=i.\"saleId\" AND s.\"tenantId\"=i.\"tenantId\" WHERE s.\"operationId\" IN ($ids);")"
          if [ "$invoice_counts" != "$expected|$expected" ]; then
            echo "Expected $expected unique invoices, got $invoice_counts" >&2
            exit 1
          fi

          movement_counts="$(psql "$POSTGRES_ADMIN_URL" --no-psqlrc --tuples-only --no-align --set=ON_ERROR_STOP=1 --command \
            "SELECT count(*)::text || '|' || count(DISTINCT s.\"operationId\")::text || '|' || coalesce(sum(m.\"quantityScaled\"),0)::text FROM inventory_movements m JOIN sales s ON s.id=m.\"sourceId\" AND s.\"tenantId\"=m.\"tenantId\" WHERE m.\"sourceType\"='sale' AND s.\"operationId\" IN ($ids);")"
          expected_quantity="-$((KORVI_GATE5_SALES * 1000))"
          if [ "$movement_counts" != "$expected|$expected|$expected_quantity" ]; then
            echo "Unexpected sale inventory effects: $movement_counts" >&2
            exit 1
          fi

          duplicate_ids="$(psql "$POSTGRES_ADMIN_URL" --no-psqlrc --tuples-only --no-align --set=ON_ERROR_STOP=1 --command \
            "SELECT count(*) FROM (SELECT \"operationId\" FROM sales WHERE \"operationId\" IN ($ids) GROUP BY \"operationId\" HAVING count(*) <> 1) d;")"
          if [ "$duplicate_ids" != '0' ]; then
            echo "Detected duplicate or missing authoritative operation multiplicity: $duplicate_ids" >&2
            exit 1
          fi

          {
            echo "postgres_sale_count_and_unique=$sale_counts"
            echo "postgres_invoice_count_and_unique=$invoice_counts"
            echo "postgres_movement_count_unique_quantity=$movement_counts"
            echo "postgres_invalid_operation_multiplicity=$duplicate_ids"
            echo 'zero_lost_transactions=PASS'
            echo 'zero_duplicate_transactions=PASS'
            echo 'zero_duplicate_financial_effects=PASS'
            echo 'zero_duplicate_inventory_effects=PASS'
            echo 'postgres_full_shift_reconciliation=PASS'
          } | tee "$KORVI_GATE5_ARTIFACT_DIR/postgres-proof.txt"

      - name: Prove clean repository tree
        run: git diff --check

      - name: Surface runtime logs on failure
        if: failure()
        shell: bash
        run: |
          set +e
          for log in api.log web.log chrome.log; do
            echo "== $log =="
            tail -n 300 "$KORVI_GATE5_ARTIFACT_DIR/$log" 2>/dev/null || true
          done

      - name: Stop runtime and erase credentials
        if: always()
        shell: bash
        run: |
          set +e
          for pid_file in \
            "$KORVI_GATE5_ARTIFACT_DIR/chrome.pid" \
            "$KORVI_GATE5_ARTIFACT_DIR/web.pid" \
            "$KORVI_GATE5_ARTIFACT_DIR/api.pid"; do
            if [ -f "$pid_file" ]; then
              kill "$(cat "$pid_file")" 2>/dev/null || true
            fi
          done
          shred -u "$RUNNER_TEMP/gate5-secrets.env" 2>/dev/null || rm -f "$RUNNER_TEMP/gate5-secrets.env"

      - name: Preserve sanitized full-shift proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate-5-full-shift-offline-proof-${{ github.sha }}
          path: |
            artifacts/gate5-full-shift-offline/authority.txt
            artifacts/gate5-full-shift-offline/queue-phase.txt
            artifacts/gate5-full-shift-offline/restart-offline-phase.txt
            artifacts/gate5-full-shift-offline/interrupted-sync-phase.txt
            artifacts/gate5-full-shift-offline/proof.txt
            artifacts/gate5-full-shift-offline/postgres-proof.txt
            artifacts/gate5-full-shift-offline/operations.json
            artifacts/gate5-full-shift-offline/*.png
          if-no-files-found: warn
          retention-days: 30
