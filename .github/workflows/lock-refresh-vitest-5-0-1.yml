name: Tooling — Vitest 5.0.1 canonical lock refresh

on:
  push:
    branches:
      - automation/vitest-5.0.1-lock-20260915

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: automation/vitest-5.0.1-lock-20260915

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install declared npm
        run: npm install --global npm@11.19.0 --registry=https://registry.npmjs.org --ignore-scripts

      - name: Verify package manager
        run: node scripts/verify-package-manager.mjs

      - name: Generate canonical lock diff
        run: >-
          npm install --package-lock-only --ignore-scripts --save-dev --save-exact
          vitest@5.0.1 @vitest/coverage-v8@5.0.1
          --registry=https://registry.npmjs.org

      - name: Validate generated install
        run: |
          npm ci --ignore-scripts --registry=https://registry.npmjs.org
          npm run versions:verify
          npm run audit
          git diff --check
          git diff -- package.json package-lock.json

      - name: Commit generated dependency files on tooling branch
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency diff to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(deps): generate vitest 5.0.1 lock refresh"
          git push origin HEAD:automation/vitest-5.0.1-lock-20260915
