name: Gate 40 Format Once

on:
  push:
    branches:
      - review/zatca-40-submission-pipeline
    paths:
      - .github/workflows/gate40-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: review/zatca-40-submission-pipeline

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact dependencies
        run: npm ci --registry=https://registry.npmjs.org

      - name: Format Gate 40 files
        run: |
          npx prettier --write \
            packages/domain/src/zatca/submission.ts \
            apps/api/src/zatca/invoice-submission-http-client.ts \
            apps/api/src/__tests__/zatca-invoice-submission-http-client.test.ts

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            packages/domain/src/zatca/submission.ts \
            apps/api/src/zatca/invoice-submission-http-client.ts \
            apps/api/src/__tests__/zatca-invoice-submission-http-client.test.ts
          git commit -m 'style(zatca): format Gate 40 submission transport'
          git push origin HEAD:review/zatca-40-submission-pipeline
