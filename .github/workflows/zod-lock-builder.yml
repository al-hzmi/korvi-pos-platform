name: Zod 4.6.1 Lock Builder

on:
  push:
    branches:
      - review/zod-4.6.1-lock-builder

permissions:
  contents: write

jobs:
  build-lock-diff:
    if: github.event.head_commit.message != 'chore(deps): generate zod 4.6.1 lock'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact builder head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify package manager
        run: node scripts/verify-package-manager.mjs
      - name: Regenerate only Zod manifest and lock metadata
        run: npm install zod@4.6.1 -w @korvi/api --package-lock-only --ignore-scripts --registry=https://registry.npmjs.org
      - name: Assert bounded diff
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'apps/api/package.json\npackage-lock.json'
      - name: Print exact review diff
        run: git diff -- apps/api/package.json package-lock.json
      - name: Commit exact generated files on isolated builder branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'korvi-lock-builder'
          git config user.email 'noreply@korvi.invalid'
          git add -- apps/api/package.json package-lock.json
          git diff --cached --check
          git commit -m 'chore(deps): generate zod 4.6.1 lock'
          git push origin HEAD:review/zod-4.6.1-lock-builder
