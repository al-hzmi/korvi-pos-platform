name: Scratch run ZATCA compliance evidence proof

on:
  push:
    branches:
      - scratch/inspect-production-csid

permissions:
  contents: write

jobs:
  prove-evidence:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: korvi_evidence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d korvi_evidence_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/korvi_evidence_test
      APP_DATABASE_URL: postgresql://korvi_evidence_app:korvi_evidence_app@127.0.0.1:5432/korvi_evidence_test

    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --registry=https://registry.npmjs.org

      - name: Materialize the already-reviewed evidence slice
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/scratch-complete-zatca-evidence.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == '- name: Complete evidence persistence wiring')
          run_line = next(i for i in range(start + 1, len(source)) if source[i].strip() == 'run: |')
          end = next(i for i in range(run_line + 1, len(source)) if source[i].strip() == '- name: Apply migrations to PostgreSQL 17')
          body = []
          for line in source[run_line + 1:end]:
              body.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/complete-evidence.sh').write_text('\n'.join(body) + '\n')
          PY
          bash /tmp/complete-evidence.sh

      - name: Refactor PostgreSQL proof into maintainable fixture
        shell: bash
        run: |
          set -euo pipefail
          cat > packages/database/src/__tests__/zatca-compliance-evidence-live-fixture.ts <<'EOF'
          import pg from 'pg';
          import {
            ZATCA_SIGNING_ALGORITHM,
            ZATCA_SIGNING_CURVE,
            newId,
            prepareZatcaCsidProvisioning,
            tenantId,
          } from '@korvi/domain';
          import { createPrismaClient } from '../client.js';
          import { createZatcaComplianceEvidenceRepository } from '../zatca/compliance-evidence-repository.js';
          import { createZatcaCsidProvisioningRepository } from '../zatca/csid-provisioning-repository.js';
          import type { PrismaClient } from '../client.js';

          export const D = {
            tenantA: newId(),
            tenantB: newId(),
            branchA: newId(),
            branchB: newId(),
            terminalA: newId(),
            terminalA2: newId(),
            terminalB: newId(),
            issuedAttempt: newId(),
            preparedAttempt: newId(),
            earlyAttempt: newId(),
            evidence: newId(),
          } as const;

          const PREPARED = '2026-09-10T22:50:00Z';
          const STARTED = '2026-09-10T22:50:01Z';
          const RESOLVED = '2026-09-10T22:50:02Z';
          export const ACCEPTED = '2026-09-10T22:50:03Z';
          const REQUEST_HASH = 'a'.repeat(64);
          const CSR_HASH = 'b'.repeat(64);
          export const CHECK_HASH = 'c'.repeat(64);
          export const CREDENTIAL_ID = `sha256:${'d'.repeat(64)}`;
          export const SECRET_ID = `sha256:${'e'.repeat(64)}`;

          type CsidRepository = ReturnType<typeof createZatcaCsidProvisioningRepository>;
          type EvidenceRepository = ReturnType<typeof createZatcaComplianceEvidenceRepository>;

          export interface EvidenceLiveFixture {
            readonly prisma: PrismaClient;
            readonly admin: pg.Client;
            readonly app: pg.Client;
            readonly csid: CsidRepository;
            readonly evidence: EvidenceRepository;
          }

          function prepared(attemptId: string, terminal: string, operationId: string) {
            return prepareZatcaCsidProvisioning({
              attemptId,
              scope: { tenantId: tenantId(D.tenantA) },
              terminalId: terminal,
              operationId,
              requestHash: REQUEST_HASH,
              environment: 'production',
              key: {
                provider: 'test-non-exportable-key-provider',
                keyId: `key-${attemptId}`,
                curve: ZATCA_SIGNING_CURVE,
                algorithm: ZATCA_SIGNING_ALGORITHM,
                exportable: false,
              },
              csrSha256Hex: CSR_HASH,
              preparedAt: PREPARED,
            });
          }

          async function issue(
            repository: CsidRepository,
            attemptId: string,
            terminal: string,
            operationId: string,
            credentialId = CREDENTIAL_ID,
          ) {
            const scope = { tenantId: tenantId(D.tenantA) };
            await repository.reservePrepared(scope, prepared(attemptId, terminal, operationId));
            await repository.markRequestStarted(scope, attemptId, STARTED);
            return repository.markIssued(scope, attemptId, {
              resolvedAt: RESOLVED,
              remoteRequestId: `request-${attemptId}`,
              credentialId,
              certificateDer: Uint8Array.from([0x30, 0x01, 0x00]),
              fatooraSecret: { provider: 'korvi-test-fatoora-vault', secretId: SECRET_ID },
            });
          }

          async function seedHierarchy(admin: pg.Client): Promise<void> {
            await admin.query(
              `INSERT INTO "tenants" ("id","name","slug","status","lifecycleProvenance","activatedAt","updatedAt")
               VALUES ($1,'Evidence tenant A',$2,'active','recorded',now(),now()),
                      ($3,'Evidence tenant B',$4,'active','recorded',now(),now())`,
              [D.tenantA, `evidence-a-${D.tenantA}`, D.tenantB, `evidence-b-${D.tenantB}`],
            );
            await admin.query(
              `INSERT INTO "branches" ("id","tenantId","code","nameAr","updatedAt")
               VALUES ($1,$2,'EA','فرع الدليل أ',now()),($3,$4,'EB','فرع الدليل ب',now())`,
              [D.branchA, D.tenantA, D.branchB, D.tenantB],
            );
            await admin.query(
              `INSERT INTO "terminals" ("id","tenantId","branchId","code","label","updatedAt")
               VALUES ($1,$2,$3,'E-A1','Evidence A1',now()),
                      ($4,$2,$3,'E-A2','Evidence A2',now()),
                      ($5,$6,$7,'E-B1','Evidence B1',now())`,
              [D.terminalA, D.tenantA, D.branchA, D.terminalA2, D.terminalB, D.tenantB, D.branchB],
            );
          }

          export async function setupEvidenceFixture(
            appUrl: string,
            adminUrl: string,
          ): Promise<EvidenceLiveFixture> {
            const prisma = createPrismaClient(appUrl);
            const admin = new pg.Client({ connectionString: adminUrl });
            const app = new pg.Client({ connectionString: appUrl });
            await admin.connect();
            await app.connect();
            const csid = createZatcaCsidProvisioningRepository(prisma);
            const evidence = createZatcaComplianceEvidenceRepository(prisma);
            await seedHierarchy(admin);
            await issue(csid, D.issuedAttempt, D.terminalA, 'issued-source');
            await csid.reservePrepared(
              { tenantId: tenantId(D.tenantA) },
              prepared(D.preparedAttempt, D.terminalA, 'prepared-source'),
            );
            await issue(csid, D.earlyAttempt, D.terminalA2, 'early-source', `sha256:${'f'.repeat(64)}`);
            return { prisma, admin, app, csid, evidence };
          }

          export async function cleanupEvidenceFixture(fixture: EvidenceLiveFixture): Promise<void> {
            await fixture.prisma.$disconnect();
            await fixture.app.end();
            const ids = [[D.tenantA, D.tenantB]];
            await fixture.admin.query("SET session_replication_role = 'replica'");
            await fixture.admin.query(
              'DELETE FROM "zatca_compliance_evidence" WHERE "tenantId" = ANY($1::uuid[])',
              ids,
            );
            await fixture.admin.query(
              'DELETE FROM "zatca_csid_provisioning_attempts" WHERE "tenantId" = ANY($1::uuid[])',
              ids,
            );
            await fixture.admin.query('DELETE FROM "terminals" WHERE "tenantId" = ANY($1::uuid[])', ids);
            await fixture.admin.query('DELETE FROM "branches" WHERE "tenantId" = ANY($1::uuid[])', ids);
            await fixture.admin.query('DELETE FROM "tenants" WHERE "id" = ANY($1::uuid[])', ids);
            await fixture.admin.query("SET session_replication_role = 'origin'");
            await fixture.admin.end();
          }

          export async function inTenant<T>(
            client: pg.Client,
            tenant: string,
            work: () => Promise<T>,
          ): Promise<T> {
            await client.query('BEGIN');
            await client.query("SELECT set_config('app.tenant_id', $1, true)", [tenant]);
            try {
              const result = await work();
              await client.query('COMMIT');
              return result;
            } catch (error) {
              await client.query('ROLLBACK');
              throw error;
            }
          }
          EOF

          cat > packages/database/src/__tests__/zatca-compliance-evidence-live.test.ts <<'EOF'
          import { afterAll, beforeAll, describe, expect, it } from 'vitest';
          import { newId, tenantId } from '@korvi/domain';
          import {
            ACCEPTED,
            CHECK_HASH,
            CREDENTIAL_ID,
            D,
            SECRET_ID,
            cleanupEvidenceFixture,
            inTenant,
            setupEvidenceFixture,
          } from './zatca-compliance-evidence-live-fixture.js';
          import type { EvidenceLiveFixture } from './zatca-compliance-evidence-live-fixture.js';

          const appUrl = process.env['KORVI_TEST_DATABASE_URL'] ?? '';
          const adminUrl = process.env['KORVI_TEST_ADMIN_DATABASE_URL'] ?? '';

          const canonicalInput = {
            evidenceId: D.evidence,
            terminalId: D.terminalA,
            complianceAttemptId: D.issuedAttempt,
            checkSetHash: CHECK_HASH,
            acceptedAt: ACCEPTED,
          } as const;

          describe.skipIf(appUrl === '' || adminUrl === '')(
            'ZATCA accepted compliance evidence, PostgreSQL live',
            () => {
              let fixture: EvidenceLiveFixture;

              beforeAll(async () => {
                fixture = await setupEvidenceFixture(appUrl, adminUrl);
              });

              afterAll(async () => {
                await cleanupEvidenceFixture(fixture);
              });

              it('persists only accepted-check identity and derives every CCSID authority field', async () => {
                const stored = await fixture.evidence.recordAccepted(
                  { tenantId: tenantId(D.tenantA) },
                  canonicalInput,
                );
                expect(stored.environment).toBe('production');
                expect(stored.complianceRequestId).toBe(`request-${D.issuedAttempt}`);
                expect(stored.currentComplianceCredentialId).toBe(CREDENTIAL_ID);
                expect(stored.currentComplianceSecret).toEqual({
                  provider: 'korvi-test-fatoora-vault',
                  secretId: SECRET_ID,
                });
                expect(stored.key.keyId).toBe(`key-${D.issuedAttempt}`);
                expect(stored.key.exportable).toBe(false);

                const columns = await fixture.admin.query<{ column_name: string }>(
                  `SELECT column_name FROM information_schema.columns
                   WHERE table_schema='public' AND table_name='zatca_compliance_evidence'
                   ORDER BY ordinal_position`,
                );
                expect(columns.rows.map((row) => row.column_name)).toEqual([
                  'id',
                  'tenantId',
                  'terminalId',
                  'complianceAttemptId',
                  'checkSetHash',
                  'acceptedAt',
                  'createdAt',
                ]);
              });

              it('is idempotent only for byte-for-byte identical accepted evidence', async () => {
                await expect(
                  fixture.evidence.recordAccepted({ tenantId: tenantId(D.tenantA) }, canonicalInput),
                ).resolves.toMatchObject({ evidenceId: D.evidence, checkSetHash: CHECK_HASH });
                await expect(
                  fixture.evidence.recordAccepted(
                    { tenantId: tenantId(D.tenantA) },
                    { ...canonicalInput, evidenceId: newId(), checkSetHash: '9'.repeat(64) },
                  ),
                ).rejects.toThrow(/different accepted compliance evidence/);
              });

              it('fails closed for non-issued, wrong-terminal and pre-issuance evidence', async () => {
                await expect(
                  fixture.evidence.recordAccepted(
                    { tenantId: tenantId(D.tenantA) },
                    {
                      evidenceId: newId(),
                      terminalId: D.terminalA,
                      complianceAttemptId: D.preparedAttempt,
                      checkSetHash: '1'.repeat(64),
                      acceptedAt: ACCEPTED,
                    },
                  ),
                ).rejects.toThrow(/requires an issued same-terminal Compliance CSID/);
                await expect(
                  fixture.evidence.recordAccepted(
                    { tenantId: tenantId(D.tenantA) },
                    {
                      evidenceId: newId(),
                      terminalId: D.terminalA,
                      complianceAttemptId: D.earlyAttempt,
                      checkSetHash: '2'.repeat(64),
                      acceptedAt: '2026-09-10T22:50:01Z',
                    },
                  ),
                ).rejects.toThrow(/requires an issued same-terminal Compliance CSID/);
              });

              it('enforces RLS, append-only evidence, and source-attempt retention in PostgreSQL', async () => {
                await fixture.evidence.recordAccepted({ tenantId: tenantId(D.tenantA) }, canonicalInput);
                await expect(
                  fixture.evidence.findById({ tenantId: tenantId(D.tenantB) }, D.evidence),
                ).resolves.toBeNull();

                await inTenant(fixture.app, D.tenantB, async () => {
                  const rows = await fixture.app.query(
                    'SELECT "id" FROM "zatca_compliance_evidence" WHERE "id"=$1::uuid',
                    [D.evidence],
                  );
                  expect(rows.rowCount).toBe(0);
                });
                await expect(
                  inTenant(fixture.app, D.tenantA, () =>
                    fixture.app.query(
                      'UPDATE "zatca_compliance_evidence" SET "checkSetHash"=$2 WHERE "id"=$1::uuid',
                      [D.evidence, '7'.repeat(64)],
                    ),
                  ),
                ).rejects.toThrow(/append-only/);
                await expect(
                  inTenant(fixture.app, D.tenantA, () =>
                    fixture.app.query('DELETE FROM "zatca_compliance_evidence" WHERE "id"=$1::uuid', [
                      D.evidence,
                    ]),
                  ),
                ).rejects.toThrow(/append-only/);
                await expect(
                  inTenant(fixture.app, D.tenantA, () =>
                    fixture.app.query('DELETE FROM "zatca_csid_provisioning_attempts" WHERE "id"=$1::uuid', [
                      D.issuedAttempt,
                    ]),
                  ),
                ).rejects.toThrow();
                await expect(
                  fixture.evidence.findById({ tenantId: tenantId(D.tenantA) }, D.evidence),
                ).resolves.toMatchObject({ evidenceId: D.evidence });
              });
            },
          );
          EOF

      - name: Format permanent evidence TypeScript
        run: |
          npx prettier --write \
            packages/domain/src/zatca/compliance-evidence.ts \
            packages/domain/src/ports/zatca-compliance-evidence.ts \
            packages/domain/src/zatca/__tests__/compliance-evidence.test.ts \
            packages/domain/src/index.ts \
            packages/database/src/zatca/compliance-evidence-repository.ts \
            packages/database/src/__tests__/zatca-compliance-evidence-live-fixture.ts \
            packages/database/src/__tests__/zatca-compliance-evidence-live.test.ts \
            packages/database/src/index.ts

      - name: Generate Prisma client and build workspaces
        run: |
          set -euo pipefail
          npm run --silent db:generate
          npm run --silent build

      - name: Apply all migrations to PostgreSQL 17
        run: (cd packages/database && npx prisma migrate deploy)

      - name: Create restricted application role
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE korvi_evidence_app LOGIN PASSWORD 'korvi_evidence_app'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          GRANT CONNECT ON DATABASE korvi_evidence_test TO korvi_evidence_app;
          GRANT USAGE ON SCHEMA public TO korvi_evidence_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO korvi_evidence_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO korvi_evidence_app;
          SQL

      - name: Run PostgreSQL adversarial evidence proof
        env:
          KORVI_TEST_DATABASE_URL: ${{ env.APP_DATABASE_URL }}
          KORVI_TEST_ADMIN_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: npx vitest run packages/database/src/__tests__/zatca-compliance-evidence-live.test.ts

      - name: Full repository verify
        run: |
          set -euo pipefail
          unset KORVI_TEST_DATABASE_URL KORVI_TEST_ADMIN_DATABASE_URL
          npm run verify

      - name: Commit permanent evidence slice only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/domain/src/zatca/compliance-evidence.ts \
            packages/domain/src/ports/zatca-compliance-evidence.ts \
            packages/domain/src/zatca/__tests__/compliance-evidence.test.ts \
            packages/domain/src/index.ts \
            packages/database/prisma/schema.prisma \
            packages/database/prisma/migrations/20260910224000_zatca_compliance_evidence/migration.sql \
            packages/database/src/zatca/compliance-evidence-repository.ts \
            packages/database/src/__tests__/zatca-compliance-evidence-live-fixture.ts \
            packages/database/src/__tests__/zatca-compliance-evidence-live.test.ts \
            packages/database/src/index.ts
          git diff --cached --check
          git commit -m "feat(zatca): persist trusted compliance evidence"
          git push origin HEAD:scratch/inspect-production-csid
