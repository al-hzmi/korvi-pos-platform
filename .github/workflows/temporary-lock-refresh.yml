name: Temporary lock refresh

on:
  push:
    branches:
      - ops/lock-refresh-typescript-eslint-8.70.0

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Regenerate lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --registry=https://registry.npmjs.org

      - name: Refuse manifest mutation
        run: git diff --exit-code -- package.json packages/*/package.json apps/*/package.json

      - name: Commit deterministic lock refresh
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): refresh lock for typescript-eslint 8.70.0"
          git push origin HEAD:ops/lock-refresh-typescript-eslint-8.70.0
