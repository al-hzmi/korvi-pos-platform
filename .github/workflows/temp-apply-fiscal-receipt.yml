name: Temporary Apply Fiscal Receipt

on:
  push:
    branches: [strike/product-routing-p0]
    paths:
      - '.github/workflows/temp-apply-fiscal-receipt.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://korvi:korvi@localhost:5432/korvi
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: strike/product-routing-p0
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - name: Apply source patch
        run: |
          python3 .github/temporary/apply-fiscal-receipt.py
          sed -i 's/} as SaleRecord;/} as unknown as SaleRecord;/' apps/api/src/__tests__/zatca-checkout-receipt.test.ts
      - name: Format focused files
        run: |
          npx prettier --write apps/api/src/zatca/fiscalize-checkout.ts apps/api/src/checkout/service.ts apps/api/src/checkout/receipt.ts apps/api/src/routes/business.ts apps/api/src/__tests__/zatca-checkout-fiscalization.test.ts apps/api/src/__tests__/zatca-checkout-receipt.test.ts
      - name: Generate and build
        run: |
          npm run db:generate
          npm run build
      - name: Typecheck and focused tests
        run: |
          npm run typecheck
          npm run typecheck:tests
          npx --no-install vitest run apps/api/src/__tests__/zatca-checkout-fiscalization.test.ts apps/api/src/__tests__/zatca-checkout-receipt.test.ts
          git diff --check
      - name: Commit source progress
        run: |
          git config user.name 'Korvi CI'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/api/src/zatca/fiscalize-checkout.ts apps/api/src/checkout/service.ts apps/api/src/checkout/receipt.ts apps/api/src/routes/business.ts apps/api/src/__tests__/zatca-checkout-fiscalization.test.ts apps/api/src/__tests__/zatca-checkout-receipt.test.ts
          git commit -m 'feat(checkout): return canonical sealed fiscal receipt'
          git push origin HEAD:strike/product-routing-p0
