name: ZATCA 38 Line Tax Repair

on:
  push:
    branches:
      - review/zatca-38-ubl-hash
    paths:
      - .github/workflows/zatca-38-line-tax-repair.yml

permissions:
  contents: write

jobs:
  repair-and-prove:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --registry=https://registry.npmjs.org

      - name: Add mandatory KSA line tax totals
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('packages/domain/src/zatca/phase2.ts')
          text = source.read_text()

          insertion = """    moneyElement('cbc:LineExtensionAmount', projected.netMinor),
              allowance,
              '<cac:Item>',"""
          replacement = """    moneyElement('cbc:LineExtensionAmount', projected.netMinor),
              allowance,
              renderLineTaxTotal(projected.vatMinor, projected.totalMinor),
              '<cac:Item>',"""
          if text.count(insertion) != 1:
              raise SystemExit(f'expected one renderLine insertion point, found {text.count(insertion)}')
          text = text.replace(insertion, replacement, 1)

          marker = "function moneyElement(name: string, minor: bigint): string {"
          helper = """function renderLineTaxTotal(vatMinor: bigint, totalMinor: bigint): string {
            return [
              '<cac:TaxTotal>',
              moneyElement('cbc:TaxAmount', vatMinor),
              moneyElement('cbc:RoundingAmount', totalMinor),
              '</cac:TaxTotal>',
            ].join('');
          }

          function moneyElement(name: string, minor: bigint): string {"""
          if text.count(marker) != 1:
              raise SystemExit(f'expected one moneyElement marker, found {text.count(marker)}')
          source.write_text(text.replace(marker, helper, 1))

          test = Path('packages/domain/src/zatca/__tests__/phase2.test.ts')
          tests = test.read_text()
          test_marker = "  it('uses KGM for immutable weighted-item snapshots', () => {"
          regression = """  it('emits mandatory KSA line VAT and VAT-inclusive totals from historical line truth', () => {
            const standard = renderZatcaSimplifiedInvoiceHashPayload(input()).canonicalXml;
            expect(standard).toContain(
              '<cbc:LineExtensionAmount currencyID=\"SAR\">100.00</cbc:LineExtensionAmount><cac:TaxTotal><cbc:TaxAmount currencyID=\"SAR\">15.00</cbc:TaxAmount><cbc:RoundingAmount currencyID=\"SAR\">115.00</cbc:RoundingAmount></cac:TaxTotal>',
            );

            const discountedSale = sale({
              priceMode: 'tax-inclusive',
              grossMinor: '11500',
              lineDiscountMinor: '1150',
              netMinor: '9000',
              vatMinor: '1350',
              totalMinor: '10350',
              tenderedMinor: '10350',
              lines: [
                {
                  ...sale().lines[0]!,
                  unitPriceMinor: '11500',
                  grossMinor: '11500',
                  lineDiscountMinor: '1150',
                  netMinor: '9000',
                  vatMinor: '1350',
                  totalMinor: '10350',
                },
              ],
            });
            const discountedInvoice = invoice({
              netMinor: '9000',
              vatMinor: '1350',
              totalMinor: '10350',
              taxBreakdown: [
                { vatBasisPoints: VAT_STANDARD_BP, netMinor: '9000', vatMinor: '1350' },
              ],
            });
            const discounted = renderZatcaSimplifiedInvoiceHashPayload(
              input({ sale: discountedSale, invoice: discountedInvoice }),
            ).canonicalXml;
            expect(discounted).toContain(
              '<cbc:LineExtensionAmount currencyID=\"SAR\">90.00</cbc:LineExtensionAmount><cac:AllowanceCharge>',
            );
            expect(discounted).toContain(
              '</cac:AllowanceCharge><cac:TaxTotal><cbc:TaxAmount currencyID=\"SAR\">13.50</cbc:TaxAmount><cbc:RoundingAmount currencyID=\"SAR\">103.50</cbc:RoundingAmount></cac:TaxTotal><cac:Item>',
            );
          });

          """
          if tests.count(test_marker) != 1:
              raise SystemExit(f'expected one test insertion marker, found {tests.count(test_marker)}')
          test.write_text(tests.replace(test_marker, regression + test_marker, 1))
          PY

      - name: Format exact candidate files
        run: npx prettier@3.9.6 --write packages/domain/src/zatca/phase2.ts packages/domain/src/zatca/__tests__/phase2.test.ts

      - name: Build and run targeted regression
        run: |
          npm run build -w @korvi/domain
          npx vitest run packages/domain/src/zatca/__tests__/phase2.test.ts

      - name: Publish clean candidate
        run: |
          rm .github/workflows/zatca-38-line-tax-fix.yml
          rm .github/workflows/zatca-38-line-tax-repair.yml
          test ! -e .github/workflows/zatca-38-line-tax-fix.yml
          test ! -e .github/workflows/zatca-38-line-tax-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/domain/src/zatca/phase2.ts packages/domain/src/zatca/__tests__/phase2.test.ts .github/workflows/zatca-38-line-tax-fix.yml .github/workflows/zatca-38-line-tax-repair.yml
          git diff --cached --check
          git commit -m "fix(zatca): emit mandatory line VAT totals"
          git push origin HEAD:review/zatca-38-ubl-hash
