name: V2-4 Offline Lot Safety Format

on:
  push:
    branches:
      - mastermind/v2-strengthening
    paths:
      - .github/workflows/v2-4-offline-lot-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: mastermind/v2-strengthening
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install exact lockfile
        run: npm ci --registry=https://registry.npmjs.org
      - name: Apply canonical formatter
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write             packages/domain/src/ports/persistence.ts             packages/database/src/repositories/product-repository.ts             packages/database/src/repositories/retail-pricing-repository.ts             apps/api/src/routes/business.ts             apps/api/src/checkout/service.ts             apps/api/src/__tests__/checkout-service.test.ts             apps/pos-web/src/lib/api-types.ts             apps/pos-web/src/lib/cart.ts             apps/pos-web/src/lib/offline-store.ts             apps/pos-web/src/lib/failures.ts             apps/pos-web/src/lib/__tests__/cart.test.ts             apps/pos-web/src/components/cashier-screen.tsx
          rm .github/workflows/v2-4-offline-lot-format.yml
          git diff --check
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "korvi-v2-4-format"
          git config user.email "actions@users.noreply.github.com"
          git add             packages/domain/src/ports/persistence.ts             packages/database/src/repositories/product-repository.ts             packages/database/src/repositories/retail-pricing-repository.ts             apps/api/src/routes/business.ts             apps/api/src/checkout/service.ts             apps/api/src/__tests__/checkout-service.test.ts             apps/pos-web/src/lib/api-types.ts             apps/pos-web/src/lib/cart.ts             apps/pos-web/src/lib/offline-store.ts             apps/pos-web/src/lib/failures.ts             apps/pos-web/src/lib/__tests__/cart.test.ts             apps/pos-web/src/components/cashier-screen.tsx             .github/workflows/v2-4-offline-lot-format.yml
          git commit -m "style(v2-4): format offline lot safety"
          git push origin HEAD:mastermind/v2-strengthening
