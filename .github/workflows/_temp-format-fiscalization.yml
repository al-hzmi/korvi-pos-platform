name: Temp Format Fiscalization

on:
  push:
    branches:
      - strike/product-routing-p0
    paths:
      - .github/workflows/_temp-format-fiscalization.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: strike/product-routing-p0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --registry=https://registry.npmjs.org

      - name: Format fiscalization source
        run: npx prettier --write packages/domain/src/zatca/fiscalization.ts packages/database/src/zatca/fiscalization-repository.ts

      - name: Commit formatted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/domain/src/zatca/fiscalization.ts packages/database/src/zatca/fiscalization-repository.ts
          if git diff --cached --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git commit -m "style(zatca): format fiscalization authority"
          git push origin HEAD:strike/product-routing-p0
