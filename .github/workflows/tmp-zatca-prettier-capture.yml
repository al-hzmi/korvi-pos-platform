name: Temporary ZATCA Prettier Fix

on:
  push:
    branches:
      - strike/product-routing-p0

permissions:
  contents: write

jobs:
  format-and-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: strike/product-routing-p0
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install exact lockfile
        run: npm ci --registry=https://registry.npmjs.org
      - name: Apply canonical Prettier formatting and push if needed
        run: |
          npx prettier --write packages/database/src/__tests__/zatca-fiscalization-live.test.ts
          if git diff --quiet -- packages/database/src/__tests__/zatca-fiscalization-live.test.ts; then
            echo 'Target already canonical.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/database/src/__tests__/zatca-fiscalization-live.test.ts
          git commit -m 'style(zatca): canonicalize PostgreSQL fiscalization proof'
          git push origin HEAD:strike/product-routing-p0
