name: ZATCA 39 QR Cryptographic Material Remediation

on:
  push:
    branches:
      - review/zatca-39-csid-lifecycle
    paths:
      - .github/workflows/zatca-39-qr-crypto-material-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: review/zatca-39-csid-lifecycle
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --registry=https://registry.npmjs.org

      - name: Apply QR 7-9 cryptographic material corrections
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          function replaceExactlyOnce(path, before, after) {
            const input = readFileSync(path, 'utf8');
            const first = input.indexOf(before);
            if (first < 0 || input.indexOf(before, first + before.length) >= 0) {
              throw new Error(`Expected exactly one correction target in ${path}`);
            }
            writeFileSync(path, input.slice(0, first) + after + input.slice(first + before.length));
          }

          function replaceRegexExactlyOnce(path, regex, after) {
            const input = readFileSync(path, 'utf8');
            const matches = [...input.matchAll(new RegExp(regex.source, regex.flags.includes('g') ? regex.flags : `${regex.flags}g`))];
            if (matches.length !== 1) {
              throw new Error(`Expected exactly one regex correction target in ${path}, got ${matches.length}`);
            }
            writeFileSync(path, input.replace(regex, after));
          }

          const x509 = 'packages/domain/src/zatca/x509.ts';
          const x509Test = 'packages/domain/src/zatca/__tests__/x509.test.ts';
          const tlv = 'packages/domain/src/zatca/tlv.ts';
          const tlvTest = 'packages/domain/src/zatca/__tests__/tlv.test.ts';
          const sealer = 'apps/api/src/zatca/seal-simplified-invoice.ts';
          const sealerTest = 'apps/api/src/__tests__/zatca-seal-simplified-invoice.test.ts';

          replaceExactlyOnce(
            x509,
            "import { ZatcaInvoiceError } from './phase2.js';",
            "import { ecdsaDerToXmlDsigSignature } from './ecdsa.js';\nimport { ZatcaInvoiceError } from './phase2.js';",
          );
          replaceExactlyOnce(
            x509,
            `export interface ZatcaSigningCertificateMaterial {\n  /** Exact DER SubjectPublicKeyInfo carried by the signing certificate. */\n  readonly signingPublicKeySpkiDer: Uint8Array;\n  /** Exact DER ECDSA signatureValue carried by the certificate BIT STRING; QR tag 9. */\n  readonly technicalCaSignatureDer: Uint8Array;\n}`,
            `export interface ZatcaSigningCertificateMaterial {\n  /** Exact DER SubjectPublicKeyInfo carried by the signing certificate. */\n  readonly signingPublicKeySpkiDer: Uint8Array;\n  /** ZATCA QR tag 8 public-key BLOB: uncompressed secp256k1 X || Y, exactly 64 bytes. */\n  readonly signingPublicKeyRaw: Uint8Array;\n  /** Exact DER ECDSA signatureValue carried by the certificate BIT STRING. */\n  readonly technicalCaSignatureDer: Uint8Array;\n  /** ZATCA QR tag 9 technical-CA signature in IEEE P1363 r || s form, exactly 64 bytes. */\n  readonly technicalCaSignature: Uint8Array;\n}`,
          );
          replaceExactlyOnce(
            x509,
            `  validateSecp256k1Spki(bytes, subjectPublicKeyInfo);\n  const spkiDer = bytes.slice(subjectPublicKeyInfo.start, subjectPublicKeyInfo.end);`,
            `  const signingPublicKeyRaw = extractSecp256k1PublicKeyRaw(bytes, subjectPublicKeyInfo);\n  const spkiDer = bytes.slice(subjectPublicKeyInfo.start, subjectPublicKeyInfo.end);`,
          );
          replaceExactlyOnce(
            x509,
            `  const technicalCaSignatureDer = signatureContent.slice(1);\n  validateEcdsaSignatureDerShape(technicalCaSignatureDer);\n\n  return {\n    signingPublicKeySpkiDer: spkiDer,\n    technicalCaSignatureDer,\n  };`,
            `  const technicalCaSignatureDer = signatureContent.slice(1);\n  const technicalCaSignature = ecdsaDerToXmlDsigSignature(technicalCaSignatureDer);\n\n  return {\n    signingPublicKeySpkiDer: spkiDer,\n    signingPublicKeyRaw,\n    technicalCaSignatureDer,\n    technicalCaSignature,\n  };`,
          );
          replaceExactlyOnce(
            x509,
            `function validateSecp256k1Spki(bytes: Uint8Array, spki: DerElement): void {`,
            `function extractSecp256k1PublicKeyRaw(bytes: Uint8Array, spki: DerElement): Uint8Array {`,
          );
          replaceExactlyOnce(
            x509,
            `  if (\n    publicKeyContent.length !== UNCOMPRESSED_SECP256K1_POINT_BYTES + 1 ||\n    publicKeyContent[0] !== 0 ||\n    publicKeyContent[1] !== 0x04\n  ) {\n    throw new ZatcaInvoiceError(\n      'ZATCA secp256k1 SubjectPublicKeyInfo must contain one uncompressed 65-byte EC point.',\n    );\n  }\n}\n\nfunction validateEcdsaSignatureDerShape(signatureDer: Uint8Array): void {`,
            `  if (\n    publicKeyContent.length !== UNCOMPRESSED_SECP256K1_POINT_BYTES + 1 ||\n    publicKeyContent[0] !== 0 ||\n    publicKeyContent[1] !== 0x04\n  ) {\n    throw new ZatcaInvoiceError(\n      'ZATCA secp256k1 SubjectPublicKeyInfo must contain one uncompressed 65-byte EC point.',\n    );\n  }\n  return Uint8Array.from(publicKeyContent.subarray(2));\n}\n\nfunction validateEcdsaSignatureDerShape(signatureDer: Uint8Array): void {`,
          );
          replaceRegexExactlyOnce(
            x509,
            /\nfunction validateEcdsaSignatureDerShape\(signatureDer: Uint8Array\): void \{[\s\S]*?\n\}\n\n(?=function readAlgorithmOid)/,
            '\n',
          );

          replaceExactlyOnce(
            tlv,
            "import { TlvEncodingError } from '../errors.js';\nimport { bytesToBase64 } from './base64.js';",
            "import { TlvEncodingError } from '../errors.js';\nimport { bytesToBase64 } from './base64.js';\nimport { validateXmlDsigEcdsaSignature } from './ecdsa.js';",
          );
          replaceExactlyOnce(
            tlv,
            `const SHA256_BYTES = 32;`,
            `const SHA256_BYTES = 32;\nconst P1363_SIGNATURE_BYTES = 64;\nconst RAW_PUBLIC_KEY_BYTES = 64;`,
          );
          replaceExactlyOnce(
            tlv,
            ` * Tag 6 carries the exact 32-byte SHA-256 invoice hash, without an inner Base64 layer.\n * Tag 7 carries the UTF-8 Base64 text of the ASN.1 DER ECDSA signature.\n * Tag 8 carries the EGS public-key DER and tag 9 carries the technical CA signature\n * over that public key for simplified invoices. No private-key material belongs here.`,
            ` * Tag 6 carries the exact 32-byte SHA-256 invoice hash, without an inner Base64 layer.\n * Tag 7 carries the exact XMLDSIG SignatureValue Base64 text, whose decoded value is\n * IEEE P1363 secp256k1 r || s. Tag 8 carries the 64-byte public-key X || Y BLOB.\n * Tag 9 carries ZATCA technical CA's ECDSA signature in IEEE P1363 r || s form.\n * No private-key material belongs here.`,
          );
          replaceExactlyOnce(
            tlv,
            `export interface Phase2SimplifiedInvoiceQrInput extends SimplifiedInvoiceQrInput {\n  readonly invoiceHash: Uint8Array;\n  readonly ecdsaSignatureDer: Uint8Array;\n  readonly ecdsaPublicKeySpkiDer: Uint8Array;\n  readonly zatcaCaSignatureDer: Uint8Array;\n}`,
            `export interface Phase2SimplifiedInvoiceQrInput extends SimplifiedInvoiceQrInput {\n  readonly invoiceHash: Uint8Array;\n  /** Same fixed-width r || s value serialized by XMLDSIG SignatureValue before Base64. */\n  readonly ecdsaSignature: Uint8Array;\n  /** Uncompressed secp256k1 point without the 0x04 prefix: X || Y. */\n  readonly ecdsaPublicKey: Uint8Array;\n  /** ZATCA technical CA certificate signature converted from DER to IEEE P1363 r || s. */\n  readonly zatcaCaSignature: Uint8Array;\n}`,
          );
          replaceRegexExactlyOnce(
            tlv,
            /function requireNonEmptyCryptoField[\s\S]*?\n\}\n\n(?=\/\*\* Build all nine Phase 2 QR fields)/,
            `function requireNonEmptyCryptoField(tag: number, value: Uint8Array): Uint8Array {\n  if (value.length === 0) {\n    throw new TlvEncodingError(\`Cryptographic TLV value for tag \${String(tag)} must not be empty.\`);\n  }\n  if (value.length > MAX_TLV_VALUE_BYTES) {\n    throw new TlvEncodingError(\n      \`Cryptographic TLV value for tag \${String(tag)} is \${String(value.length)} bytes; \` +\n        'the single-byte length field allows at most 255.',\n    );\n  }\n  return Uint8Array.from(value);\n}\n\nfunction requireExactCryptoField(\n  tag: number,\n  value: Uint8Array,\n  expectedBytes: number,\n  label: string,\n): Uint8Array {\n  const copy = requireNonEmptyCryptoField(tag, value);\n  if (copy.length !== expectedBytes) {\n    throw new TlvEncodingError(\n      \`ZATCA \${label} for tag \${String(tag)} must be exactly \${String(expectedBytes)} bytes, got \${String(copy.length)}.\`,\n    );\n  }\n  return copy;\n}\n\nfunction requireP1363Signature(tag: number, value: Uint8Array): Uint8Array {\n  const copy = requireExactCryptoField(\n    tag,\n    value,\n    P1363_SIGNATURE_BYTES,\n    'IEEE P1363 ECDSA signature',\n  );\n  try {\n    return validateXmlDsigEcdsaSignature(copy);\n  } catch (error) {\n    const detail = error instanceof Error ? \` \${error.message}\` : '';\n    throw new TlvEncodingError(\`Invalid ZATCA ECDSA signature for tag \${String(tag)}.\${detail}\`);\n  }\n}\n\nfunction requireRawPublicKey(value: Uint8Array): Uint8Array {\n  const copy = requireExactCryptoField(\n    ZATCA_TAG.ECDSA_PUBLIC_KEY,\n    value,\n    RAW_PUBLIC_KEY_BYTES,\n    'ECDSA public-key BLOB',\n  );\n  if (copy.every((byte) => byte === 0)) {\n    throw new TlvEncodingError('ZATCA ECDSA public-key BLOB must not be the point at infinity.');\n  }\n  return copy;\n}\n\n`,
          );
          replaceRegexExactlyOnce(
            tlv,
            /  const signatureDer = requireDerSequence[\s\S]*?  return fields;\n\}/,
            `  const invoiceHash = Uint8Array.from(input.invoiceHash);\n  const signature = requireP1363Signature(ZATCA_TAG.ECDSA_SIGNATURE, input.ecdsaSignature);\n  const publicKey = requireRawPublicKey(input.ecdsaPublicKey);\n  const caSignature = requireP1363Signature(\n    ZATCA_TAG.ZATCA_CA_SIGNATURE,\n    input.zatcaCaSignature,\n  );\n  const fields = textualFieldsAsBinary(simplifiedInvoiceQrFields(input));\n  fields.push(\n    { tag: ZATCA_TAG.XML_INVOICE_HASH, value: invoiceHash },\n    { tag: ZATCA_TAG.ECDSA_SIGNATURE, value: encoder.encode(bytesToBase64(signature)) },\n    { tag: ZATCA_TAG.ECDSA_PUBLIC_KEY, value: publicKey },\n    { tag: ZATCA_TAG.ZATCA_CA_SIGNATURE, value: caSignature },\n  );\n  return fields;\n}`,
          );

          replaceRegexExactlyOnce(
            tlvTest,
            /\nfunction derSequence\([\s\S]*?\n\}\n(?=\ndescribe\('base64')/,
            '\n',
          );
          replaceRegexExactlyOnce(
            tlvTest,
            /describe\('Phase 2 simplified invoice QR',[\s\S]*$/,
            `describe('Phase 2 simplified invoice QR', () => {\n  const phase1 = {\n    sellerName: 'متجر كورفي',\n    vatRegistrationNumber: '310122393500003',\n    timestamp: '2026-08-07T09:45:00Z',\n    invoiceTotalWithVat: moneyFromMajorString('115.00'),\n    vatTotal: moneyFromMajorString('15.00'),\n  };\n  const signature = new Uint8Array(64);\n  signature[31] = 1;\n  signature[63] = 2;\n  const publicKey = new Uint8Array(64).fill(0x11);\n  const caSignature = new Uint8Array(64);\n  caSignature[31] = 3;\n  caSignature[63] = 4;\n  const input = {\n    ...phase1,\n    invoiceHash: Uint8Array.from({ length: 32 }, (_, index) => index),\n    ecdsaSignature: signature,\n    ecdsaPublicKey: publicKey,\n    zatcaCaSignature: caSignature,\n  };\n\n  it('orders exactly tags 1 through 9 and preserves the Phase 1 prefix byte-for-byte', () => {\n    const rawPhase1 = Buffer.from(simplifiedInvoiceQr(phase1), 'base64');\n    const rawPhase2 = Buffer.from(phase2SimplifiedInvoiceQr(input), 'base64');\n    expect(rawPhase2.subarray(0, rawPhase1.length)).toEqual(rawPhase1);\n\n    const tags: number[] = [];\n    let offset = 0;\n    while (offset < rawPhase2.length) {\n      const tag = rawPhase2[offset] as number;\n      const length = rawPhase2[offset + 1] as number;\n      tags.push(tag);\n      offset += 2 + length;\n    }\n    expect(tags).toEqual([1, 2, 3, 4, 5, 6, 7, 8, 9]);\n  });\n\n  it('encodes tag 6 as the exact 32-byte SHA-256 value with no inner Base64 layer', () => {\n    const fields = phase2SimplifiedInvoiceQrFields(input);\n    const hash = fields.find((field) => field.tag === ZATCA_TAG.XML_INVOICE_HASH);\n    expect(hash?.value).toEqual(input.invoiceHash);\n    expect(hash?.value.length).toBe(32);\n  });\n\n  it('encodes tag 7 as the same Base64 text carried by XMLDSIG SignatureValue', () => {\n    const fields = phase2SimplifiedInvoiceQrFields(input);\n    const value = fields.find((field) => field.tag === ZATCA_TAG.ECDSA_SIGNATURE)?.value;\n    expect(Buffer.from(value ?? []).toString('utf8')).toBe(Buffer.from(signature).toString('base64'));\n    expect(value?.length).toBe(88);\n  });\n\n  it('encodes tags 8 and 9 as exact 64-byte ZATCA public-key/P1363 values', () => {\n    const fields = phase2SimplifiedInvoiceQrFields(input);\n    const encodedPublicKey = fields.find((field) => field.tag === ZATCA_TAG.ECDSA_PUBLIC_KEY);\n    const encodedCaSignature = fields.find((field) => field.tag === ZATCA_TAG.ZATCA_CA_SIGNATURE);\n    expect(encodedPublicKey?.value).toEqual(publicKey);\n    expect(encodedPublicKey?.value).toHaveLength(64);\n    expect(encodedCaSignature?.value).toEqual(caSignature);\n    expect(encodedCaSignature?.value).toHaveLength(64);\n  });\n\n  it('copies caller-owned cryptographic buffers when constructing fields', () => {\n    const mutableSignature = Uint8Array.from(signature);\n    const mutablePublicKey = Uint8Array.from(publicKey);\n    const mutableCaSignature = Uint8Array.from(caSignature);\n    const fields = phase2SimplifiedInvoiceQrFields({\n      ...input,\n      ecdsaSignature: mutableSignature,\n      ecdsaPublicKey: mutablePublicKey,\n      zatcaCaSignature: mutableCaSignature,\n    });\n    mutableSignature[31] = 99;\n    mutablePublicKey[0] = 99;\n    mutableCaSignature[31] = 99;\n    expect(Buffer.from(fields.find((field) => field.tag === 7)?.value ?? []).toString('utf8')).toBe(\n      Buffer.from(signature).toString('base64'),\n    );\n    expect(fields.find((field) => field.tag === 8)?.value[0]).toBe(0x11);\n    expect(fields.find((field) => field.tag === 9)?.value[31]).toBe(3);\n  });\n\n  it('requires a real SHA-256-width invoice hash', () => {\n    expect(() => phase2SimplifiedInvoiceQr({ ...input, invoiceHash: new Uint8Array(31) })).toThrow(\n      TlvEncodingError,\n    );\n    expect(() => phase2SimplifiedInvoiceQr({ ...input, invoiceHash: new Uint8Array(33) })).toThrow(\n      TlvEncodingError,\n    );\n  });\n\n  it('rejects malformed QR signature/public-key widths and zero cryptographic values', () => {\n    expect(() =>\n      phase2SimplifiedInvoiceQr({ ...input, ecdsaSignature: new Uint8Array(63) }),\n    ).toThrow(TlvEncodingError);\n    expect(() =>\n      phase2SimplifiedInvoiceQr({ ...input, ecdsaSignature: new Uint8Array(64) }),\n    ).toThrow(TlvEncodingError);\n    expect(() =>\n      phase2SimplifiedInvoiceQr({ ...input, ecdsaPublicKey: new Uint8Array(65) }),\n    ).toThrow(TlvEncodingError);\n    expect(() =>\n      phase2SimplifiedInvoiceQr({ ...input, ecdsaPublicKey: new Uint8Array(64) }),\n    ).toThrow(TlvEncodingError);\n    expect(() =>\n      phase2SimplifiedInvoiceQr({ ...input, zatcaCaSignature: new Uint8Array(65) }),\n    ).toThrow(TlvEncodingError);\n    expect(() =>\n      phase2SimplifiedInvoiceQr({ ...input, zatcaCaSignature: new Uint8Array(64) }),\n    ).toThrow(TlvEncodingError);\n  });\n\n  it('rejects a QR payload that exceeds the ZATCA 700-character Base64 limit', () => {\n    expect(() =>\n      phase2SimplifiedInvoiceQr({\n        ...input,\n        sellerName: 'س'.repeat(120),\n      }),\n    ).toThrow(TlvEncodingError);\n  });\n});\n`,
          );

          replaceRegexExactlyOnce(
            x509Test,
            /function certificate\([\s\S]*?\n\}\n\n(?=describe\('ZATCA signing certificate DER material')/,
            `function certificate(\n  options: {\n    curve?: Uint8Array;\n    outerSignatureAlgorithm?: Uint8Array;\n    tbsSignatureAlgorithm?: Uint8Array;\n    unusedSignatureBits?: number;\n  } = {},\n): {\n  certificateDer: Uint8Array;\n  publicKeySpkiDer: Uint8Array;\n  publicKeyRaw: Uint8Array;\n  caSignatureDer: Uint8Array;\n} {\n  const publicKeySpkiDer = spki(options.curve);\n  const publicKeyRaw = new Uint8Array(64).fill(0x11);\n  const tbsAlgorithm = algorithm(options.tbsSignatureAlgorithm ?? OID_ECDSA_SHA256);\n  const outerAlgorithm = algorithm(options.outerSignatureAlgorithm ?? OID_ECDSA_SHA256);\n  const tbs = der(\n    0x30,\n    der(0xa0, der(0x02, Uint8Array.of(2))),\n    der(0x02, Uint8Array.of(1)),\n    tbsAlgorithm,\n    der(0x30),\n    der(0x30),\n    der(0x30),\n    publicKeySpkiDer,\n  );\n  const caSignatureDer = ecdsaSignature();\n  return {\n    certificateDer: der(\n      0x30,\n      tbs,\n      outerAlgorithm,\n      der(0x03, Uint8Array.of(options.unusedSignatureBits ?? 0), caSignatureDer),\n    ),\n    publicKeySpkiDer,\n    publicKeyRaw,\n    caSignatureDer,\n  };\n}\n\n`,
          );
          replaceExactlyOnce(
            x509Test,
            `  it('extracts the exact secp256k1 SPKI and technical-CA signature defensively', () => {\n    const fixture = certificate();\n    const result = extractZatcaSigningCertificateMaterial(fixture.certificateDer);\n\n    expect(result.signingPublicKeySpkiDer).toEqual(fixture.publicKeySpkiDer);\n    expect(result.technicalCaSignatureDer).toEqual(fixture.caSignatureDer);\n\n    result.signingPublicKeySpkiDer[0] = 0;\n    result.technicalCaSignatureDer[0] = 0;\n    expect(fixture.publicKeySpkiDer[0]).toBe(0x30);\n    expect(fixture.caSignatureDer[0]).toBe(0x30);\n  });`,
            `  it('extracts SPKI plus exact 64-byte QR public-key and CA-signature material defensively', () => {\n    const fixture = certificate();\n    const result = extractZatcaSigningCertificateMaterial(fixture.certificateDer);\n    const expectedCaSignature = new Uint8Array(64);\n    expectedCaSignature[31] = 1;\n    expectedCaSignature[63] = 2;\n\n    expect(result.signingPublicKeySpkiDer).toEqual(fixture.publicKeySpkiDer);\n    expect(result.signingPublicKeyRaw).toEqual(fixture.publicKeyRaw);\n    expect(result.signingPublicKeyRaw).toHaveLength(64);\n    expect(result.technicalCaSignatureDer).toEqual(fixture.caSignatureDer);\n    expect(result.technicalCaSignature).toEqual(expectedCaSignature);\n    expect(result.technicalCaSignature).toHaveLength(64);\n\n    result.signingPublicKeySpkiDer[0] = 0;\n    result.signingPublicKeyRaw[0] = 0;\n    result.technicalCaSignatureDer[0] = 0;\n    result.technicalCaSignature[31] = 0;\n    expect(fixture.publicKeySpkiDer[0]).toBe(0x30);\n    expect(fixture.publicKeyRaw[0]).toBe(0x11);\n    expect(fixture.caSignatureDer[0]).toBe(0x30);\n    expect(expectedCaSignature[31]).toBe(1);\n  });`,
          );

          replaceExactlyOnce(
            sealer,
            `  readonly signingPublicKeySpkiDer: Uint8Array;\n  readonly technicalCaSignatureDer: Uint8Array;`,
            `  readonly signingPublicKeySpkiDer: Uint8Array;\n  /** Exact 64-byte X || Y value encoded into QR tag 8. */\n  readonly signingPublicKeyRaw: Uint8Array;\n  readonly technicalCaSignatureDer: Uint8Array;\n  /** Exact 64-byte IEEE P1363 value encoded into QR tag 9. */\n  readonly technicalCaSignature: Uint8Array;`,
          );
          replaceExactlyOnce(
            sealer,
            `        invoiceHash: invoiceDigest,\n        ecdsaSignatureDer: signatureDer,\n        ecdsaPublicKeySpkiDer: certificateMaterial.signingPublicKeySpkiDer,\n        zatcaCaSignatureDer: certificateMaterial.technicalCaSignatureDer,`,
            `        invoiceHash: invoiceDigest,\n        ecdsaSignature: signatureValue,\n        ecdsaPublicKey: certificateMaterial.signingPublicKeyRaw,\n        zatcaCaSignature: certificateMaterial.technicalCaSignature,`,
          );
          replaceExactlyOnce(
            sealer,
            `        signingPublicKeySpkiDer: Uint8Array.from(certificateMaterial.signingPublicKeySpkiDer),\n        technicalCaSignatureDer: Uint8Array.from(certificateMaterial.technicalCaSignatureDer),`,
            `        signingPublicKeySpkiDer: Uint8Array.from(certificateMaterial.signingPublicKeySpkiDer),\n        signingPublicKeyRaw: Uint8Array.from(certificateMaterial.signingPublicKeyRaw),\n        technicalCaSignatureDer: Uint8Array.from(certificateMaterial.technicalCaSignatureDer),\n        technicalCaSignature: Uint8Array.from(certificateMaterial.technicalCaSignature),`,
          );

          replaceExactlyOnce(
            sealerTest,
            `  write('signing-public-key.spki.der', result.signingPublicKeySpkiDer);\n  write('technical-ca-signature.der', result.technicalCaSignatureDer);`,
            `  write('signing-public-key.spki.der', result.signingPublicKeySpkiDer);\n  write('qr-tag-8-public-key.raw', result.signingPublicKeyRaw);\n  write('technical-ca-signature.der', result.technicalCaSignatureDer);\n  write('qr-tag-9-ca-signature.p1363', result.technicalCaSignature);`,
          );
          replaceExactlyOnce(
            sealerTest,
            `    const tlv = decodeTlv(result.qrCodeBase64);\n    expect(tlv.get(6)).toEqual(result.invoiceHash);\n    expect(new TextDecoder().decode(tlv.get(7))).toBe(bytesToBase64(signatureDer));\n    expect(new TextDecoder().decode(tlv.get(7))).not.toBe(result.signatureValueBase64);\n    expect(tlv.get(8)).toEqual(result.signingPublicKeySpkiDer);\n    expect(tlv.get(9)).toEqual(result.technicalCaSignatureDer);`,
            `    const tlv = decodeTlv(result.qrCodeBase64);\n    expect(tlv.get(6)).toEqual(result.invoiceHash);\n    expect(new TextDecoder().decode(tlv.get(7))).toBe(result.signatureValueBase64);\n    expect(tlv.get(8)).toEqual(result.signingPublicKeyRaw);\n    expect(tlv.get(8)).toHaveLength(64);\n    expect(tlv.get(8)).not.toEqual(result.signingPublicKeySpkiDer);\n    expect(tlv.get(9)).toEqual(result.technicalCaSignature);\n    expect(tlv.get(9)).toHaveLength(64);\n    expect(tlv.get(9)).not.toEqual(result.technicalCaSignatureDer);`,
          );
          NODE

          npx prettier --write \
            packages/domain/src/zatca/x509.ts \
            packages/domain/src/zatca/__tests__/x509.test.ts \
            packages/domain/src/zatca/tlv.ts \
            packages/domain/src/zatca/__tests__/tlv.test.ts \
            apps/api/src/zatca/seal-simplified-invoice.ts \
            apps/api/src/__tests__/zatca-seal-simplified-invoice.test.ts

      - name: Build domain for targeted proof
        run: npm run build -w @korvi/domain

      - name: Targeted QR cryptographic regression proof
        run: |
          npx vitest run \
            packages/domain/src/zatca/__tests__/ecdsa.test.ts \
            packages/domain/src/zatca/__tests__/x509.test.ts \
            packages/domain/src/zatca/__tests__/tlv.test.ts \
            apps/api/src/__tests__/zatca-seal-simplified-invoice.test.ts

      - name: Full verify before commit
        run: npm run verify

      - name: Commit verified correction and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/zatca-39-qr-crypto-material-remediation.yml
          git add \
            packages/domain/src/zatca/x509.ts \
            packages/domain/src/zatca/__tests__/x509.test.ts \
            packages/domain/src/zatca/tlv.ts \
            packages/domain/src/zatca/__tests__/tlv.test.ts \
            apps/api/src/zatca/seal-simplified-invoice.ts \
            apps/api/src/__tests__/zatca-seal-simplified-invoice.test.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(zatca): encode QR cryptographic material canonically'
          git push origin HEAD:review/zatca-39-csid-lifecycle
