name: Temporary Test Typecheck Repair

on:
  push:
    branches:
      - strike/product-routing-p0
    paths:
      - '.github/workflows/tmp-typecheck-test-fix.yml'

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://korvi:korvi@localhost:5432/korvi_typecheck
    steps:
      - name: Check out exact branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: strike/product-routing-p0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact lockfile
        run: npm ci --registry=https://registry.npmjs.org

      - name: Apply exact typecheck repairs
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path('apps/api/src/__tests__/native-auth-e2e-live.test.ts'): (
                  "    expect(failureAudit.some((event) => event.metadata?.['reason'] === 'bad-password')).toBe(true);",
                  """    expect(failureAudit).toEqual(\n      expect.arrayContaining([\n        expect.objectContaining({\n          metadata: expect.objectContaining({ reason: 'bad-password' }),\n        }),\n      ]),\n    );""",
              ),
              Path('apps/api/src/__tests__/tenant-lifecycle-live.test.ts'): (
                  """  METRICS_AUTH_TOKEN: undefined,\n  PLATFORM_ADMIN_ACCESS_KEY: undefined,""",
                  """  METRICS_AUTH_TOKEN: undefined,\n  OFFLINE_LEASE_SIGNING_SEED_B64: undefined,\n  OFFLINE_LEASE_KEY_ID: undefined,\n  OFFLINE_LEASE_TTL_SECONDS: 72 * 3600,\n  PLATFORM_ADMIN_ACCESS_KEY: undefined,""",
              ),
              Path('apps/api/src/__tests__/zatca-checkout-fiscalization.test.ts'): (
                  "    expect(durable?.state).toBe('sealed');",
                  "    expect(durable).toMatchObject({ state: 'sealed' });",
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one repair target, found {text.count(old)}')
              path.write_text(text.replace(old, new))

      - name: Canonicalize touched tests
        run: npx --no-install prettier --write apps/api/src/__tests__/native-auth-e2e-live.test.ts apps/api/src/__tests__/tenant-lifecycle-live.test.ts apps/api/src/__tests__/zatca-checkout-fiscalization.test.ts

      - name: Generate and build prerequisites
        run: |
          npm run db:generate
          npm run build

      - name: Prove test typecheck
        run: npm run typecheck:tests

      - name: Commit verified repairs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/__tests__/native-auth-e2e-live.test.ts apps/api/src/__tests__/tenant-lifecycle-live.test.ts apps/api/src/__tests__/zatca-checkout-fiscalization.test.ts
          git diff --cached --check
          git commit -m 'test: repair live proof type safety'
          git push origin HEAD:strike/product-routing-p0
