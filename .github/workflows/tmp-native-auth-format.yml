name: Temporary Native Auth Formatter

on:
  push:
    branches:
      - strike/product-routing-p0

permissions:
  contents: write

jobs:
  format-native-auth-proof:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact lockfile
        run: npm ci --registry=https://registry.npmjs.org

      - name: Apply proof correction
        run: node .github/tmp-native-auth-transform.mjs

      - name: Canonical formatting
        run: npm exec prettier -- --write apps/api/src/__tests__/native-auth-e2e-live.test.ts

      - name: Verify canonical formatting
        run: npm exec prettier -- --check apps/api/src/__tests__/native-auth-e2e-live.test.ts

      - name: Commit canonical source and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/__tests__/native-auth-e2e-live.test.ts
          git rm .github/native-index-proof.patch .github/tmp-native-auth-transform.mjs .github/workflows/tmp-native-auth-format.yml
          git diff --cached --check
          git commit -m 'test(native-auth): canonicalize PostgreSQL proof'
          git push origin HEAD:strike/product-routing-p0
