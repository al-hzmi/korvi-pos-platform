name: Temporary Native Auth Formatter

on:
  push:
    branches:
      - strike/product-routing-p0

permissions:
  contents: read

jobs:
  format-native-auth-proof:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact lockfile
        run: npm ci --registry=https://registry.npmjs.org

      - name: Apply proof correction
        run: git apply .github/native-index-proof.patch

      - name: Canonical formatting
        run: npm exec prettier -- --write apps/api/src/__tests__/native-auth-e2e-live.test.ts

      - name: Verify canonical formatting
        run: npm exec prettier -- --check apps/api/src/__tests__/native-auth-e2e-live.test.ts

      - name: Upload canonical source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-auth-canonical-source-${{ github.sha }}
          path: apps/api/src/__tests__/native-auth-e2e-live.test.ts
          if-no-files-found: error
          retention-days: 1
