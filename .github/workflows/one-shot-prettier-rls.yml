name: One-shot Prettier exact output

on:
  push:
    branches:
      - tooling/prettier-rls-exact

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node scripts/verify-package-manager.mjs
      - run: npm ci --registry=https://registry.npmjs.org
      - name: Produce exact pinned Prettier output
        run: npx --no-install prettier --write packages/database/src/__tests__/rls-live.test.ts
      - name: Prove formatter idempotence
        run: npx --no-install prettier --check packages/database/src/__tests__/rls-live.test.ts
      - name: Commit exact formatter output on tooling branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- packages/database/src/__tests__/rls-live.test.ts; then
            echo 'Formatter output already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/database/src/__tests__/rls-live.test.ts
          git commit -m 'chore(tooling): capture exact pinned prettier output'
          git push origin HEAD:tooling/prettier-rls-exact
