name: One-shot Prettier exact output

on:
  push:
    branches:
      - tooling/prettier-rls-exact

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node scripts/verify-package-manager.mjs
      - run: npm ci --registry=https://registry.npmjs.org
      - name: Produce exact pinned Prettier output
        run: npx --no-install prettier --write packages/database/src/__tests__/rls-live.test.ts
      - name: Prove formatter idempotence
        run: npx --no-install prettier --check packages/database/src/__tests__/rls-live.test.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exact-prettier-rls-${{ github.sha }}
          path: packages/database/src/__tests__/rls-live.test.ts
          if-no-files-found: error
          retention-days: 1
