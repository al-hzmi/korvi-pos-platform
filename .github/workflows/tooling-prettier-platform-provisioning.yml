name: Tooling Prettier Platform Provisioning

on:
  push:
    branches:
      - tooling/prettier-platform-provisioning-20260915

permissions:
  contents: write

jobs:
  format-product-head:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: strike/product-routing-p0
          fetch-depth: 0
      - name: Guard exact product HEAD
        run: test "$(git rev-parse HEAD)" = "0b0f28c085b811694a0d60f41a5edfb15afc61ad"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node scripts/verify-package-manager.mjs
      - run: npm ci --registry=https://registry.npmjs.org
      - name: Format target files with repository Prettier
        run: |
          npx --no-install prettier --write \
            apps/api/src/platform/routes.ts \
            apps/pos-web/src/components/platform/platform-operational-bootstrap.tsx \
            packages/database/src/__tests__/platform-operational-bootstrap-live.test.ts \
            packages/database/src/control-plane/operational-bootstrap.ts
      - name: Verify formatting-only scope
        run: |
          expected="$(printf '%s\n' \
            apps/api/src/platform/routes.ts \
            apps/pos-web/src/components/platform/platform-operational-bootstrap.tsx \
            packages/database/src/__tests__/platform-operational-bootstrap-live.test.ts \
            packages/database/src/control-plane/operational-bootstrap.ts | sort)"
          actual="$(git diff --name-only | sort)"
          printf '%s\n' "$actual"
          test "$actual" = "$expected"
          git diff --check
      - name: Commit formatting-only patch to product branch
        run: |
          git config user.name "korvi-tooling"
          git config user.email "korvi-tooling@users.noreply.github.com"
          git add \
            apps/api/src/platform/routes.ts \
            apps/pos-web/src/components/platform/platform-operational-bootstrap.tsx \
            packages/database/src/__tests__/platform-operational-bootstrap-live.test.ts \
            packages/database/src/control-plane/operational-bootstrap.ts
          git commit -m "style(platform): apply canonical prettier formatting"
          git push origin HEAD:strike/product-routing-p0
