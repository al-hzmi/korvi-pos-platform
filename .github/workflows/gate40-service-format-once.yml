name: Gate 40 Service Format Once
on:
  push:
    branches: [review/zatca-40-submission-pipeline]
    paths: [.github/workflows/gate40-service-format-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: review/zatca-40-submission-pipeline
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npx prettier --write apps/api/src/zatca/invoice-submission-service.ts
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/zatca/invoice-submission-service.ts
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style(zatca): format Gate 40 coordinator'
          git push origin HEAD:review/zatca-40-submission-pipeline
