name: Format Helper

on:
  push:
    branches:
      - review/ops-readiness-lifecycle-scratch

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node scripts/verify-package-manager.mjs
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npx --no-install prettier --write apps/api/src/server.ts apps/api/src/__tests__/operational-readiness-live.test.ts
      - name: Commit formatting only when needed
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/api/src/server.ts apps/api/src/__tests__/operational-readiness-live.test.ts; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'korvi-ci'
          git config user.email 'korvi-ci@users.noreply.github.com'
          git add apps/api/src/server.ts apps/api/src/__tests__/operational-readiness-live.test.ts
          git commit -m 'style(api): apply repository formatter'
          git push origin HEAD:review/ops-readiness-lifecycle-scratch
