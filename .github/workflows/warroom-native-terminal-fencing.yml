name: War Room Native Terminal Fencing

on:
  push:
    branches:
      - strike/product-routing-p0

permissions:
  contents: write

jobs:
  fence-and-prove:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact lockfile
        run: npm ci --registry=https://registry.npmjs.org

      - name: Apply terminal-authority fencing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          native = Path('apps/api/src/native-auth/service.ts')
          source = native.read_text()
          replacements = [
              (
                  '''        maxDiscountBasisPoints: maxDiscountForRoles(authorization.roles),\n        branchId: challenge.branchId,\n      };\n      const binding: NativeSessionBinding = {''',
                  '''        maxDiscountBasisPoints: maxDiscountForRoles(authorization.roles),\n        branchId: challenge.branchId,\n        terminalId: challenge.terminalId,\n      };\n      const binding: NativeSessionBinding = {''',
              ),
              (
                  '''          maxDiscountBasisPoints: maxDiscountForRoles(authorization.roles),\n          branchId: context.branchId,\n        },\n        binding: {''',
                  '''          maxDiscountBasisPoints: maxDiscountForRoles(authorization.roles),\n          branchId: context.branchId,\n          terminalId: context.terminalId,\n        },\n        binding: {''',
              ),
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f'Refusing native patch: expected one exact marker, got {source.count(old)}')
              source = source.replace(old, new)
          native.write_text(source)

          business = Path('apps/api/src/routes/business.ts')
          source = business.read_text()

          old = '''function scopeOf(principal: AuthenticatedPrincipal): TenantScope {\n  return { tenantId: brandTenantId(principal.tenantId) };\n}\n'''
          new = '''function scopeOf(principal: AuthenticatedPrincipal): TenantScope {\n  return { tenantId: brandTenantId(principal.tenantId) };\n}\n\n/**\n * Resolve the only terminal this principal may address. Browser sessions do\n * not carry a terminal binding and keep the existing branch-scoped choice. An\n * installed session is device-bound, so a client-supplied terminal id is only\n * an assertion: it must equal the authenticated terminal exactly.\n */\nexport function authoritativeTerminalId(\n  principal: AuthenticatedPrincipal,\n  requestedTerminalId: string,\n): string | null {\n  const bound = principal.terminalId;\n  if (bound === undefined || bound === null) return requestedTerminalId;\n  return bound === requestedTerminalId ? bound : null;\n}\n'''
          if source.count(old) != 1:
              raise SystemExit('Refusing business patch: scope marker drifted.')
          source = source.replace(old, new)

          old = '''  const terminal = await terminals.findById(scopeOf(principal), terminalId);\n  if (terminal === null || !terminal.isActive) return null;\n  return terminal.branchId === principal.branchId ? terminal : null;'''
          new = '''  const authoritative = authoritativeTerminalId(principal, terminalId);\n  if (authoritative === null) return null;\n  const terminal = await terminals.findById(scopeOf(principal), authoritative);\n  if (terminal === null || !terminal.isActive) return null;\n  return terminal.branchId === principal.branchId ? terminal : null;'''
          if source.count(old) != 1:
              raise SystemExit('Refusing business patch: ownBranchTerminal marker drifted.')
          source = source.replace(old, new)

          operations = [
              ('checkout.checkout', 'const result = await deps.checkout.checkout({'),
              ('returns.create', 'const result = await deps.returns.create({'),
              ('drawer.recordMovement', 'const result = await deps.drawer.recordMovement({'),
              ('drawer.close', 'const result = await deps.drawer.close({'),
          ]
          for label, marker in operations:
              old = f'''      {marker}\n        principal,\n        operationId: parsed.data.operationId,\n        terminalId: parsed.data.terminalId,'''
              new = f'''      const terminalId = authoritativeTerminalId(principal, parsed.data.terminalId);\n      if (terminalId === null) return reply.code(404).send(UNKNOWN_TERMINAL);\n\n      {marker}\n        principal,\n        operationId: parsed.data.operationId,\n        terminalId,'''
              if source.count(old) != 1:
                  raise SystemExit(f'Refusing business patch: {label} marker count={source.count(old)}')
              source = source.replace(old, new)

          business.write_text(source)
          PY

          cat > apps/api/src/__tests__/native-terminal-fencing.test.ts <<'TS'
          import { readFileSync } from 'node:fs';
          import { fileURLToPath } from 'node:url';
          import { dirname, join } from 'node:path';
          import { describe, expect, it } from 'vitest';
          import { authoritativeTerminalId } from '../routes/business.js';
          import type { AuthenticatedPrincipal } from '@korvi/domain';

          const here = dirname(fileURLToPath(import.meta.url));
          const businessSource = readFileSync(join(here, '../routes/business.ts'), 'utf8');
          const nativeSource = readFileSync(join(here, '../native-auth/service.ts'), 'utf8');

          const BASE: AuthenticatedPrincipal = {
            tenantId: '018f2000-0000-7000-8000-00000000000a',
            tenantSlug: 'korvi-a',
            userId: '018f2000-0000-7000-8000-0000000000a4',
            sessionId: '018f2000-0000-7000-8000-0000000000f1',
            email: 'sara@korvi-a.test',
            displayName: 'سارة',
            roles: ['cashier'],
            permissions: ['product.read', 'sale.create', 'shift.open', 'shift.close'],
            maxDiscountBasisPoints: 0n,
            branchId: '018f2000-0000-7000-8000-0000000000a1',
          };
          const TERMINAL_A = '018f2000-0000-7000-8000-0000000000a2';
          const TERMINAL_B = '018f2000-0000-7000-8000-0000000000b2';

          describe('native terminal authority', () => {
            it('accepts exactly the terminal bound into an installed principal', () => {
              const native = { ...BASE, terminalId: TERMINAL_A };
              expect(authoritativeTerminalId(native, TERMINAL_A)).toBe(TERMINAL_A);
            });

            it('rejects substitution with another terminal even inside the same branch', () => {
              const native = { ...BASE, terminalId: TERMINAL_A };
              expect(authoritativeTerminalId(native, TERMINAL_B)).toBeNull();
            });

            it('leaves browser terminal selection unchanged when no device binding exists', () => {
              expect(authoritativeTerminalId(BASE, TERMINAL_B)).toBe(TERMINAL_B);
            });

            it('fences every till-addressed business path through the same authority resolver', () => {
              expect(
                businessSource.match(/authoritativeTerminalId\(principal, parsed\.data\.terminalId\)/g),
              ).toHaveLength(4);
              expect(businessSource).toContain(
                'const authoritative = authoritativeTerminalId(principal, terminalId);',
              );
            });

            it('derives native terminal identity from both challenge login and persisted session', () => {
              expect(nativeSource).toMatch(
                /branchId: challenge\.branchId,\s+terminalId: challenge\.terminalId,\s+};\s+const binding/,
              );
              expect(nativeSource).toMatch(
                /branchId: context\.branchId,\s+terminalId: context\.terminalId,\s+},\s+binding:/,
              );
            });
          });
          TS

      - name: Canonical formatting
        run: npx prettier --write apps/api/src/native-auth/service.ts apps/api/src/routes/business.ts apps/api/src/__tests__/native-terminal-fencing.test.ts

      - name: Build trusted workspaces
        run: npm run build

      - name: Targeted terminal fencing proof
        run: npm test -- apps/api/src/__tests__/native-terminal-fencing.test.ts apps/api/src/__tests__/business-routes.test.ts apps/api/src/__tests__/auth-routes.test.ts

      - name: Typecheck and diff hygiene
        run: |
          npm run typecheck
          git diff --check

      - name: Commit proven fencing and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/warroom-native-terminal-fencing.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/native-auth/service.ts \
            apps/api/src/routes/business.ts \
            apps/api/src/__tests__/native-terminal-fencing.test.ts
          git commit -m 'fix(native-auth): enforce installed terminal authority'
          git push origin HEAD:strike/product-routing-p0
