name: One-shot Gate45 migration proof alignment

on:
  push:
    branches:
      - tooling/gate45-migration-proof-20260915

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: tooling/gate45-migration-proof-20260915
      - name: Rewrite Gate45 migration authority call
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = '.github/workflows/gate-45-offline-reconciliation-proof.yml';
          const source = fs.readFileSync(path, 'utf8');
          const before = "          npx --no-install prisma migrate deploy\n          npx --no-install prisma migrate status\n          npx --no-install prisma migrate diff \\\n            --from-config-datasource \\\n            --to-schema prisma/schema.prisma \\\n            --exit-code";
          const after = "          bash ../../scripts/prove-migration-state.sh";
          const count = source.split(before).length - 1;
          if (count !== 1) throw new Error(`expected one stale Gate45 migration proof block, got ${count}`);
          fs.writeFileSync(path, source.replace(before, after));
          NODE
          git diff --check
      - name: Commit exact workflow output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'korvi-proof-bot'
          git config user.email 'korvi-proof-bot@users.noreply.github.com'
          git add .github/workflows/gate-45-offline-reconciliation-proof.yml
          git diff --cached --exit-code && { echo 'No changes produced' >&2; exit 1; } || true
          git commit -m 'fix(ci): align Gate45 with migration-history authority'
          git push origin HEAD:tooling/gate45-migration-proof-20260915
