name: V2 One-Shot Security Lock Refresh

on:
  push:
    branches:
      - mastermind/v2-strengthening
    paths:
      - .github/workflows/v2-one-shot-security-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: mastermind/v2-strengthening
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Refresh lockfile for reviewed security overrides
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --registry=https://registry.npmjs.org
          node -e "const l=require('./package-lock.json'); const p=l.packages; if(p['node_modules/sharp']?.version!=='0.35.5') process.exit(21); if(p['node_modules/source-map-js']?.version!=='1.2.2') process.exit(22)"
          rm .github/workflows/v2-one-shot-security-lock.yml
          git diff --check
      - name: Commit refreshed lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "korvi-v2-security"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json scripts/audit-allowlist.txt .github/workflows/v2-one-shot-security-lock.yml
          git commit -m "security: refresh patched transitive dependency floors"
          git push origin HEAD:mastermind/v2-strengthening
