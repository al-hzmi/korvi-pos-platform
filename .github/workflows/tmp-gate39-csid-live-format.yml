name: Temporary Gate39 CSID Live Formatter
on:
  push:
    branches: [review/zatca-39-csid-lifecycle]
    paths: [.github/workflows/tmp-gate39-csid-live-format.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npx prettier@3.9.6 --write packages/database/src/__tests__/zatca-csid-provisioning-live.test.ts
      - name: Commit formatter output
        run: |
          git config user.name korvi-ci
          git config user.email korvi-ci@users.noreply.github.com
          git add packages/database/src/__tests__/zatca-csid-provisioning-live.test.ts
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(zatca): format CSID PostgreSQL proof fixture"
          git push origin HEAD:review/zatca-39-csid-lifecycle
