name: War Room Installed Native Integrator

on:
  push:
    branches:
      - strike/product-routing-p0
    paths:
      - .github/workflows/warroom-installed-native-integrator.yml

permissions:
  contents: write

jobs:
  integrate-and-prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      KORVI_NATIVE_API_ORIGIN: https://api.staging.invalid/
    steps:
      - name: Check out exact authoritative commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Restore proven cashier-only source without build outputs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin warroom/installed-cashier
          git checkout origin/warroom/installed-cashier -- apps/cashier-client package-lock.json \
            .github/workflows/gate-14-windows-cashier-package.yml \
            .github/workflows/gate-14-android-cashier-package.yml
          rm -rf apps/cashier-client/src-tauri/target
          rm -f .github/workflows/warroom-installed-bootstrap-export.yml
          sed -i 's/- warroom\/installed-cashier/- strike\/product-routing-p0/' .github/workflows/gate-14-windows-cashier-package.yml
          sed -i 's/- warroom\/installed-cashier/- strike\/product-routing-p0/' .github/workflows/gate-14-android-cashier-package.yml
          sed -i '/KORVI_NATIVE_WEB_ORIGIN:/d' .github/workflows/gate-14-windows-cashier-package.yml
          sed -i '/KORVI_NATIVE_WEB_ORIGIN:/d' .github/workflows/gate-14-android-cashier-package.yml

      - name: Install native-auth transport and OS custody
        shell: bash
        run: |
          set -euo pipefail

          cat > apps/cashier-client/src-tauri/Cargo.toml <<'TOML'
          [package]
          name = "korvi-cashier"
          version = "0.1.0"
          edition = "2021"
          rust-version = "1.85"

          [lib]
          name = "korvi_cashier_lib"
          crate-type = ["staticlib", "cdylib", "rlib"]

          [build-dependencies]
          tauri-build = "=2.6.1"

          [dependencies]
          reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "charset", "json"] }
          serde = { version = "=1.0.229", features = ["derive"] }
          serde_json = "=1.0.145"
          tauri = { version = "=2.11.1", features = [] }

          [target.'cfg(windows)'.dependencies]
          base64 = "=0.22.1"
          sha2 = "=0.10.9"

          [target.'cfg(target_os = "android")'.dependencies]
          tauri-plugin-korvi-device-identity = { path = "tauri-plugin-korvi-device-identity" }
          TOML

          cat > apps/cashier-client/src-tauri/src/device_identity.rs <<'RUST'
          use serde::Serialize;
          use tauri::{AppHandle, Runtime};

          #[derive(Clone, Debug, Serialize)]
          #[serde(rename_all = "camelCase")]
          pub struct DeviceIdentityInfo {
              pub platform: String,
              pub installation_id: String,
              pub key_algorithm: String,
              pub public_key_spki: String,
              pub public_key_sha256: String,
              pub custody: String,
              pub hardware_backed: bool,
              pub strongbox_backed: bool,
          }

          #[cfg(windows)]
          mod platform {
              use super::DeviceIdentityInfo;
              use base64::{engine::general_purpose, Engine as _};
              use sha2::{Digest, Sha256};
              use std::{ffi::c_void, ptr};
              use tauri::{AppHandle, Runtime};

              type Handle = usize;
              type Status = i32;
              const SUCCESS: Status = 0;
              const KEY_NAME: &str = "Korvi Cashier Device Identity v1";
              const PLATFORM_PROVIDER: &str = "Microsoft Platform Crypto Provider";
              const SOFTWARE_PROVIDER: &str = "Microsoft Software Key Storage Provider";
              const ECDSA_P256: &str = "ECDSA_P256";
              const ECC_PUBLIC_BLOB: &str = "ECCPUBLICBLOB";

              #[link(name = "ncrypt")]
              extern "system" {
                  fn NCryptOpenStorageProvider(provider: *mut Handle, name: *const u16, flags: u32) -> Status;
                  fn NCryptOpenKey(provider: Handle, key: *mut Handle, name: *const u16, legacy: u32, flags: u32) -> Status;
                  fn NCryptCreatePersistedKey(provider: Handle, key: *mut Handle, algorithm: *const u16, name: *const u16, legacy: u32, flags: u32) -> Status;
                  fn NCryptFinalizeKey(key: Handle, flags: u32) -> Status;
                  fn NCryptExportKey(key: Handle, export_key: Handle, blob_type: *const u16, params: *mut c_void, output: *mut u8, output_len: u32, result: *mut u32, flags: u32) -> Status;
                  fn NCryptSignHash(key: Handle, padding: *mut c_void, hash: *const u8, hash_len: u32, signature: *mut u8, signature_len: u32, result: *mut u32, flags: u32) -> Status;
                  fn NCryptFreeObject(object: Handle) -> Status;
              }

              fn wide(value: &str) -> Vec<u16> {
                  value.encode_utf16().chain(std::iter::once(0)).collect()
              }

              struct CngKey { provider: Handle, key: Handle, hardware: bool }
              impl Drop for CngKey {
                  fn drop(&mut self) {
                      unsafe { let _ = NCryptFreeObject(self.key); let _ = NCryptFreeObject(self.provider); }
                  }
              }

              fn open_provider(name: &str) -> Result<Handle, Status> {
                  let mut provider = 0usize;
                  let status = unsafe { NCryptOpenStorageProvider(&mut provider, wide(name).as_ptr(), 0) };
                  if status == SUCCESS { Ok(provider) } else { Err(status) }
              }

              fn open_existing(provider: Handle) -> Result<Handle, Status> {
                  let mut key = 0usize;
                  let status = unsafe { NCryptOpenKey(provider, &mut key, wide(KEY_NAME).as_ptr(), 0, 0) };
                  if status == SUCCESS { Ok(key) } else { Err(status) }
              }

              fn open_or_create() -> Result<CngKey, String> {
                  for (provider_name, hardware) in [(PLATFORM_PROVIDER, true), (SOFTWARE_PROVIDER, false)] {
                      if let Ok(provider) = open_provider(provider_name) {
                          if let Ok(key) = open_existing(provider) {
                              return Ok(CngKey { provider, key, hardware });
                          }
                          unsafe { let _ = NCryptFreeObject(provider); }
                      }
                  }
                  for (provider_name, hardware) in [(PLATFORM_PROVIDER, true), (SOFTWARE_PROVIDER, false)] {
                      let provider = match open_provider(provider_name) { Ok(value) => value, Err(_) => continue };
                      let mut key = 0usize;
                      let created = unsafe {
                          NCryptCreatePersistedKey(provider, &mut key, wide(ECDSA_P256).as_ptr(), wide(KEY_NAME).as_ptr(), 0, 0)
                      };
                      if created == SUCCESS && unsafe { NCryptFinalizeKey(key, 0) } == SUCCESS {
                          return Ok(CngKey { provider, key, hardware });
                      }
                      if key != 0 { unsafe { let _ = NCryptFreeObject(key); } }
                      unsafe { let _ = NCryptFreeObject(provider); }
                  }
                  Err("Windows CNG could not create or open the Korvi device key".into())
              }

              fn public_spki(key: Handle) -> Result<Vec<u8>, String> {
                  let blob = wide(ECC_PUBLIC_BLOB);
                  let mut needed = 0u32;
                  let status = unsafe { NCryptExportKey(key, 0, blob.as_ptr(), ptr::null_mut(), ptr::null_mut(), 0, &mut needed, 0) };
                  if status != SUCCESS || needed < 72 { return Err("Windows CNG public-key export failed".into()); }
                  let mut output = vec![0u8; needed as usize];
                  let status = unsafe { NCryptExportKey(key, 0, blob.as_ptr(), ptr::null_mut(), output.as_mut_ptr(), needed, &mut needed, 0) };
                  if status != SUCCESS { return Err("Windows CNG public-key export failed".into()); }
                  output.truncate(needed as usize);
                  let key_len = u32::from_le_bytes(output[4..8].try_into().map_err(|_| "invalid CNG public key")?) as usize;
                  if key_len != 32 || output.len() < 8 + key_len * 2 { return Err("Windows CNG returned an unexpected P-256 public key".into()); }
                  const PREFIX: &[u8] = &[
                      0x30,0x59,0x30,0x13,0x06,0x07,0x2a,0x86,0x48,0xce,0x3d,0x02,0x01,0x06,0x08,0x2a,
                      0x86,0x48,0xce,0x3d,0x03,0x01,0x07,0x03,0x42,0x00,0x04,
                  ];
                  let mut spki = Vec::with_capacity(PREFIX.len() + 64);
                  spki.extend_from_slice(PREFIX);
                  spki.extend_from_slice(&output[8..8 + 64]);
                  Ok(spki)
              }

              fn installation_id(hash: &[u8]) -> String {
                  let mut b = [0u8; 16]; b.copy_from_slice(&hash[..16]);
                  b[6] = (b[6] & 0x0f) | 0x50; b[8] = (b[8] & 0x3f) | 0x80;
                  format!("{:02x}{:02x}{:02x}{:02x}-{:02x}{:02x}-{:02x}{:02x}-{:02x}{:02x}-{:02x}{:02x}{:02x}{:02x}{:02x}{:02x}", b[0],b[1],b[2],b[3],b[4],b[5],b[6],b[7],b[8],b[9],b[10],b[11],b[12],b[13],b[14],b[15])
              }

              fn der_integer(raw: &[u8]) -> Vec<u8> {
                  let first = raw.iter().position(|b| *b != 0).unwrap_or(raw.len() - 1);
                  let body = &raw[first..];
                  let pad = body[0] & 0x80 != 0;
                  let mut out = Vec::with_capacity(body.len() + 3);
                  out.push(0x02); out.push((body.len() + usize::from(pad)) as u8);
                  if pad { out.push(0); }
                  out.extend_from_slice(body); out
              }

              fn p1363_to_der(raw: &[u8]) -> Result<Vec<u8>, String> {
                  if raw.len() != 64 { return Err("Windows CNG returned an unexpected ECDSA signature".into()); }
                  let r = der_integer(&raw[..32]); let s = der_integer(&raw[32..]);
                  let mut out = Vec::with_capacity(2 + r.len() + s.len());
                  out.push(0x30); out.push((r.len() + s.len()) as u8); out.extend_from_slice(&r); out.extend_from_slice(&s); Ok(out)
              }

              pub fn identity<R: Runtime>(_app: &AppHandle<R>) -> Result<DeviceIdentityInfo, String> {
                  let key = open_or_create()?; let spki = public_spki(key.key)?; let hash = Sha256::digest(&spki);
                  Ok(DeviceIdentityInfo {
                      platform: "windows".into(), installation_id: installation_id(&hash), key_algorithm: "p256".into(),
                      public_key_spki: general_purpose::STANDARD.encode(&spki), public_key_sha256: format!("{hash:x}"),
                      custody: if key.hardware { "windows-cng-tpm".into() } else { "windows-cng-software".into() },
                      hardware_backed: key.hardware, strongbox_backed: false,
                  })
              }

              pub fn sign<R: Runtime>(_app: &AppHandle<R>, payload: &str) -> Result<String, String> {
                  let key = open_or_create()?; let hash = Sha256::digest(payload.as_bytes()); let mut needed = 0u32;
                  let status = unsafe { NCryptSignHash(key.key, ptr::null_mut(), hash.as_ptr(), hash.len() as u32, ptr::null_mut(), 0, &mut needed, 0) };
                  if status != SUCCESS { return Err("Windows CNG signing failed".into()); }
                  let mut raw = vec![0u8; needed as usize];
                  let status = unsafe { NCryptSignHash(key.key, ptr::null_mut(), hash.as_ptr(), hash.len() as u32, raw.as_mut_ptr(), needed, &mut needed, 0) };
                  if status != SUCCESS { return Err("Windows CNG signing failed".into()); }
                  raw.truncate(needed as usize);
                  Ok(general_purpose::URL_SAFE_NO_PAD.encode(p1363_to_der(&raw)?))
              }
          }

          #[cfg(target_os = "android")]
          mod platform {
              use super::DeviceIdentityInfo;
              use tauri::{AppHandle, Runtime};
              use tauri_plugin_korvi_device_identity::DeviceIdentityExt;

              pub fn identity<R: Runtime>(app: &AppHandle<R>) -> Result<DeviceIdentityInfo, String> {
                  let value = app.device_identity().identity().map_err(|e| e.to_string())?;
                  Ok(DeviceIdentityInfo {
                      platform: "android".into(), installation_id: value.installation_id,
                      key_algorithm: value.key_algorithm, public_key_spki: value.public_key_spki,
                      public_key_sha256: value.public_key_sha256, custody: value.custody,
                      hardware_backed: value.hardware_backed, strongbox_backed: value.strongbox_backed,
                  })
              }
              pub fn sign<R: Runtime>(app: &AppHandle<R>, payload: &str) -> Result<String, String> {
                  app.device_identity().sign(payload.to_owned()).map_err(|e| e.to_string())
              }
          }

          #[cfg(not(any(windows, target_os = "android")))]
          mod platform {
              use super::DeviceIdentityInfo;
              use tauri::{AppHandle, Runtime};
              pub fn identity<R: Runtime>(_app: &AppHandle<R>) -> Result<DeviceIdentityInfo, String> { Err("Korvi installed device identity is supported only on Windows and Android".into()) }
              pub fn sign<R: Runtime>(_app: &AppHandle<R>, _payload: &str) -> Result<String, String> { Err("Korvi installed device identity is supported only on Windows and Android".into()) }
          }

          pub fn identity<R: Runtime>(app: &AppHandle<R>) -> Result<DeviceIdentityInfo, String> { platform::identity(app) }
          pub fn sign<R: Runtime>(app: &AppHandle<R>, payload: &str) -> Result<String, String> { platform::sign(app, payload) }
          RUST

          cat > apps/cashier-client/src-tauri/src/lib.rs <<'RUST'
          mod device_identity;

          use reqwest::{
              header::{ACCEPT, AUTHORIZATION, CONTENT_TYPE, RETRY_AFTER},
              redirect::Policy,
              Client, Method, Url,
          };
          use serde::{Deserialize, Serialize};
          use serde_json::{json, Value};
          use std::{collections::BTreeMap, fs, path::PathBuf, sync::Mutex, time::Duration};
          use tauri::{AppHandle, Manager, Runtime, State};

          const API_ORIGIN: &str = env!("KORVI_NATIVE_API_ORIGIN");

          #[derive(Clone, Debug, Deserialize, Serialize)]
          #[serde(rename_all = "camelCase")]
          struct DeviceBinding { tenant_id: String, device_enrollment_id: String }

          #[derive(Serialize)]
          #[serde(rename_all = "camelCase")]
          struct DeviceStatus {
              #[serde(flatten)] identity: device_identity::DeviceIdentityInfo,
              binding: Option<DeviceBinding>,
          }

          struct NativeHttpState {
              client: Client,
              api_origin: Url,
              session: Mutex<Option<String>>,
              binding_path: PathBuf,
          }

          impl NativeHttpState {
              fn new<R: Runtime>(app: &AppHandle<R>) -> Result<Self, String> {
                  let api_origin = parse_build_origin(API_ORIGIN, "KORVI_NATIVE_API_ORIGIN")?;
                  let client = Client::builder()
                      .redirect(Policy::none())
                      .timeout(Duration::from_secs(45))
                      .user_agent(concat!("Korvi-Cashier/", env!("CARGO_PKG_VERSION")))
                      .build()
                      .map_err(|error| format!("native HTTP client initialization failed: {error}"))?;
                  let dir = app.path().app_local_data_dir().map_err(|e| format!("cannot resolve local data directory: {e}"))?;
                  fs::create_dir_all(&dir).map_err(|e| format!("cannot create local data directory: {e}"))?;
                  Ok(Self { client, api_origin, session: Mutex::new(None), binding_path: dir.join("device-binding.json") })
              }
              fn binding(&self) -> Result<Option<DeviceBinding>, String> {
                  if !self.binding_path.exists() { return Ok(None); }
                  let bytes = fs::read(&self.binding_path).map_err(|e| format!("cannot read device binding: {e}"))?;
                  serde_json::from_slice(&bytes).map(Some).map_err(|_| "device binding is corrupt; explicit re-binding is required".into())
              }
              fn write_binding(&self, binding: &DeviceBinding) -> Result<(), String> {
                  let bytes = serde_json::to_vec(binding).map_err(|e| format!("cannot encode device binding: {e}"))?;
                  let temp = self.binding_path.with_extension("json.tmp");
                  fs::write(&temp, bytes).map_err(|e| format!("cannot write device binding: {e}"))?;
                  fs::rename(temp, &self.binding_path).map_err(|e| format!("cannot commit device binding: {e}"))
              }
          }

          fn parse_build_origin(value: &str, variable: &str) -> Result<Url, String> {
              let parsed = Url::parse(value).map_err(|_| format!("{variable} is not a valid absolute URL"))?;
              let loopback = matches!(parsed.host_str(), Some("127.0.0.1") | Some("localhost") | Some("::1"));
              if parsed.scheme() != "https" && !(cfg!(debug_assertions) && loopback) { return Err(format!("{variable} must use HTTPS outside debug builds")); }
              if parsed.username() != "" || parsed.password().is_some() || parsed.query().is_some() || parsed.fragment().is_some() || parsed.path() != "/" {
                  return Err(format!("{variable} must be an origin without credentials, path, query or fragment"));
              }
              Ok(parsed)
          }

          #[derive(Deserialize)]
          #[serde(rename_all = "camelCase")]
          struct NativeHttpRequest { path: String, method: String, headers: BTreeMap<String, String>, body: Option<String> }
          #[derive(Serialize)]
          #[serde(rename_all = "camelCase")]
          struct NativeHttpResponse { status: u16, headers: BTreeMap<String, String>, body: Option<String> }
          #[derive(Deserialize)]
          #[serde(rename_all = "camelCase")]
          struct NativeCredentials { tenant_slug: String, email: String, password: String }

          fn response(status: u16, body: Option<String>) -> NativeHttpResponse { NativeHttpResponse { status, headers: BTreeMap::new(), body } }
          fn json_response(status: u16, value: Value) -> NativeHttpResponse { response(status, Some(value.to_string())) }
          fn api_url(state: &NativeHttpState, path: &str) -> Result<Url, String> {
              let url = state.api_origin.join(path.trim_start_matches('/')).map_err(|_| "native transport could not construct API URL".to_string())?;
              if url.origin() != state.api_origin.origin() { return Err("native transport refused an API-origin escape".into()); }
              Ok(url)
          }
          fn validate_cashier_path(path: &str) -> Result<(), String> {
              if path.starts_with("//") || path.contains("://") || path.contains('\\') || path.split('/').any(|part| part == ".." || part == ".") || path.contains('#') {
                  return Err("native transport refused a non-Korvi API path".into());
              }
              let base = path.split('?').next().unwrap_or(path);
              let allowed = base == "/v1/products" || base == "/v1/terminals" || base == "/v1/sales" || base.starts_with("/v1/sales/") || base.starts_with("/v1/shifts/") || base.starts_with("/v1/returns/");
              if !allowed { return Err("installed Cashier refused a non-till API surface".into()); }
              Ok(())
          }
          fn parse_method(method: &str) -> Result<Method, String> {
              match method.to_ascii_uppercase().as_str() { "GET" => Ok(Method::GET), "POST" => Ok(Method::POST), _ => Err("native transport refused an unsupported HTTP method".into()) }
          }
          async fn body_response(resp: reqwest::Response) -> Result<NativeHttpResponse, String> {
              let status = resp.status().as_u16(); let mut headers = BTreeMap::new();
              for name in [CONTENT_TYPE, RETRY_AFTER] { if let Some(value) = resp.headers().get(&name).and_then(|v| v.to_str().ok()) { headers.insert(name.as_str().to_string(), value.to_string()); } }
              let body = if status == 204 { None } else { Some(resp.text().await.map_err(|e| format!("native response decoding failed: {e}"))?) };
              Ok(NativeHttpResponse { status, headers, body })
          }

          #[tauri::command]
          fn device_status<R: Runtime>(app: AppHandle<R>, state: State<'_, NativeHttpState>) -> Result<DeviceStatus, String> {
              Ok(DeviceStatus { identity: device_identity::identity(&app)?, binding: state.binding()? })
          }

          #[tauri::command]
          fn bind_device(state: State<'_, NativeHttpState>, tenant_id: String, device_enrollment_id: String) -> Result<(), String> {
              if tenant_id.len() != 36 || device_enrollment_id.len() != 36 { return Err("device binding requires canonical UUID identifiers".into()); }
              state.write_binding(&DeviceBinding { tenant_id, device_enrollment_id })
          }

          #[tauri::command]
          async fn native_login<R: Runtime>(app: AppHandle<R>, state: State<'_, NativeHttpState>, credentials: NativeCredentials) -> Result<NativeHttpResponse, String> {
              let binding = state.binding()?.ok_or_else(|| "installed Cashier is not bound to a Platform enrollment".to_string())?;
              let challenge_resp = state.client.post(api_url(&state, "/v1/native-auth/challenge")?)
                  .header(ACCEPT, "application/json").json(&json!({"tenantId": binding.tenant_id, "deviceEnrollmentId": binding.device_enrollment_id})).send().await
                  .map_err(|e| format!("native challenge request failed: {e}"))?;
              if !challenge_resp.status().is_success() { return body_response(challenge_resp).await; }
              let challenge: Value = challenge_resp.json().await.map_err(|e| format!("native challenge decoding failed: {e}"))?;
              let challenge_id = challenge.get("challengeId").and_then(Value::as_str).ok_or("challenge omitted id")?;
              let signing_payload = challenge.get("signingPayload").and_then(Value::as_str).ok_or("challenge omitted signing payload")?;
              let signature = device_identity::sign(&app, signing_payload)?;
              let login_resp = state.client.post(api_url(&state, "/v1/native-auth/login")?)
                  .header(ACCEPT, "application/json").json(&json!({
                      "tenantId": binding.tenant_id, "deviceEnrollmentId": binding.device_enrollment_id,
                      "challengeId": challenge_id, "tenantSlug": credentials.tenant_slug,
                      "email": credentials.email, "password": credentials.password, "signature": signature
                  })).send().await.map_err(|e| format!("native login request failed: {e}"))?;
              let status = login_resp.status().as_u16();
              let value: Value = login_resp.json().await.unwrap_or(Value::Null);
              if !(200..300).contains(&status) { return Ok(json_response(status, value)); }
              let token = value.get("token").and_then(Value::as_str).ok_or("native login omitted session token")?.to_owned();
              let principal = value.get("principal").cloned().ok_or("native login omitted principal")?;
              *state.session.lock().map_err(|_| "native session state poisoned")? = Some(token);
              Ok(json_response(status, principal))
          }

          #[tauri::command]
          async fn native_me(state: State<'_, NativeHttpState>) -> Result<NativeHttpResponse, String> {
              let token = state.session.lock().map_err(|_| "native session state poisoned")?.clone();
              let Some(token) = token else { return Ok(json_response(401, json!({"error":"unauthenticated"}))); };
              let resp = state.client.get(api_url(&state, "/v1/native-auth/me")?).header(AUTHORIZATION, format!("KorviNative {token}")).header(ACCEPT, "application/json").send().await.map_err(|e| format!("native session check failed: {e}"))?;
              let status = resp.status().as_u16(); let value: Value = resp.json().await.unwrap_or(Value::Null);
              if status == 401 { *state.session.lock().map_err(|_| "native session state poisoned")? = None; }
              if !(200..300).contains(&status) { return Ok(json_response(status, value)); }
              Ok(json_response(status, value.get("principal").cloned().ok_or("native session omitted principal")?))
          }

          #[tauri::command]
          async fn native_logout(state: State<'_, NativeHttpState>) -> Result<NativeHttpResponse, String> {
              let token = state.session.lock().map_err(|_| "native session state poisoned")?.take();
              if let Some(token) = token { let _ = state.client.post(api_url(&state, "/v1/native-auth/logout")?).header(AUTHORIZATION, format!("KorviNative {token}")).send().await; }
              Ok(response(204, None))
          }

          #[tauri::command]
          async fn http_request(state: State<'_, NativeHttpState>, request: NativeHttpRequest) -> Result<NativeHttpResponse, String> {
              validate_cashier_path(&request.path)?; let method = parse_method(&request.method)?;
              if method == Method::GET && request.body.is_some() { return Err("native transport refused a GET request body".into()); }
              for header in request.headers.keys() { if !header.eq_ignore_ascii_case("accept") && !header.eq_ignore_ascii_case("content-type") { return Err("native transport refused a WebView-controlled authority header".into()); } }
              let token = state.session.lock().map_err(|_| "native session state poisoned")?.clone();
              let Some(token) = token else { return Ok(json_response(401, json!({"error":"unauthenticated"}))); };
              let mut builder = state.client.request(method.clone(), api_url(&state, &request.path)?).header(ACCEPT, "application/json").header(AUTHORIZATION, format!("KorviNative {token}"));
              if let Some(content_type) = request.headers.iter().find(|(name, _)| name.eq_ignore_ascii_case("content-type")).map(|(_, value)| value) {
                  if content_type != "application/json" { return Err("native transport accepts JSON request bodies only".into()); }
                  builder = builder.header(CONTENT_TYPE, "application/json");
              }
              if let Some(body) = request.body { builder = builder.body(body); }
              let resp = builder.send().await.map_err(|e| format!("native network request failed: {e}"))?;
              if resp.status().as_u16() == 401 { *state.session.lock().map_err(|_| "native session state poisoned")? = None; }
              body_response(resp).await
          }

          #[cfg_attr(mobile, tauri::mobile_entry_point)]
          pub fn run() {
              let builder = tauri::Builder::default();
              #[cfg(target_os = "android")]
              let builder = builder.plugin(tauri_plugin_korvi_device_identity::init());
              builder
                  .setup(|app| { let state = NativeHttpState::new(app.handle()).map_err(std::io::Error::other)?; app.manage(state); Ok(()) })
                  .invoke_handler(tauri::generate_handler![device_status, bind_device, native_login, native_me, native_logout, http_request])
                  .run(tauri::generate_context!())
                  .expect("Korvi Cashier runtime failed");
          }
