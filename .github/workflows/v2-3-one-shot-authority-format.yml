name: V2-3 One-Shot Authority Format

on:
  push:
    branches:
      - mastermind/v2-strengthening
    paths:
      - .github/workflows/v2-3-one-shot-authority-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: mastermind/v2-strengthening
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - name: Format V2-3 authority files
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write \
            packages/domain/src/ports/persistence.ts \
            packages/database/src/errors.ts \
            packages/database/src/index.ts \
            packages/database/src/repositories/retail-pricing-repository.ts \
            packages/database/src/repositories/retail-pricing-settlement.ts \
            packages/database/src/repositories/sale-repository.ts
          rm .github/workflows/v2-3-one-shot-authority-format.yml
          git diff --check
      - name: Commit exact formatter output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "korvi-v2-format"
          git config user.email "actions@users.noreply.github.com"
          git add \
            packages/domain/src/ports/persistence.ts \
            packages/database/src/errors.ts \
            packages/database/src/index.ts \
            packages/database/src/repositories/retail-pricing-repository.ts \
            packages/database/src/repositories/retail-pricing-settlement.ts \
            packages/database/src/repositories/sale-repository.ts \
            .github/workflows/v2-3-one-shot-authority-format.yml
          git commit -m "style(v2-3): format retail pricing authority"
          git push origin HEAD:mastermind/v2-strengthening
