name: Readiness Prettier Diagnostic

on:
  push:
    branches:
      - review/readiness-prettier-diagnostic

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node scripts/verify-package-manager.mjs
      - run: npm ci --registry=https://registry.npmjs.org
      - name: Show canonical Prettier output
        run: |
          npx --no-install prettier --write apps/api/src/__tests__/readiness.test.ts
          echo '--- CANONICAL FILE ---'
          cat apps/api/src/__tests__/readiness.test.ts
          echo '--- DIFF ---'
          git diff -- apps/api/src/__tests__/readiness.test.ts
