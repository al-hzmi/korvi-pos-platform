name: Temporary Gate39 libxml2-wasm Lock

on:
  push:
    branches:
      - review/zatca-39-csid-lifecycle
    paths:
      - .github/workflows/tmp-gate39-libxml2-lock.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: review/zatca-39-csid-lifecycle
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Keep canonicalizer out of shared domain
        run: npm uninstall libxml2-wasm -w @korvi/domain --registry=https://registry.npmjs.org
      - name: Install exact canonicalizer in API infrastructure
        run: npm install libxml2-wasm@0.7.2 -w @korvi/api --save-exact --registry=https://registry.npmjs.org
      - name: Verify dependency policy
        run: |
          npm run versions:verify
          npm run audit
          git diff --check
      - name: Commit dependency boundary change only
        run: |
          git add packages/domain/package.json apps/api/package.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'korvi-ci'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'build(zatca): scope libxml2 canonicalizer to api'
          git push origin HEAD:review/zatca-39-csid-lifecycle
