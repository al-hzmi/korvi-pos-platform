name: Temporary Gate39 Validator Harness Repair

on:
  push:
    branches:
      - review/zatca-39-csid-lifecycle
    paths:
      - .github/workflows/tmp-gate39-proof-harness-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: review/zatca-39-csid-lifecycle
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install exact lockfile
        run: npm ci --registry=https://registry.npmjs.org
      - name: Repair DER Fatoora harness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/zatca-39-sealing-proof.mjs')
          text = path.read_text()
          text = text.replace("  ecdsaDerToXmlDsigSignature,\n", "")
          text = text.replace("  xmlDsigEcdsaSignatureToDer,\n", "")
          old = """    return ecdsaDerToXmlDsigSignature(Uint8Array.from(der));\n"""
          new = """    return Uint8Array.from(der);\n"""
          if text.count(old) != 1:
              raise SystemExit('legacy signSha256 conversion block not found exactly once')
          text = text.replace(old, new)
          old = """const signatureRaw = Uint8Array.from(Buffer.from(result.signatureValueBase64, 'base64'));\nconst signatureDer = xmlDsigEcdsaSignatureToDer(signatureRaw);\n"""
          new = """const signatureDer = Uint8Array.from(Buffer.from(result.signatureValueBase64, 'base64'));\n"""
          if text.count(old) != 1:
              raise SystemExit('legacy result signature conversion block not found exactly once')
          text = text.replace(old, new)
          text = text.replace("writePrivate('signature.raw', signatureRaw);\n", "")
          text = text.replace("  `signature_raw_bytes=${String(signatureRaw.length)}`,\n", "  `signature_der_bytes=${String(signatureDer.length)}`,\n")
          text = text.replace("  signaturePolicyIdentifier: 'urn:korvi:proof:zatca-signature-policy:v1',\n  signaturePolicyDigest: new Uint8Array(32).fill(0x39),\n", "")
          path.write_text(text)
          PY
          npx prettier@3.9.6 --write scripts/zatca-39-sealing-proof.mjs
          git diff --check
      - name: Commit repair
        run: |
          git add scripts/zatca-39-sealing-proof.mjs
          git config user.name 'korvi-ci'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix(zatca): align validator proof harness with DER stamp'
          git push origin HEAD:review/zatca-39-csid-lifecycle
