name: War Room Gate 5 Harness Repair

on:
  push:
    branches:
      - warroom/offline-full-shift
    paths:
      - .github/workflows/warroom-gate5-harness-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: warroom/offline-full-shift
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact lockfile
        run: npm ci --registry=https://registry.npmjs.org

      - name: Repair cashier-surface navigation and format canonically
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/gate5-full-shift-offline-proof.mjs')
          text = path.read_text()
          old = '${baseUrl}/`'
          new = '${baseUrl}/cashier`'
          count = text.count(old)
          if count != 4:
              raise SystemExit(f'Expected exactly 4 cashier browser-root navigations, found {count}')
          path.write_text(text.replace(old, new))
          PY
          npm exec prettier -- --write scripts/gate5-full-shift-offline-proof.mjs
          git diff --check
          if grep -Fq '${baseUrl}/`' scripts/gate5-full-shift-offline-proof.mjs; then
            echo 'Root merchant landing remains in Gate 5 cashier proof.' >&2
            exit 1
          fi

      - name: Commit repaired proof and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/warroom-gate5-harness-repair.yml
          git config user.name 'korvi-release-integrator'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/gate5-full-shift-offline-proof.mjs .github/workflows/warroom-gate5-harness-repair.yml
          git diff --cached --check
          git commit -m 'test(offline): target dedicated cashier surface'
          git push origin HEAD:warroom/offline-full-shift
