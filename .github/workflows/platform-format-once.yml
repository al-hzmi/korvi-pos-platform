name: Platform format once

on:
  push:
    branches:
      - strike/product-routing-p0
    paths:
      - .github/workflows/platform-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci --registry=https://registry.npmjs.org
      - name: Format platform files
        run: >-
          npx prettier --write
          apps/api/src/platform/auth.ts
          apps/api/src/platform/routes.ts
          apps/pos-web/src/components/platform/platform-app.tsx
          apps/pos-web/src/components/platform/platform-tenant.tsx
          apps/pos-web/src/components/platform/platform-ui.tsx
          apps/pos-web/src/lib/platform-api.ts
          packages/database/src/control-plane/tenant-read.ts
      - name: Verify formatting
        run: npm run format:check
      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/platform-format-once.yml
          git config user.name "korvi-ci"
          git config user.email "korvi-ci@users.noreply.github.com"
          git add apps/api/src/platform/auth.ts apps/api/src/platform/routes.ts apps/pos-web/src/components/platform packages/database/src/control-plane/tenant-read.ts apps/pos-web/src/lib/platform-api.ts
          git commit -m "chore: format platform admin surfaces"
          git push origin HEAD:strike/product-routing-p0
