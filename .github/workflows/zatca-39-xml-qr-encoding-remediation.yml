name: ZATCA 39 XML and QR Encoding Remediation

on:
  push:
    branches:
      - review/zatca-39-csid-lifecycle
    paths:
      - .github/workflows/zatca-39-xml-qr-encoding-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: review/zatca-39-csid-lifecycle
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --registry=https://registry.npmjs.org

      - name: Apply exact XMLDSIG and QR tag 6 corrections
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          function replaceExactlyOnce(path, before, after) {
            const input = readFileSync(path, 'utf8');
            const first = input.indexOf(before);
            if (first < 0 || input.indexOf(before, first + before.length) >= 0) {
              throw new Error(`Expected exactly one correction target in ${path}`);
            }
            writeFileSync(path, input.slice(0, first) + after + input.slice(first + before.length));
          }

          function replaceExactly(path, before, after, expectedCount) {
            const input = readFileSync(path, 'utf8');
            const count = input.split(before).length - 1;
            if (count !== expectedCount) {
              throw new Error(`Expected ${expectedCount} correction targets in ${path}, got ${count}`);
            }
            writeFileSync(path, input.split(before).join(after));
          }

          const envelope = 'packages/domain/src/zatca/xades-envelope.ts';
          const envelopeTest = 'packages/domain/src/zatca/__tests__/xades-envelope.test.ts';
          const tlv = 'packages/domain/src/zatca/tlv.ts';
          const tlvTest = 'packages/domain/src/zatca/__tests__/tlv.test.ts';
          const sealer = 'apps/api/src/zatca/seal-simplified-invoice.ts';
          const sealerTest = 'apps/api/src/__tests__/zatca-seal-simplified-invoice.test.ts';

          replaceExactlyOnce(
            envelope,
            "import { bytesToBase64 } from './base64.js';\nimport { ZatcaInvoiceError } from './phase2.js';",
            "import { bytesToBase64 } from './base64.js';\nimport { validateXmlDsigEcdsaSignature } from './ecdsa.js';\nimport { ZatcaInvoiceError } from './phase2.js';",
          );
          replaceExactlyOnce(
            envelope,
            `  /** Empty only while building the pre-signing canonicalization skeleton. */\n  readonly signatureValueBase64: string;`,
            `  /** Omit only while building the pre-signing canonicalization skeleton. */\n  readonly signatureValue?: Uint8Array;`,
          );
          replaceExactlyOnce(
            envelope,
            `  if (input.signatureValueBase64 !== '') {\n    assertBase64('XML SignatureValue', input.signatureValueBase64);\n  }\n\n  const signingCertificateDer = input.certificatePathDer[0];`,
            `  const signatureValueBase64 =\n    input.signatureValue === undefined\n      ? ''\n      : bytesToBase64(validateXmlDsigEcdsaSignature(input.signatureValue));\n\n  const signingCertificateDer = input.certificatePathDer[0];`,
          );
          replaceExactlyOnce(
            envelope,
            '<ds:SignatureValue>${input.signatureValueBase64}</ds:SignatureValue>',
            '<ds:SignatureValue>${signatureValueBase64}</ds:SignatureValue>',
          );
          replaceExactlyOnce(
            envelope,
            `    certificatePathDer: input.certificatePathDer,\n    signatureValueBase64: '',\n  });`,
            `    certificatePathDer: input.certificatePathDer,\n  });`,
          );

          replaceExactlyOnce(
            sealer,
            `  /** Exact Base64 of the canonical DER ECDSA stamp written into XML and QR tag 7. */\n  readonly signatureValueBase64: string;`,
            `  /** Base64 of XMLDSIG's fixed-width secp256k1 r || s SignatureValue. */\n  readonly signatureValueBase64: string;`,
          );
          replaceExactly(
            sealer,
            `          certificatePathDer,\n          signatureValueBase64: '',\n        }),`,
            `          certificatePathDer,\n        }),`,
            2,
          );
          replaceExactlyOnce(
            sealer,
            `      const signatureValueBase64 = bytesToBase64(signatureDer);\n\n      const qrCodeBase64`,
            `      const signatureValue = ecdsaDerToXmlDsigSignature(signatureDer);\n      const signatureValueBase64 = bytesToBase64(signatureValue);\n\n      const qrCodeBase64`,
          );
          replaceExactlyOnce(
            sealer,
            `          certificatePathDer,\n          signatureValueBase64,\n        }),`,
            `          certificatePathDer,\n          signatureValue,\n        }),`,
          );

          replaceExactlyOnce(
            tlv,
            ` * Tag 6 carries the 44-byte UTF-8 Base64 text of the 32-byte invoice hash.`,
            ` * Tag 6 carries the exact 32-byte SHA-256 invoice hash, without an inner Base64 layer.`,
          );
          replaceExactlyOnce(
            tlv,
            `  const invoiceHashBase64 = bytesToBase64(Uint8Array.from(input.invoiceHash));\n  const signatureBase64 = bytesToBase64(signatureDer);`,
            `  const invoiceHash = Uint8Array.from(input.invoiceHash);\n  const signatureBase64 = bytesToBase64(signatureDer);`,
          );
          replaceExactlyOnce(
            tlv,
            `{ tag: ZATCA_TAG.XML_INVOICE_HASH, value: encoder.encode(invoiceHashBase64) },`,
            `{ tag: ZATCA_TAG.XML_INVOICE_HASH, value: invoiceHash },`,
          );

          replaceExactlyOnce(
            tlvTest,
            `  it('encodes tag 6 as the 44-byte UTF-8 Base64 invoice-hash text required by ZATCA', () => {\n    const fields = phase2SimplifiedInvoiceQrFields(input);\n    const hash = fields.find((field) => field.tag === ZATCA_TAG.XML_INVOICE_HASH);\n    const expected = Buffer.from(input.invoiceHash).toString('base64');\n    expect(Buffer.from(hash?.value ?? []).toString('utf8')).toBe(expected);\n    expect(hash?.value.length).toBe(44);\n  });`,
            `  it('encodes tag 6 as the exact 32-byte SHA-256 value with no inner Base64 layer', () => {\n    const fields = phase2SimplifiedInvoiceQrFields(input);\n    const hash = fields.find((field) => field.tag === ZATCA_TAG.XML_INVOICE_HASH);\n    expect(hash?.value).toEqual(input.invoiceHash);\n    expect(hash?.value.length).toBe(32);\n    expect(Buffer.from(hash?.value ?? []).toString('utf8')).not.toBe(\n      Buffer.from(input.invoiceHash).toString('base64'),\n    );\n  });`,
          );

          replaceExactlyOnce(
            envelopeTest,
            `const signedPropertiesDigestHex = '02'.repeat(32);`,
            `const signedPropertiesDigestHex = '02'.repeat(32);\nconst signatureValue = new Uint8Array(64);\nsignatureValue[31] = 1;\nsignatureValue[63] = 2;`,
          );
          replaceExactly(envelopeTest, "signatureValueBase64: 'AQIDBA=='", 'signatureValue', 4);
          replaceExactlyOnce(
            envelopeTest,
            `    expect(() => renderZatcaQrDocumentReference('not base64')).toThrow(/Base64/);`,
            `    expect(() =>\n      renderZatcaUblSignatureExtension({\n        ...fragments,\n        certificatePathDer,\n        signatureValue: Uint8Array.from([0x30, 0x06, 0x02, 0x01, 0x01, 0x02, 0x01, 0x02]),\n      }),\n    ).toThrow(/exactly 64 bytes/);\n    expect(() => renderZatcaQrDocumentReference('not base64')).toThrow(/Base64/);`,
          );

          replaceExactlyOnce(
            sealerTest,
            `  ecdsaDerToXmlDsigSignature,\n  tenantId,`,
            `  ecdsaDerToXmlDsigSignature,\n  tenantId,\n  xmlDsigEcdsaSignatureToDer,`,
          );
          replaceExactlyOnce(
            sealerTest,
            `  write('signature.der', Uint8Array.from(Buffer.from(result.signatureValueBase64, 'base64')));`,
            `  write(\n    'signature.der',\n    xmlDsigEcdsaSignatureToDer(\n      Uint8Array.from(Buffer.from(result.signatureValueBase64, 'base64')),\n    ),\n  );`,
          );
          replaceExactlyOnce(
            sealerTest,
            `    const signatureDer = Uint8Array.from(Buffer.from(result.signatureValueBase64, 'base64'));\n    expect(`,
            `    const signatureValue = Uint8Array.from(\n      Buffer.from(result.signatureValueBase64, 'base64'),\n    );\n    expect(signatureValue).toHaveLength(64);\n    const signatureDer = xmlDsigEcdsaSignatureToDer(signatureValue);\n    expect(`,
          );
          replaceExactlyOnce(
            sealerTest,
            `    expect(signatureDer[0]).toBe(0x30);\n    expect(ecdsaDerToXmlDsigSignature(signatureDer)).toHaveLength(64);`,
            `    expect(signatureDer[0]).toBe(0x30);\n    expect(ecdsaDerToXmlDsigSignature(signatureDer)).toEqual(signatureValue);`,
          );
          replaceExactlyOnce(
            sealerTest,
            `    expect(new TextDecoder().decode(tlv.get(6))).toBe(result.invoiceHashBase64);\n    expect(new TextDecoder().decode(tlv.get(7))).toBe(result.signatureValueBase64);`,
            `    expect(tlv.get(6)).toEqual(result.invoiceHash);\n    expect(new TextDecoder().decode(tlv.get(7))).toBe(bytesToBase64(signatureDer));\n    expect(new TextDecoder().decode(tlv.get(7))).not.toBe(result.signatureValueBase64);`,
          );

          NODE

          npx prettier --write \
            packages/domain/src/zatca/xades-envelope.ts \
            packages/domain/src/zatca/__tests__/xades-envelope.test.ts \
            packages/domain/src/zatca/tlv.ts \
            packages/domain/src/zatca/__tests__/tlv.test.ts \
            apps/api/src/zatca/seal-simplified-invoice.ts \
            apps/api/src/__tests__/zatca-seal-simplified-invoice.test.ts

      - name: Build domain for targeted proof
        run: npm run build -w @korvi/domain

      - name: Targeted XMLDSIG and QR regression proof
        run: |
          npx vitest run \
            packages/domain/src/zatca/__tests__/ecdsa.test.ts \
            packages/domain/src/zatca/__tests__/xades-envelope.test.ts \
            packages/domain/src/zatca/__tests__/tlv.test.ts \
            apps/api/src/__tests__/zatca-seal-simplified-invoice.test.ts

      - name: Full verify before commit
        run: npm run verify

      - name: Commit verified correction and remove helper
        run: |
          git rm .github/workflows/zatca-39-xml-qr-encoding-remediation.yml
          git add \
            packages/domain/src/zatca/xades-envelope.ts \
            packages/domain/src/zatca/__tests__/xades-envelope.test.ts \
            packages/domain/src/zatca/tlv.ts \
            packages/domain/src/zatca/__tests__/tlv.test.ts \
            apps/api/src/zatca/seal-simplified-invoice.ts \
            apps/api/src/__tests__/zatca-seal-simplified-invoice.test.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(zatca): encode XMLDSIG and QR hash bytes correctly'
          git push origin HEAD:review/zatca-39-csid-lifecycle
