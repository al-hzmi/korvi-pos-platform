name: Review MySQL2 Patch Builder V5

on:
  push:
    branches:
      - review/mysql2-3.24.4-builder

permissions:
  contents: write

jobs:
  prepare-clean-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Reset to exact reviewed parent
        run: |
          git reset --hard 3e37b2cc51b1231e7148bd2d0e3bc39858a67cba
          test "$(git rev-parse HEAD)" = "3e37b2cc51b1231e7148bd2d0e3bc39858a67cba"
      - name: Resolve exact MySQL2 metadata without refreshing unrelated lock nodes
        run: |
          cp package-lock.json /tmp/korvi-lock-original.json
          node <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (p.overrides?.mysql2 !== '3.24.3') throw new Error('unexpected mysql2 override');
          p.overrides.mysql2 = '3.24.4';
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          rm -rf node_modules package-lock.json
          npm install --package-lock-only --ignore-scripts --registry=https://registry.npmjs.org
          cp package-lock.json /tmp/korvi-lock-fresh.json
          cp /tmp/korvi-lock-original.json package-lock.json
          node <<'NODE'
          const fs = require('node:fs');
          const oldLock = JSON.parse(fs.readFileSync('/tmp/korvi-lock-original.json', 'utf8'));
          const fresh = JSON.parse(fs.readFileSync('/tmp/korvi-lock-fresh.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const path = 'node_modules/mysql2';
          if (oldLock.packages?.[path]?.version !== '3.24.3') throw new Error('unexpected old mysql2 lock entry');
          if (fresh.packages?.[path]?.version !== '3.24.4') throw new Error('fresh resolution did not produce mysql2 3.24.4');
          lock.packages[path] = fresh.packages[path];
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');

          const before = oldLock.packages ?? {};
          const after = lock.packages ?? {};
          const paths = new Set([...Object.keys(before), ...Object.keys(after)]);
          const versionChanges = [...paths].sort().flatMap((p) => {
            const a = before[p]?.version ?? null;
            const b = after[p]?.version ?? null;
            return a === b ? [] : [{ path: p, before: a, after: b }];
          });
          if (versionChanges.length !== 1 || versionChanges[0].path !== path || versionChanges[0].after !== '3.24.4') {
            throw new Error(`unexpected lock version changes: ${JSON.stringify(versionChanges)}`);
          }
          console.log('[ok] preserved complete lock graph; changed only mysql2 3.24.3 -> 3.24.4');
          NODE
      - name: Record superseding patch decision
        run: |
          cat > docs/decisions/ADR-0028-mysql2-3.24.4-patch-refresh.md <<'EOF'
          # ADR-0028 — MySQL2 3.24.4 Patch Refresh

          - **Status:** Accepted
          - **Date:** 2026-09-08
          - **Scope:** transitive validation dependency only; no MySQL application path, schema or financial change

          ## Context

          ADR-0026 remediated Prisma 7.10.0's transitive `mysql2@3.15.3` by using the
          root override `mysql2: 3.24.3`. Korvi itself uses PostgreSQL; MySQL2 remains
          present only inside Prisma's dependency tree.

          On 2026-09-08 the fail-closed production-stable version gate discovered that
          `mysql2@3.24.4` had become the newest published stable patch. Retaining
          3.24.3 without a new justification would violate the existing supply-chain
          policy. There is no product or compatibility reason to hold the older patch.

          ## Decision

          Advance the existing root override from `mysql2@3.24.3` to exactly
          `mysql2@3.24.4`. Preserve the rest of the lock graph byte-for-semantic-byte:
          obtain the 3.24.4 package metadata from a clean npm resolution, then replace
          only the existing MySQL2 package lock node. A clean `npm ci` is the authority
          that this bounded lock update is internally valid.

          Keep `prisma`, `@prisma/client` and `@prisma/adapter-pg` aligned at 7.10.0.
          Do not add MySQL application code, weaken audit/version gates, or add an
          `ALLOWED_BEHIND` exception merely to retain an older MySQL2 patch.

          This supersedes only ADR-0026's selected MySQL2 patch value. All other
          decisions and the reason for the transitive override remain in force.

          ## Verification

          The exact delivered commit must prove:

          - the root override and every installed/locked MySQL2 copy are 3.24.4;
          - no unrelated locked package version changes as part of this remediation;
          - clean `npm ci`, `versions:verify` and the unchanged dependency audit pass;
          - Prisma generation, build, typecheck, tests and invariant scans remain green;
          - the active-branch commit passes normal CI and PostgreSQL 17 restricted-role
            live proof before deployment.

          The `npm ls mysql2 --all` caveat recorded in ADR-0026 remains applicable while
          Prisma retains its older exact dependency declaration. It must not be falsely
          recorded as a passing diagnostic.
          EOF
      - name: Clean install and full verification
        run: |
          node scripts/verify-package-manager.mjs
          npm ci --registry=https://registry.npmjs.org
          node -e "const p=require('./node_modules/mysql2/package.json'); if(p.version!=='3.24.4') throw new Error('installed mysql2 is '+p.version); console.log('[ok] installed mysql2@3.24.4')"
          npm run versions:verify
          npm run audit
          npx --no-install prettier --write package.json package-lock.json README.md docs/governance/PRODUCT-READINESS-SCORECARD.md docs/decisions/ADR-0028-mysql2-3.24.4-patch-refresh.md
          git diff --check
          npm run verify
      - name: Publish clean child
        run: |
          git config user.name 'Korvi CI Review'
          git config user.email 'korvi-ci-review@users.noreply.github.com'
          git add package.json package-lock.json README.md docs/governance/PRODUCT-READINESS-SCORECARD.md docs/decisions/ADR-0028-mysql2-3.24.4-patch-refresh.md
          git commit -m 'chore(deps): advance mysql2 remediation to 3.24.4'
          test "$(git rev-parse HEAD^)" = "3e37b2cc51b1231e7148bd2d0e3bc39858a67cba"
          git push origin HEAD:refs/heads/review/product-readiness-scorecard-74
