name: Temporary Gate39 Sealer Formatter

on:
  push:
    branches:
      - review/zatca-39-csid-lifecycle
    paths:
      - .github/workflows/tmp-gate39-sealer-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: review/zatca-39-csid-lifecycle
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci --registry=https://registry.npmjs.org
      - name: Format Gate39 sealing files only
        run: |
          npx prettier@3.9.6 --write \
            packages/domain/src/index.ts \
            packages/domain/src/zatca/csid-lifecycle.ts \
            packages/domain/src/zatca/ecdsa.ts \
            packages/domain/src/zatca/x509.ts \
            packages/domain/src/zatca/xades-envelope.ts \
            packages/domain/src/zatca/__tests__/csid-lifecycle.test.ts \
            packages/domain/src/zatca/__tests__/ecdsa.test.ts \
            packages/domain/src/zatca/__tests__/x509.test.ts \
            packages/domain/src/zatca/__tests__/xades-envelope.test.ts \
            apps/api/src/zatca/certificate-path-validator.ts \
            apps/api/src/zatca/seal-simplified-invoice.ts \
            apps/api/src/__tests__/zatca-certificate-path.test.ts \
            apps/api/src/__tests__/zatca-seal-simplified-invoice.test.ts
          git diff --check
      - name: Commit formatter output
        run: |
          git add \
            packages/domain/src/index.ts \
            packages/domain/src/zatca/csid-lifecycle.ts \
            packages/domain/src/zatca/ecdsa.ts \
            packages/domain/src/zatca/x509.ts \
            packages/domain/src/zatca/xades-envelope.ts \
            packages/domain/src/zatca/__tests__/csid-lifecycle.test.ts \
            packages/domain/src/zatca/__tests__/ecdsa.test.ts \
            packages/domain/src/zatca/__tests__/x509.test.ts \
            packages/domain/src/zatca/__tests__/xades-envelope.test.ts \
            apps/api/src/zatca/certificate-path-validator.ts \
            apps/api/src/zatca/seal-simplified-invoice.ts \
            apps/api/src/__tests__/zatca-certificate-path.test.ts \
            apps/api/src/__tests__/zatca-seal-simplified-invoice.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'korvi-ci'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'style(zatca): format Gate39 sealing authority'
          git push origin HEAD:review/zatca-39-csid-lifecycle
