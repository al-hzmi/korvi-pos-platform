name: Temporary split payment formatter

on:
  push:
    branches:
      - product/post-v1-restaurant-split-payment

permissions:
  contents: write

jobs:
  format:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(format): split-payment') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - name: Format split payment files
        run: |
          npx --no-install prettier --write \
            apps/pos-web/src/components/cashier-screen.tsx \
            apps/pos-web/src/components/checkout-panel.tsx \
            apps/pos-web/src/lib/__tests__/checkout-sync-executor.test.ts \
            apps/pos-web/src/lib/__tests__/checkout.test.ts \
            apps/pos-web/src/lib/__tests__/offline-checkout.test.ts \
            apps/pos-web/src/lib/__tests__/offline-store.test.ts \
            apps/pos-web/src/lib/checkout-sync-executor.ts \
            apps/pos-web/src/lib/payment-tenders.ts
          git diff --check
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "korvi-ci"
          git config user.email "actions@users.noreply.github.com"
          git add apps/pos-web/src/components/cashier-screen.tsx apps/pos-web/src/components/checkout-panel.tsx apps/pos-web/src/lib/__tests__/checkout-sync-executor.test.ts apps/pos-web/src/lib/__tests__/checkout.test.ts apps/pos-web/src/lib/__tests__/offline-checkout.test.ts apps/pos-web/src/lib/__tests__/offline-store.test.ts apps/pos-web/src/lib/checkout-sync-executor.ts apps/pos-web/src/lib/payment-tenders.ts
          git commit -m "chore(format): split-payment files"
          git push origin HEAD:product/post-v1-restaurant-split-payment
