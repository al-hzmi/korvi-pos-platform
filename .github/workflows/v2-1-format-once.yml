name: V2-1 Format Once

on:
  push:
    branches:
      - mastermind/v2-strengthening

permissions:
  contents: write

jobs:
  format-once:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: mastermind/v2-strengthening
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact lockfile
        run: npm ci --registry=https://registry.npmjs.org

      - name: Apply repository formatter
        run: |
          npx --no-install prettier --write             apps/api/src/no-receipt-exchange/fingerprint.ts             apps/api/src/no-receipt-exchange/service.ts             apps/api/src/routes/business.ts             apps/pos-web/src/lib/api.ts             apps/pos-web/src/lib/api-types.ts             packages/database/src/repositories/no-receipt-exchange-repository.ts             packages/database/src/repositories/sale-repository.ts             packages/domain/src/returns/__tests__/no-receipt-exchange.test.ts             packages/domain/src/returns/no-receipt-exchange.ts             packages/domain/src/tender/tender.ts             scripts/verify-versions.mjs

      - name: Remove one-shot workflow and commit formatting
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v2-1-format-once.yml
          git config user.name "korvi-v2-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style(v2-1): apply repository formatter"
          git push origin HEAD:mastermind/v2-strengthening
