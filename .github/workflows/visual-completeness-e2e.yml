name: Visual Completeness E2E

on:
  push:
    branches:
      - strike/product-routing-p0
    paths:
      - apps/api/**
      - apps/pos-web/**
      - packages/ui/**
      - .github/workflows/visual-completeness-e2e.yml
  workflow_dispatch:

concurrency:
  group: visual-completeness-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-proof:
    name: Reports and ZATCA browser proof
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify package manager
        run: node scripts/verify-package-manager.mjs

      - name: Install
        run: npm ci --registry=https://registry.npmjs.org

      - name: Generate Prisma client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://korvi:korvi@localhost:5432/korvi_pos?schema=public

      - name: Build browser dependencies
        run: |
          npm run build -w @korvi/domain
          npm run build -w @korvi/database
          npm run build -w @korvi/ui
          npm run build -w @korvi/api

      - name: Write controlled merchant fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .e2e artifacts/visual-completeness
          cat > .e2e/visual-completeness-server.mjs <<'EOF'
          import { buildServer } from '../apps/api/dist/server.js';
          import { loadConfig } from '../apps/api/dist/config.js';

          const TENANT_ID = '018fb000-0000-7000-8000-00000000000a';
          const BRANCH_ID = '018fb000-0000-7000-8000-0000000000a1';
          const TERMINAL_ID = '018fb000-0000-7000-8000-0000000000a2';
          const USER_ID = '018fb000-0000-7000-8000-0000000000a4';
          const now = '2026-09-15T00:30:00.000Z';

          const principal = {
            tenantId: TENANT_ID,
            tenantSlug: 'riyadah-retail',
            userId: USER_ID,
            sessionId: '018fb000-0000-7000-8000-0000000000a8',
            email: 'owner@riyadah.test',
            displayName: 'محمد المدير',
            roles: ['owner'],
            permissions: ['report.read', 'zatca.manage'],
            maxDiscountBasisPoints: 10000n,
            branchId: BRANCH_ID,
          };

          const auth = {
            async login() {
              return { outcome: 'failure', reason: 'bad-password' };
            },
            async authenticate(token) {
              return token === 'merchant-visual-e2e'
                ? { outcome: 'success', principal }
                : { outcome: 'failure', reason: 'unknown-session' };
            },
            async logout() {
              return true;
            },
            async logoutAll() {
              return 1;
            },
          };

          const totals = (documentCount, netMinor, vatMinor, totalMinor) => ({
            documentCount,
            netMinor,
            vatMinor,
            totalMinor,
          });

          const salesRead = {
            async list() {
              return { items: [], nextCursor: null };
            },
            async detail() {
              return null;
            },
            async report(_actor, query) {
              return {
                fromInclusive: query.from,
                toExclusive: query.to,
                branchId: query.branchId ?? null,
                currency: 'SAR',
                sales: totals('128', '9865000', '1479750', '11344750'),
                returns: totals('7', '215000', '32250', '247250'),
                netAfterReturns: {
                  netMinor: '9650000',
                  vatMinor: '1447500',
                  totalMinor: '11097500',
                },
                vatBreakdown: [
                  {
                    vatBasisPoints: 1500,
                    salesNetMinor: '9865000',
                    salesVatMinor: '1479750',
                    returnsNetMinor: '215000',
                    returnsVatMinor: '32250',
                    netTaxableMinor: '9650000',
                    netVatMinor: '1447500',
                  },
                ],
                availableBranches: [
                  { id: BRANCH_ID, code: 'JED', nameAr: 'فرع جدة', nameEn: 'Jeddah', isActive: true },
                  {
                    id: '018fb000-0000-7000-8000-0000000000b1',
                    code: 'RUH',
                    nameAr: 'فرع الرياض',
                    nameEn: 'Riyadh',
                    isActive: true,
                  },
                ],
                branchBreakdown: [
                  {
                    id: BRANCH_ID,
                    code: 'JED',
                    nameAr: 'فرع جدة',
                    nameEn: 'Jeddah',
                    isActive: true,
                    sales: totals('82', '6450000', '967500', '7417500'),
                    returns: totals('4', '125000', '18750', '143750'),
                    netAfterReturns: {
                      netMinor: '6325000',
                      vatMinor: '948750',
                      totalMinor: '7273750',
                    },
                  },
                  {
                    id: '018fb000-0000-7000-8000-0000000000b1',
                    code: 'RUH',
                    nameAr: 'فرع الرياض',
                    nameEn: 'Riyadh',
                    isActive: true,
                    sales: totals('46', '3415000', '512250', '3927250'),
                    returns: totals('3', '90000', '13500', '103500'),
                    netAfterReturns: {
                      netMinor: '3325000',
                      vatMinor: '498750',
                      totalMinor: '3823750',
                    },
                  },
                ],
              };
            },
          };

          const zatca = {
            async status() {
              return {
                summary: {
                  terminalCount: '7',
                  complianceReadyTerminalCount: '6',
                  acceptedSubmissionCount: '1240',
                  rejectedSubmissionCount: '2',
                  unresolvedSubmissionCount: '1',
                },
                terminals: [
                  {
                    terminalId: TERMINAL_ID,
                    branchId: BRANCH_ID,
                    code: 'POS-01',
                    label: 'الصندوق 1',
                    isActive: true,
                    lastSeenAt: now,
                    latestProvisioning: {
                      attemptId: '018fb000-0000-7000-8000-000000000201',
                      environment: 'production',
                      state: 'issued',
                      preparedAt: '2026-09-05T09:00:00.000Z',
                      requestStartedAt: '2026-09-05T09:01:00.000Z',
                      resolvedAt: '2026-09-05T09:02:00.000Z',
                      remoteRequestId: 'ZATCA-REQ-2001',
                      credentialId: 'credential-redacted',
                      rejectionCode: null,
                      uncertaintyReason: null,
                    },
                    complianceAcceptedAt: '2026-09-05T09:10:00.000Z',
                  },
                  {
                    terminalId: '018fb000-0000-7000-8000-0000000000b2',
                    branchId: BRANCH_ID,
                    code: 'POS-02',
                    label: 'الصندوق 2',
                    isActive: true,
                    lastSeenAt: '2026-09-15T00:25:00.000Z',
                    latestProvisioning: {
                      attemptId: '018fb000-0000-7000-8000-000000000202',
                      environment: 'production',
                      state: 'issued',
                      preparedAt: '2026-09-06T09:00:00.000Z',
                      requestStartedAt: '2026-09-06T09:01:00.000Z',
                      resolvedAt: '2026-09-06T09:02:00.000Z',
                      remoteRequestId: 'ZATCA-REQ-2002',
                      credentialId: 'credential-redacted',
                      rejectionCode: null,
                      uncertaintyReason: null,
                    },
                    complianceAcceptedAt: '2026-09-06T09:10:00.000Z',
                  },
                ],
                terminalHasMore: false,
                recentSubmissions: [
                  {
                    submissionId: '018fb000-0000-7000-8000-000000000301',
                    invoiceId: '018fb000-0000-7000-8000-000000000401',
                    terminalId: TERMINAL_ID,
                    environment: 'production',
                    mode: 'reporting',
                    state: 'accepted',
                    attemptCount: 1,
                    queuedAt: '2026-09-15T00:20:00.000Z',
                    requestStartedAt: '2026-09-15T00:20:01.000Z',
                    resolvedAt: '2026-09-15T00:20:02.000Z',
                    httpStatus: 200,
                    authorityStatus: 'REPORTED',
                    rejectionCode: null,
                    uncertaintyReason: null,
                  },
                  {
                    submissionId: '018fb000-0000-7000-8000-000000000302',
                    invoiceId: '018fb000-0000-7000-8000-000000000402',
                    terminalId: TERMINAL_ID,
                    environment: 'production',
                    mode: 'reporting',
                    state: 'uncertain',
                    attemptCount: 2,
                    queuedAt: '2026-09-15T00:15:00.000Z',
                    requestStartedAt: '2026-09-15T00:15:01.000Z',
                    resolvedAt: null,
                    httpStatus: null,
                    authorityStatus: null,
                    rejectionCode: null,
                    uncertaintyReason: 'transport',
                  },
                ],
              };
            },
          };

          const config = loadConfig({
            NODE_ENV: 'test',
            LOG_LEVEL: 'fatal',
            APP_ORIGINS: 'http://127.0.0.1:3000',
          });

          const app = buildServer(config, { auth, salesRead, zatca });
          await app.listen({ host: '127.0.0.1', port: 3001 });

          const shutdown = async () => {
            await app.close();
            process.exit(0);
          };
          process.on('SIGTERM', shutdown);
          process.on('SIGINT', shutdown);
          EOF

      - name: Start Fastify and Next
        shell: bash
        run: |
          set -euo pipefail
          node .e2e/visual-completeness-server.mjs > artifacts/visual-completeness/api.log 2>&1 &
          echo $! > .e2e/api.pid
          KORVI_API_ORIGIN=http://127.0.0.1:3001 npm run dev -w @korvi/pos-web -- --hostname 127.0.0.1 --port 3000 > artifacts/visual-completeness/web.log 2>&1 &
          echo $! > .e2e/web.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3001/health >/dev/null && curl --fail --silent http://127.0.0.1:3000/control/reports >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat artifacts/visual-completeness/api.log
          cat artifacts/visual-completeness/web.log
          exit 1

      - name: Install browser driver
        run: python -m pip install --disable-pip-version-check selenium==4.35.0

      - name: Prove reports and ZATCA on desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          cat > .e2e/visual-completeness.py <<'PY'
          import shutil
          from selenium import webdriver
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support import expected_conditions as EC
          from selenium.webdriver.support.ui import WebDriverWait

          base = 'http://127.0.0.1:3000'
          options = webdriver.ChromeOptions()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--force-device-scale-factor=1')
          options.add_argument('--window-size=1440,1100')
          chromedriver = shutil.which('chromedriver')
          service = Service(chromedriver) if chromedriver else Service()
          driver = webdriver.Chrome(service=service, options=options)
          wait = WebDriverWait(driver, 25)

          def assert_surface(label):
              body = driver.find_element(By.TAG_NAME, 'body').text
              if 'قريباً' in body or 'غير مكتمل' in body:
                  raise AssertionError(f'{label}: placeholder copy reached a core surface')
              direction = driver.execute_script('return document.documentElement.dir')
              if direction != 'rtl':
                  raise AssertionError(f'{label}: root direction is {direction!r}, expected rtl')
              width_ok = driver.execute_script(
                  'return document.documentElement.scrollWidth <= window.innerWidth + 1'
              )
              if not width_ok:
                  raise AssertionError(f'{label}: page-level horizontal overflow detected')

          try:
              driver.get(base)
              driver.add_cookie({'name': 'korvi_session', 'value': 'merchant-visual-e2e', 'path': '/'})

              driver.get(f'{base}/control/reports')
              wait.until(EC.text_to_be_present_in_element((By.TAG_NAME, 'body'), 'الصافي بعد المرتجعات'))
              wait.until(EC.text_to_be_present_in_element((By.TAG_NAME, 'body'), 'فرع الرياض'))
              assert_surface('reports-desktop')
              driver.save_screenshot('artifacts/visual-completeness/reports-desktop.png')

              driver.set_window_size(390, 844)
              driver.get(f'{base}/control/reports')
              wait.until(EC.text_to_be_present_in_element((By.TAG_NAME, 'body'), 'الصافي بعد المرتجعات'))
              assert_surface('reports-mobile')
              driver.save_screenshot('artifacts/visual-completeness/reports-mobile.png')

              driver.set_window_size(1440, 1100)
              driver.get(f'{base}/control/zatca')
              wait.until(EC.text_to_be_present_in_element((By.TAG_NAME, 'body'), 'أحدث إرسالات الفواتير'))
              wait.until(EC.text_to_be_present_in_element((By.TAG_NAME, 'body'), 'الصندوق 1'))
              assert_surface('zatca-desktop')
              driver.save_screenshot('artifacts/visual-completeness/zatca-desktop.png')

              driver.set_window_size(390, 844)
              driver.get(f'{base}/control/zatca')
              wait.until(EC.text_to_be_present_in_element((By.TAG_NAME, 'body'), 'أحدث إرسالات الفواتير'))
              assert_surface('zatca-mobile')
              driver.save_screenshot('artifacts/visual-completeness/zatca-mobile.png')
          finally:
              driver.quit()
          PY
          python .e2e/visual-completeness.py

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: korvi-visual-completeness-${{ github.sha }}
          path: artifacts/visual-completeness
          if-no-files-found: error
          retention-days: 14
