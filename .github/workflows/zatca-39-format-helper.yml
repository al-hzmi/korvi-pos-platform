name: ZATCA 39 Format Helper

on:
  push:
    branches:
      - review/zatca-39-csid-lifecycle
    paths:
      - .github/workflows/zatca-39-format-helper.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --registry=https://registry.npmjs.org

      - name: Repair ESM fixture and format proof files
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/api/src/__tests__/zatca-azure-key-vault-signing-key.test.ts')
          source = path.read_text()
          source = source.replace(
              "import { mkdtempSync, rmSync, writeFileSync } from 'node:fs';",
              "import { mkdtempSync, readFileSync, rmSync, writeFileSync } from 'node:fs';",
          )
          source = source.replace(
              "Uint8Array.from(require('node:fs').readFileSync(signaturePath))",
              "Uint8Array.from(readFileSync(signaturePath))",
          )
          source = source.replace(
              "    expect(Buffer.from(csrDer).includes(Buffer.from('ZATCA-Code-Signing'))).toBe(true);\n",
              "",
          )
          path.write_text(source)
          PY
          npx prettier --write \
            apps/api/src/zatca/azure-key-vault-signing-key.ts \
            apps/api/src/__tests__/zatca-azure-key-vault-signing-key.test.ts
          git diff --check

      - name: Commit formatter result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/api/src/zatca/azure-key-vault-signing-key.ts \
            apps/api/src/__tests__/zatca-azure-key-vault-signing-key.test.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix(zatca): normalize Azure signing proof files'
          git push origin HEAD:review/zatca-39-csid-lifecycle
