name: ZATCA 39 Format Helper

on:
  push:
    branches:
      - review/zatca-39-csid-lifecycle
    paths:
      - .github/workflows/zatca-39-format-helper.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --registry=https://registry.npmjs.org

      - name: Format proof files
        run: |
          npx prettier --write \
            apps/api/src/zatca/azure-key-vault-signing-key.ts \
            apps/api/src/__tests__/zatca-azure-key-vault-signing-key.test.ts

      - name: Emit formatted provider
        run: |
          echo 'KORVI_PROVIDER_BASE64_BEGIN'
          base64 -w0 apps/api/src/zatca/azure-key-vault-signing-key.ts
          echo
          echo 'KORVI_PROVIDER_BASE64_END'

      - name: Emit formatted test
        run: |
          echo 'KORVI_TEST_BASE64_BEGIN'
          base64 -w0 apps/api/src/__tests__/zatca-azure-key-vault-signing-key.test.ts
          echo
          echo 'KORVI_TEST_BASE64_END'
