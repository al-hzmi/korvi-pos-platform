name: V2-1 UI Compile Once

on:
  push:
    branches:
      - mastermind/v2-strengthening

permissions:
  contents: write

jobs:
  ui-compile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: mastermind/v2-strengthening
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install exact lockfile
        run: npm ci --registry=https://registry.npmjs.org
      - name: Format V2-1 UI/API delta
        run: |
          npx --no-install prettier --write             apps/api/src/no-receipt-exchange/service.ts             apps/api/src/routes/business.ts             apps/pos-web/src/components/no-receipt-exchange-workflow.tsx             apps/pos-web/src/components/cashier-screen.tsx
      - name: Remove one-shot workflow and commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v2-1-ui-compile-once.yml
          git config user.name "korvi-v2-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style(v2-1): format cashier exchange workflow"
          git push origin HEAD:mastermind/v2-strengthening
      - name: Lint formatted tree
        run: npm run lint
      - name: Generate Prisma client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://korvi:korvi@localhost:5432/korvi_pos?schema=public
      - name: Build formatted tree
        run: npm run build
      - name: Typecheck formatted tree
        run: npm run typecheck
      - name: Run focused V2-1 tests
        run: >-
          npx --no-install vitest run
          packages/domain/src/returns/__tests__/no-receipt-exchange.test.ts
          packages/domain/src/tender/__tests__/tender.test.ts
          packages/domain/src/rbac/__tests__/permissions.test.ts
          apps/api/src/__tests__/no-receipt-exchange-service.test.ts
          apps/api/src/__tests__/no-receipt-exchange-routes.test.ts
