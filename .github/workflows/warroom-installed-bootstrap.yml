name: War Room Installed Cashier Bootstrap

on:
  push:
    branches:
      - warroom/installed-cashier
    paths:
      - .github/workflows/warroom-installed-bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KORVI_NATIVE_API_ORIGIN: https://api.staging.invalid/
      KORVI_NATIVE_WEB_ORIGIN: https://staging.invalid/
    steps:
      - name: Check out installed lane
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: warroom/installed-cashier
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install official Tauri Linux check prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Refresh exact npm lockfile
        run: npm install --package-lock-only --registry=https://registry.npmjs.org

      - name: Verify dependency pins
        run: npm run versions:verify

      - name: Install exact npm graph
        run: npm ci --registry=https://registry.npmjs.org

      - name: Generate native icons from the canonical Korvi vector icon
        run: npm exec -w @korvi/cashier-client tauri -- icon ../pos-web/public/brand/korvi-pos-icon.svg

      - name: Generate exact Cargo lockfile
        working-directory: apps/cashier-client/src-tauri
        run: cargo generate-lockfile

      - name: Build shared cashier dependencies
        run: |
          npm run build -w @korvi/domain
          npm run build -w @korvi/ui

      - name: Format and verify frontend
        shell: bash
        run: |
          set -euo pipefail
          npm exec prettier -- --write apps/cashier-client
          npm run typecheck -w @korvi/cashier-client
          npm run build -w @korvi/cashier-client

      - name: Format and compile native transport
        working-directory: apps/cashier-client/src-tauri
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt
          cargo fmt --check
          cargo check --locked

      - name: Commit reproducible native build inputs
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/warroom-installed-bootstrap.yml
          git diff --check
          git config user.name 'korvi-release-integrator'
          git config user.email 'actions@users.noreply.github.com'
          git add package-lock.json apps/cashier-client .github/workflows/warroom-installed-bootstrap.yml
          git diff --cached --check
          git commit -m 'build(installed): lock and compile cashier native host'
          git push origin HEAD:warroom/installed-cashier
