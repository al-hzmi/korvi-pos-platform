name: ZATCA 40 Submission PostgreSQL Proof

on:
  push:
    branches:
      - integration/acquisition-ar5-internal
      - release/canonical-acquisition-v1
      - review/zatca-40-submission-pipeline
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  postgres-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MIGRATION_DATABASE_URL: postgresql://korvi_migrator:korvi_gate40_migrator_ci@localhost:5432/korvi_gate40?schema=public
      DATABASE_URL: postgresql://korvi_runtime:korvi_gate40_runtime_ci@localhost:5432/korvi_gate40
      KORVI_TEST_DATABASE_URL: postgresql://korvi_runtime:korvi_gate40_runtime_ci@localhost:5432/korvi_gate40
      POSTGRES_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/korvi_gate40
      PRODUCTION_RUNTIME_DB_ROLE: korvi_runtime
      PROOF_LOG: artifacts/zatca-40-submission-postgres-proof.txt

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: korvi_gate40
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d korvi_gate40"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432

    steps:
      - name: Check out exact commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Prove no self-mutating helper remains
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/gate40-repair-once.yml
          test ! -e .github/workflows/gate40-service-format-once.yml
          test ! -e .github/workflows/gate40-format-domain-once.yml

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact lockfile
        run: npm ci --registry=https://registry.npmjs.org

      - name: Establish separate restricted migration and runtime roles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          psql "$POSTGRES_ADMIN_URL" --no-psqlrc --set=ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE korvi_migrator LOGIN PASSWORD 'korvi_gate40_migrator_ci'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE korvi_runtime LOGIN PASSWORD 'korvi_gate40_runtime_ci'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          ALTER DATABASE korvi_gate40 OWNER TO korvi_migrator;
          SQL

          migrator_flags="$(psql "$POSTGRES_ADMIN_URL" --no-psqlrc --tuples-only --no-align --command \
            "SELECT rolsuper,rolcreatedb,rolcreaterole,rolinherit,rolreplication,rolbypassrls,
                    (SELECT count(*)::integer FROM pg_auth_members WHERE member=r.oid)
               FROM pg_roles r WHERE rolname='korvi_migrator'")"
          runtime_flags="$(psql "$POSTGRES_ADMIN_URL" --no-psqlrc --tuples-only --no-align --command \
            "SELECT rolsuper,rolcreatedb,rolcreaterole,rolinherit,rolreplication,rolbypassrls,
                    (SELECT count(*)::integer FROM pg_auth_members WHERE member=r.oid)
               FROM pg_roles r WHERE rolname='korvi_runtime'")"
          test "$migrator_flags" = 'f|f|f|f|f|f|0'
          test "$runtime_flags" = 'f|f|f|f|f|f|0'
          printf 'commit=%s\nmigration_role_flags=%s\nruntime_role_flags=%s\n' \
            "$GITHUB_SHA" "$migrator_flags" "$runtime_flags" | tee "$PROOF_LOG"

      - name: Apply migrations through restricted production authority
        shell: bash
        env:
          NODE_ENV: production
          KORVI_ENVIRONMENT: production
        run: |
          set -euo pipefail
          bash scripts/deploy/production-migrate.sh 2>&1 | tee -a "$PROOF_LOG"

      - name: Prove runtime authority and queue security invariants
        shell: bash
        run: |
          set -euo pipefail
          table_ownership="$(psql "$POSTGRES_ADMIN_URL" --no-psqlrc --tuples-only --no-align --command \
            "SELECT count(DISTINCT tableowner)::text || '|' || min(tableowner)
               FROM pg_tables WHERE schemaname='public'")"
          test "$table_ownership" = '1|korvi_migrator'

          runtime_ownership="$(psql "$POSTGRES_ADMIN_URL" --no-psqlrc --tuples-only --no-align --command \
            "SELECT count(*) FROM pg_tables WHERE schemaname='public' AND tableowner='korvi_runtime'")"
          test "$runtime_ownership" = '0'

          boundary="$(psql "$POSTGRES_ADMIN_URL" --no-psqlrc --tuples-only --no-align --command \
            "SELECT has_database_privilege('korvi_runtime','korvi_gate40','CONNECT'),
                    has_database_privilege('korvi_runtime','korvi_gate40','TEMPORARY'),
                    has_schema_privilege('korvi_runtime','public','USAGE'),
                    has_schema_privilege('korvi_runtime','public','CREATE'),
                    has_table_privilege('korvi_runtime','public._prisma_migrations','SELECT'),
                    has_table_privilege('korvi_runtime','public._prisma_migrations','INSERT'),
                    has_table_privilege('korvi_runtime','public._prisma_migrations','UPDATE'),
                    has_table_privilege('korvi_runtime','public._prisma_migrations','DELETE')")"
          test "$boundary" = 't|f|t|f|t|f|f|f'

          rls="$(psql "$DATABASE_URL" --no-psqlrc --tuples-only --no-align --command \
            "SELECT relrowsecurity::text || '|' || relforcerowsecurity::text FROM pg_class WHERE oid='zatca_invoice_submissions'::regclass")"
          test "$rls" = 'true|true'
          policies="$(psql "$DATABASE_URL" --no-psqlrc --tuples-only --no-align --command \
            "SELECT count(*) FROM pg_policies WHERE schemaname='public' AND tablename='zatca_invoice_submissions' AND policyname='zatca_invoice_submissions_isolation'")"
          test "$policies" = '1'
          trigger_count="$(psql "$DATABASE_URL" --no-psqlrc --tuples-only --no-align --command \
            "SELECT count(*) FROM pg_trigger WHERE tgrelid='zatca_invoice_submissions'::regclass AND tgname='zatca_invoice_submission_guard' AND NOT tgisinternal")"
          test "$trigger_count" = '1'
          plaintext="$(psql "$DATABASE_URL" --no-psqlrc --tuples-only --no-align --command \
            "SELECT count(*) FROM information_schema.columns WHERE table_schema='public' AND table_name='zatca_invoice_submissions' AND lower(column_name) IN ('secret','password','binarysecuritytoken','privatekey','otp')")"
          test "$plaintext" = '0'

          {
            echo "public_table_ownership=$table_ownership"
            echo "runtime_public_table_ownership=$runtime_ownership"
            echo "runtime_boundary=$boundary"
            echo "queue_rls=$rls"
            echo "queue_policy_count=$policies"
            echo "queue_transition_guard=$trigger_count"
            echo "plaintext_secret_columns=$plaintext"
            echo 'migration_runtime_identity_separation=PASS'
          } | tee -a "$PROOF_LOG"

      - name: Generate and build
        run: |
          npm run db:generate
          npm run build

      - name: Run durable submission PostgreSQL concurrency proof as restricted runtime
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install vitest run packages/database/src/__tests__/zatca-invoice-submission-live.test.ts 2>&1 | tee -a "$PROOF_LOG"

      - name: Run transition-before-send and ambiguity proof
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install vitest run apps/api/src/__tests__/zatca-invoice-submission-service.test.ts 2>&1 | tee -a "$PROOF_LOG"

      - name: Run one-shot transport contract proof
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install vitest run apps/api/src/__tests__/zatca-invoice-submission-http-client.test.ts 2>&1 | tee -a "$PROOF_LOG"

      - name: Re-prove runtime boundary after submission proof
        shell: bash
        run: |
          set -euo pipefail
          boundary="$(psql "$POSTGRES_ADMIN_URL" --no-psqlrc --tuples-only --no-align --command \
            "SELECT has_database_privilege('korvi_runtime','korvi_gate40','CONNECT'),
                    has_database_privilege('korvi_runtime','korvi_gate40','TEMPORARY'),
                    has_schema_privilege('korvi_runtime','public','USAGE'),
                    has_schema_privilege('korvi_runtime','public','CREATE'),
                    has_table_privilege('korvi_runtime','public._prisma_migrations','SELECT'),
                    has_table_privilege('korvi_runtime','public._prisma_migrations','INSERT'),
                    has_table_privilege('korvi_runtime','public._prisma_migrations','UPDATE'),
                    has_table_privilege('korvi_runtime','public._prisma_migrations','DELETE')")"
          test "$boundary" = 't|f|t|f|t|f|f|f'
          echo 'runtime_boundary_after_submission_proof=PASS' | tee -a "$PROOF_LOG"

      - name: Run full verification with live hooks disabled
        shell: bash
        env:
          KORVI_TEST_DATABASE_URL: ''
        run: |
          set -euo pipefail
          npm run verify 2>&1 | tee -a "$PROOF_LOG"
          git diff --check

      - name: Preserve proof log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zatca-40-submission-postgres-proof-${{ github.sha }}
          path: artifacts/zatca-40-submission-postgres-proof.txt
          if-no-files-found: error
          retention-days: 30
