name: War Room Windows CNG Export Policy

on:
  push:
    branches:
      - strike/product-routing-p0
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: warroom-windows-cng-export-policy
  cancel-in-progress: true

jobs:
  harden-and-prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      KORVI_NATIVE_API_ORIGIN: https://api.example.invalid/
    steps:
      - name: Check out exact branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: strike/product-routing-p0
          fetch-depth: 0

      - name: Patch explicit non-exportable CNG policy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('apps/cashier-client/src-tauri/src/device_identity.rs')
          text = path.read_text()

          anchor = '    const ECC_PUBLIC_BLOB: &str = "ECCPUBLICBLOB";'
          if anchor not in text:
              raise SystemExit('CNG constant anchor changed')
          text = text.replace(anchor, anchor + '''
              const ECC_PRIVATE_BLOB: &str = "ECCPRIVATEBLOB";
              const EXPORT_POLICY_PROPERTY: &str = "Export Policy";
              const NCRYPT_PERSIST_FLAG: u32 = 0x8000_0000;''', 1)

          anchor = '        fn NCryptFinalizeKey(key: Handle, flags: u32) -> Status;'
          if anchor not in text:
              raise SystemExit('CNG extern anchor changed')
          text = text.replace(anchor, '''        fn NCryptGetProperty(
                  object: Handle,
                  property: *const u16,
                  output: *mut u8,
                  output_len: u32,
                  result: *mut u32,
                  flags: u32,
              ) -> Status;
              fn NCryptSetProperty(
                  object: Handle,
                  property: *const u16,
                  input: *const u8,
                  input_len: u32,
                  flags: u32,
              ) -> Status;
              fn NCryptDeleteKey(key: Handle, flags: u32) -> Status;
              fn NCryptFinalizeKey(key: Handle, flags: u32) -> Status;''', 1)

          anchor = '    fn open_or_create() -> Result<CngKey, String> {'
          if anchor not in text:
              raise SystemExit('open_or_create anchor changed')
          helpers = '''    fn export_policy(key: Handle) -> Result<u32, String> {
              let mut policy = 0u32;
              let mut received = 0u32;
              let status = unsafe {
                  NCryptGetProperty(
                      key,
                      wide(EXPORT_POLICY_PROPERTY).as_ptr(),
                      (&mut policy as *mut u32).cast::<u8>(),
                      std::mem::size_of::<u32>() as u32,
                      &mut received,
                      0,
                  )
              };
              if status != SUCCESS || received != std::mem::size_of::<u32>() as u32 {
                  return Err("Windows CNG export policy could not be verified".into());
              }
              Ok(policy)
          }

          fn set_non_exportable(key: Handle) -> Result<(), String> {
              let policy = 0u32;
              let status = unsafe {
                  NCryptSetProperty(
                      key,
                      wide(EXPORT_POLICY_PROPERTY).as_ptr(),
                      (&policy as *const u32).cast::<u8>(),
                      std::mem::size_of::<u32>() as u32,
                      NCRYPT_PERSIST_FLAG,
                  )
              };
              if status != SUCCESS {
                  return Err("Windows CNG refused the non-exportable key policy".into());
              }
              Ok(())
          }

          fn verified_existing_key(
              provider: Handle,
              key: Handle,
              hardware: bool,
          ) -> Result<CngKey, String> {
              match export_policy(key) {
                  Ok(0) if private_export_is_refused(key) => Ok(CngKey { provider, key, hardware }),
                  Ok(policy) => {
                      unsafe {
                          let _ = NCryptFreeObject(key);
                          let _ = NCryptFreeObject(provider);
                      }
                      Err(format!(
                          "Windows CNG device key failed non-exportability verification (policy {policy:#x}); explicit re-enrollment is required"
                      ))
                  }
                  Err(error) => {
                      unsafe {
                          let _ = NCryptFreeObject(key);
                          let _ = NCryptFreeObject(provider);
                      }
                      Err(error)
                  }
              }
          }

          fn private_export_is_refused(key: Handle) -> bool {
              let mut needed = 0u32;
              let status = unsafe {
                  NCryptExportKey(
                      key,
                      0,
                      wide(ECC_PRIVATE_BLOB).as_ptr(),
                      ptr::null_mut(),
                      ptr::null_mut(),
                      0,
                      &mut needed,
                      0,
                  )
              };
              status != SUCCESS
          }

          '''
          text = text.replace(anchor, helpers + anchor, 1)

          pattern = re.compile(
              r'if let Ok\(key\) = open_existing\(provider\) \{\s*return Ok\(CngKey \{\s*provider,\s*key,\s*hardware,\s*\}\);\s*\}',
              re.S,
          )
          text, count = pattern.subn(
              'if let Ok(key) = open_existing(provider) {\n                    return verified_existing_key(provider, key, hardware);\n                }',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('existing-key block changed')

          pattern = re.compile(
              r'if created == SUCCESS && unsafe \{ NCryptFinalizeKey\(key, 0\) \} == SUCCESS \{\s*return Ok\(CngKey \{\s*provider,\s*key,\s*hardware,\s*\}\);\s*\}\s*if key != 0 \{\s*unsafe \{\s*let _ = NCryptFreeObject\(key\);\s*\}\s*\}',
              re.S,
          )
          replacement = '''if created == SUCCESS {
                      let policy_set = set_non_exportable(key).is_ok();
                      let finalized = policy_set && unsafe { NCryptFinalizeKey(key, 0) } == SUCCESS;
                      if finalized && export_policy(key) == Ok(0) && private_export_is_refused(key) {
                          return Ok(CngKey {
                              provider,
                              key,
                              hardware,
                          });
                      }
                  }
                  if key != 0 {
                      unsafe {
                          let _ = NCryptDeleteKey(key, 0);
                      }
                  }'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('new-key block changed')

          anchor = '    pub fn identity<R: Runtime>(_app: &AppHandle<R>) -> Result<DeviceIdentityInfo, String> {'
          if anchor not in text:
              raise SystemExit('identity anchor changed')
          tests = '''    #[cfg(test)]
          mod tests {
              use super::*;

              #[test]
              fn windows_device_identity_key_is_non_exportable() {
                  let key = open_or_create().expect("CNG device key");
                  assert_eq!(export_policy(key.key).expect("export policy"), 0);
                  assert!(private_export_is_refused(key.key));
              }
          }

          '''
          text = text.replace(anchor, tests + anchor, 1)
          path.write_text(text)
          PY

      - name: Canonical Rust formatting
        shell: bash
        run: |
          cargo fmt --manifest-path apps/cashier-client/src-tauri/Cargo.toml
          cargo fmt --manifest-path apps/cashier-client/src-tauri/Cargo.toml -- --check

      - name: Windows CNG runtime proof
        shell: bash
        run: cargo test --manifest-path apps/cashier-client/src-tauri/Cargo.toml --locked --lib windows_device_identity_key_is_non_exportable -- --nocapture

      - name: Compile installed Cashier trust boundary
        shell: bash
        run: cargo check --manifest-path apps/cashier-client/src-tauri/Cargo.toml --locked

      - name: Commit proven source and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/warroom-windows-cng-export-policy.yml
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/cashier-client/src-tauri/src/device_identity.rs
          git commit -m 'fix(installed): enforce non-exportable Windows device key'
          git push origin HEAD:strike/product-routing-p0
