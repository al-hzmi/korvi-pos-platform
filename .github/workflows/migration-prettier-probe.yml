name: Migration Prettier Probe

on:
  push:
    branches:
      - product/post-v1-migration-engine
    paths:
      - .github/workflows/migration-prettier-probe.yml

permissions:
  contents: read

jobs:
  prettier-probe:
    name: Exact Prettier 3.9.7 diff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --registry=https://registry.npmjs.org

      - name: Print exact formatter diff
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install prettier --write             apps/pos-web/src/lib/__tests__/migration.test.ts             packages/domain/src/migration/suppliers.ts
          echo '--- KORVI_PRETTIER_DIFF_BEGIN ---'
          git diff --no-ext-diff --unified=8 --             apps/pos-web/src/lib/__tests__/migration.test.ts             packages/domain/src/migration/suppliers.ts
          echo '--- KORVI_PRETTIER_DIFF_END ---'
