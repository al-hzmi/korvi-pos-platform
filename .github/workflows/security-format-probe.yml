name: Security Format Probe
on:
  push:
    branches:
      - security/format-probe-20260919
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - name: Format exact files and print diff
        run: |
          npx --no-install prettier --write apps/api/src/platform/auth.ts apps/api/src/__tests__/zatca-azure-key-vault-signing-key.test.ts
          git diff -- apps/api/src/platform/auth.ts apps/api/src/__tests__/zatca-azure-key-vault-signing-key.test.ts
