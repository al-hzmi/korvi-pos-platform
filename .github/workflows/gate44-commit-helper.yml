name: Gate 44 Commit Helper

on:
  push:
    branches:
      - review/offline-44-sync-engine

permissions:
  contents: write

jobs:
  commit-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out Gate 44 branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: review/offline-44-sync-engine

      - name: Replay the already-successful queue patch step
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'RUNNER'
          from pathlib import Path

          workflow = Path('.github/workflows/gate44-offline-store-helper.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          body = workflow[start:end]
          code = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in body.splitlines()
          )
          exec(compile(code, '<gate44-queue-patch>', 'exec'))
          RUNNER

      - name: Format source
        run: npx prettier --write apps/pos-web/src/lib/offline-store.ts

      - name: Commit source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/pos-web/src/lib/offline-store.ts
          git diff --cached --check
          git commit -m 'feat(offline): add atomic queue claim lifecycle'
          git push origin HEAD:review/offline-44-sync-engine
