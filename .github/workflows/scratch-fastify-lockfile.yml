name: Scratch Gate 39 Final Proof

on:
  push:
    branches:
      - scratch/zatca39-fastify-lockfile-20260911
    paths:
      - '.github/workflows/scratch-fastify-lockfile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    name: Prove permanent Gate 39 candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DATABASE_URL: postgresql://korvi_app:korvi_gate39_ci@localhost:5432/korvi_gate39
      KORVI_TEST_DATABASE_URL: postgresql://korvi_app:korvi_gate39_ci@localhost:5432/korvi_gate39
      KORVI_TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/korvi_gate39
      POSTGRES_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/korvi_gate39

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: korvi_gate39
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d korvi_gate39"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432

    steps:
      - name: Check out exact scratch commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify package manager
        run: node scripts/verify-package-manager.mjs

      - name: Apply exact Next patch upgrade
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('apps/pos-web/package.json')
          text = p.read_text()
          old = '"next": "16.3.4"'
          new = '"next": "16.3.5"'
          if text.count(old) != 1 or new in text:
              raise SystemExit('unexpected Next manifest state')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Generate exact dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --registry=https://registry.npmjs.org

      - name: Install exact generated tree
        run: npm ci --registry=https://registry.npmjs.org

      - name: Apply exact Prisma Evidence model and naming corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path('packages/database/prisma/schema.prisma')
          text = p.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              if text.count(old) != 1:
                  raise SystemExit(f'unexpected Prisma schema state for {label}: expected exactly one source block')
              text = text.replace(old, new, 1)

          old_owner_relations = '  zatcaCsidProvisioningAttempts ZatcaCsidProvisioningAttempt[]\n  zatcaFatooraCredentials       ZatcaFatooraCredential[]'
          new_owner_relations = '  zatcaCsidProvisioningAttempts ZatcaCsidProvisioningAttempt[]\n  zatcaComplianceEvidence       ZatcaComplianceEvidence[]\n  zatcaFatooraCredentials       ZatcaFatooraCredential[]'
          if text.count(old_owner_relations) != 2:
              raise SystemExit('unexpected Prisma schema state: Tenant/Terminal ZATCA relation blocks must appear exactly twice')
          text = text.replace(old_owner_relations, new_owner_relations)

          replace_once(
              '  tenant   Tenant   @relation(fields: [tenantId], references: [id], onDelete: Cascade)\n  terminal Terminal @relation(fields: [tenantId, terminalId], references: [tenantId, id], onDelete: NoAction)\n\n  @@unique([tenantId, operationId], map: "zatca_csid_attempts_tenantId_operationId_key")\n  @@unique([tenantId, id], map: "zatca_csid_attempts_tenantId_id_key")',
              '  tenant             Tenant                   @relation(fields: [tenantId], references: [id], onDelete: Cascade)\n  terminal           Terminal                 @relation(fields: [tenantId, terminalId], references: [tenantId, id], onDelete: NoAction)\n  complianceEvidence ZatcaComplianceEvidence?\n\n  @@unique([tenantId, operationId], map: "zatca_csid_attempts_tenantId_operationId_key")\n  @@unique([tenantId, id], map: "zatca_csid_provisioning_attempts_tenantId_id_key")',
              'Compliance attempt Evidence relation and canonical unique name',
          )
          marker = '''/// AES-256-GCM ciphertext for the Fatoora Basic-Authentication credential.\n'''
          model = '''/// Immutable accepted ZATCA compliance-check evidence.\n/// Production CSID onboarding consumes this authority instead of trusting caller-supplied\n/// request ids, environments or credentials. Database triggers enforce source issuance,\n/// terminal consistency, temporal ordering and append-only retention.\nmodel ZatcaComplianceEvidence {\n  id                  String   @id @db.Uuid\n  tenantId            String   @db.Uuid\n  terminalId          String   @db.Uuid\n  complianceAttemptId String   @db.Uuid\n  checkSetHash        String   @db.Char(64)\n  acceptedAt          DateTime\n  createdAt           DateTime @default(now())\n\n  tenant            Tenant                       @relation(fields: [tenantId], references: [id], onDelete: Cascade, map: "zatca_compliance_evidence_tenantId_fkey")\n  terminal          Terminal                     @relation(fields: [tenantId, terminalId], references: [tenantId, id], onDelete: NoAction, map: "zatca_compliance_evidence_tenantId_terminalId_fkey")\n  complianceAttempt ZatcaCsidProvisioningAttempt @relation(fields: [tenantId, complianceAttemptId], references: [tenantId, id], onDelete: NoAction, map: "zatca_compliance_evidence_attempt_fkey")\n\n  @@unique([tenantId, id], map: "zatca_compliance_evidence_tenantId_id_key")\n  @@unique([tenantId, complianceAttemptId], map: "zatca_compliance_evidence_tenantId_attempt_key")\n  @@index([tenantId, terminalId, acceptedAt], map: "zatca_compliance_evidence_tenantId_terminalId_acceptedAt_idx")\n  @@map("zatca_compliance_evidence")\n}\n\n'''
          if 'model ZatcaComplianceEvidence {' in text:
              raise SystemExit('unexpected Prisma schema state: Evidence model already exists in source candidate')
          replace_once(marker, model + marker, 'Evidence model insertion')
          p.write_text(text)
          PY
          npm exec -w @korvi/database -- prisma format

      - name: Format Evidence slice exactly
        run: npx --no-install prettier --write packages/database/src/zatca/compliance-evidence-repository.ts packages/domain/src/ports/zatca-compliance-evidence.ts

      - name: Assert candidate scope and end state
        shell: bash
        run: |
          set -euo pipefail
          allowed=$'apps/pos-web/package.json\npackage-lock.json\npackages/database/prisma/schema.prisma\npackages/database/src/zatca/compliance-evidence-repository.ts\npackages/domain/src/ports/zatca-compliance-evidence.ts'
          changed="$(git status --porcelain=v1 | awk '{print $2}' | sort)"
          printf 'Runtime changed paths:\n%s\n' "$changed"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            grep -Fxq "$path" <<< "$allowed" || { echo "Unexpected runtime changed path: $path" >&2; exit 1; }
          done <<< "$changed"
          grep -F '"fastify": "5.12.4"' apps/api/package.json
          grep -F '"fastify": "5.12.4"' package-lock.json
          grep -F '"next": "16.3.5"' apps/pos-web/package.json
          grep -F '"next": "16.3.5"' package-lock.json
          grep -F 'expect(expected.migrations).toHaveLength(15);' apps/api/src/__tests__/staging-preflight.test.ts
          grep -F 'model ZatcaComplianceEvidence {' packages/database/prisma/schema.prisma
          grep -F '@@unique([tenantId, id], map: "zatca_csid_provisioning_attempts_tenantId_id_key")' packages/database/prisma/schema.prisma
          grep -F 'CREATE UNIQUE INDEX "zatca_csid_provisioning_attempts_tenantId_id_key"' packages/database/prisma/migrations/20260910104000_zatca_csid_provisioning/migration.sql
          grep -F 'DROP POLICY IF EXISTS "zatca_compliance_evidence_isolation" ON "zatca_compliance_evidence";' packages/database/prisma/migrations/20260910224000_zatca_compliance_evidence/migration.sql

      - name: Establish restricted application role
        shell: bash
        run: |
          set -euo pipefail
          psql "$POSTGRES_ADMIN_URL" --no-psqlrc --set=ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE korvi_app LOGIN PASSWORD 'korvi_gate39_ci' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          GRANT CONNECT, CREATE, TEMPORARY ON DATABASE korvi_gate39 TO korvi_app;
          GRANT USAGE, CREATE ON SCHEMA public TO korvi_app;
          SQL
          flags="$(psql "$POSTGRES_ADMIN_URL" --no-psqlrc --tuples-only --no-align --command "SELECT rolsuper,rolcreatedb,rolcreaterole,rolinherit,rolreplication,rolbypassrls FROM pg_roles WHERE rolname='korvi_app'")"
          test "$flags" = 'f|f|f|f|f|f'

      - name: Apply all fifteen migrations and prove zero drift
        shell: bash
        run: |
          set -euo pipefail
          count="$(find packages/database/prisma/migrations -mindepth 1 -maxdepth 1 -type d | wc -l)"
          test "$count" -eq 15
          npm exec -w @korvi/database -- prisma migrate deploy
          ledger="$(psql "$DATABASE_URL" --no-psqlrc --tuples-only --no-align --command "SELECT count(*) FILTER (WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL)::text || '|' || count(*)::text FROM \"_prisma_migrations\"")"
          test "$ledger" = '15|15'
          cd packages/database
          npx --no-install prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Full verification
        run: npm run verify

      - name: Prove Evidence PostgreSQL invariants live
        shell: bash
        run: |
          set -euo pipefail
          rls="$(psql "$DATABASE_URL" --no-psqlrc --tuples-only --no-align --command "SELECT relrowsecurity::text || '|' || relforcerowsecurity::text FROM pg_class WHERE oid='zatca_compliance_evidence'::regclass")"
          test "$rls" = 'true|true'
          policy_count="$(psql "$DATABASE_URL" --no-psqlrc --tuples-only --no-align --command "SELECT count(*) FROM pg_policies WHERE schemaname='public' AND tablename='zatca_compliance_evidence' AND policyname='zatca_compliance_evidence_isolation'")"
          test "$policy_count" = '1'
          npx --no-install vitest run packages/database/src/__tests__/zatca-compliance-evidence-live.test.ts

      - name: Diff integrity
        run: git diff --check

      - name: Preserve verified permanent files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zatca39-final-candidate-${{ github.sha }}
          path: |
            apps/api/package.json
            apps/api/src/__tests__/staging-preflight.test.ts
            apps/pos-web/package.json
            package-lock.json
            packages/database/prisma/migrations/20260910104000_zatca_csid_provisioning/migration.sql
            packages/database/prisma/migrations/20260910224000_zatca_compliance_evidence/migration.sql
            packages/database/prisma/schema.prisma
            packages/database/src/zatca/compliance-evidence-repository.ts
            packages/domain/src/ports/zatca-compliance-evidence.ts
          if-no-files-found: error
          retention-days: 1
