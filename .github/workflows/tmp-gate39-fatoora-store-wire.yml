name: TEMP Gate39 Fatoora Store Wire

on:
  push:
    branches:
      - review/zatca-39-csid-lifecycle
    paths:
      - '.github/workflows/tmp-gate39-fatoora-store-wire.yml'
      - 'scripts/tmp-gate39-wire.py'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: review/zatca-39-csid-lifecycle
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - name: Apply deterministic wiring
        run: python3 scripts/tmp-gate39-wire.py
      - name: Format wired source files
        run: |
          npx --no-install prisma format --schema packages/database/prisma/schema.prisma
          npx --no-install prettier --write packages/database/src/index.ts packages/database/src/zatca/fatoora-credential-repository.ts apps/api/src/zatca/encrypted-fatoora-credential-store.ts apps/api/src/__tests__/zatca-encrypted-fatoora-credential-store.test.ts
      - name: Commit non-workflow wiring only
        run: |
          set -euo pipefail
          git config user.name korvi-ci
          git config user.email korvi-ci@users.noreply.github.com
          git add packages/database/prisma/schema.prisma packages/database/src/index.ts packages/database/src/zatca/fatoora-credential-repository.ts apps/api/src/zatca/encrypted-fatoora-credential-store.ts apps/api/src/__tests__/zatca-encrypted-fatoora-credential-store.test.ts
          git diff --cached --check
          git commit -m 'feat(zatca): wire encrypted Fatoora credential vault'
          git push origin HEAD:review/zatca-39-csid-lifecycle
