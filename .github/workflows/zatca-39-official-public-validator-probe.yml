name: ZATCA 39 Official Public Validator Probe
# Gate 39 continuous compatibility guard for the validator-proven sealing profile.

on:
  push:
    branches:
      - review/zatca-39-csid-lifecycle
    paths:
      - packages/domain/src/ports/zatca.ts
      - packages/domain/src/zatca/**
      - apps/api/src/zatca/**
      - scripts/zatca-39-sealing-proof.mjs
      - .github/workflows/zatca-39-official-public-validator-probe.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  official-public-validator-probe:
    name: Official ZATCA sealed-invoice probe
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PROOF_DIR: artifacts/zatca-39-official-probe
      SECRET_DIR: /tmp/korvi-zatca-39-official-probe-pki
      ZATCA_PORTAL_ORIGIN: https://sandbox.zatca.gov.sa

    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact lockfile
        run: npm ci --registry=https://registry.npmjs.org

      - name: Build production sealing authority
        run: |
          npm run db:generate
          npm run build -w @korvi/domain
          npm run build -w @korvi/database
          npm run build -w @korvi/api
        env:
          DATABASE_URL: postgresql://korvi:korvi@localhost:5432/korvi_pos?schema=public

      - name: Generate ephemeral secp256k1 certificate path
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SECRET_DIR" "$PROOF_DIR"
          mkdir -p "$SECRET_DIR" "$PROOF_DIR"
          chmod 700 "$SECRET_DIR" "$PROOF_DIR"
          umask 077
          cat > "$SECRET_DIR/intermediate.ext" <<'EOF'
          basicConstraints=critical,CA:TRUE,pathlen:0
          keyUsage=critical,keyCertSign,cRLSign
          subjectKeyIdentifier=hash
          authorityKeyIdentifier=keyid,issuer
          EOF
          cat > "$SECRET_DIR/leaf.ext" <<'EOF'
          basicConstraints=critical,CA:FALSE
          keyUsage=critical,digitalSignature
          subjectKeyIdentifier=hash
          authorityKeyIdentifier=keyid,issuer
          EOF
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:secp256k1 -out "$SECRET_DIR/root.key.pem"
          openssl req -new -x509 -key "$SECRET_DIR/root.key.pem" -sha256 -days 3650 \
            -subj '/CN=Korvi Gate39 Official Probe Root/O=Korvi Test/C=SA' \
            -addext 'basicConstraints=critical,CA:TRUE' \
            -addext 'keyUsage=critical,keyCertSign,cRLSign' \
            -out "$SECRET_DIR/root.cert.pem"
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:secp256k1 -out "$SECRET_DIR/intermediate.key.pem"
          openssl req -new -key "$SECRET_DIR/intermediate.key.pem" \
            -subj '/CN=Korvi Gate39 Official Probe Intermediate/O=Korvi Test/C=SA' \
            -out "$SECRET_DIR/intermediate.csr.pem"
          openssl x509 -req -in "$SECRET_DIR/intermediate.csr.pem" \
            -CA "$SECRET_DIR/root.cert.pem" -CAkey "$SECRET_DIR/root.key.pem" -CAcreateserial \
            -sha256 -days 2000 -extfile "$SECRET_DIR/intermediate.ext" \
            -out "$SECRET_DIR/intermediate.cert.pem"
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:secp256k1 -out "$SECRET_DIR/leaf.key.pem"
          openssl req -new -key "$SECRET_DIR/leaf.key.pem" \
            -subj '/CN=Korvi Gate39 Official Probe EGS/O=Korvi Test/C=SA' \
            -out "$SECRET_DIR/leaf.csr.pem"
          openssl x509 -req -in "$SECRET_DIR/leaf.csr.pem" \
            -CA "$SECRET_DIR/intermediate.cert.pem" -CAkey "$SECRET_DIR/intermediate.key.pem" -CAcreateserial \
            -sha256 -days 1000 -extfile "$SECRET_DIR/leaf.ext" \
            -out "$SECRET_DIR/leaf.cert.pem"
          for name in root intermediate leaf; do
            openssl x509 -in "$SECRET_DIR/$name.cert.pem" -outform DER -out "$SECRET_DIR/$name.cert.der"
          done

      - name: Generate sealed invoice through production authority
        run: |
          node scripts/zatca-39-sealing-proof.mjs \
            "$PROOF_DIR" \
            "$SECRET_DIR/leaf.key.pem" \
            "$SECRET_DIR/leaf.cert.der" \
            "$SECRET_DIR/intermediate.cert.der" \
            "$SECRET_DIR/root.cert.der"
          test -s "$PROOF_DIR/sealed-invoice.xml"
          base64 -w0 "$PROOF_DIR/sealed-invoice.xml" > "$RUNNER_TEMP/sealed-invoice.b64"

      - name: Resolve live official validator authority
        shell: bash
        run: |
          set -euo pipefail
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36'
          curl --fail --show-error --location \
            --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 120 \
            -A "$ua" \
            "$ZATCA_PORTAL_ORIGIN/env-config.js" \
            --output "$RUNNER_TEMP/zatca-env.js"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const text = readFileSync(`${process.env.RUNNER_TEMP}/zatca-env.js`, 'utf8');
          const match = /REACT_APP_API_URL\s*:\s*["']([^"']+)["']/.exec(text);
          if (match === null) throw new Error('Official portal REACT_APP_API_URL was not found.');
          const actual = match[1].replace(/\/$/, '');
          if (!actual.startsWith('https://gw-fatoora.zatca.gov.sa/')) {
            throw new Error(`Official validator authority is outside ZATCA: ${actual}`);
          }
          writeFileSync(`${process.env.RUNNER_TEMP}/zatca-validator-url.txt`, actual, { mode: 0o600 });
          NODE

      - name: Submit sealed invoice and enforce official validator contract
        shell: bash
        run: |
          set -euo pipefail
          url="$(cat "$RUNNER_TEMP/zatca-validator-url.txt")"
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36'
          http_code="$(curl --silent --show-error --location \
            --connect-timeout 20 --max-time 180 \
            -A "$ua" \
            -H 'Content-Type: text/plain' \
            -H 'accepted-language: en' \
            -H 'Accept-Language: en' \
            -H "Origin: $ZATCA_PORTAL_ORIGIN" \
            -H "Referer: $ZATCA_PORTAL_ORIGIN/Compliance" \
            --data-binary @"$RUNNER_TEMP/sealed-invoice.b64" \
            --output "$PROOF_DIR/response.json" \
            --write-out '%{http_code}' \
            "$url")"
          {
            echo "commit=$GITHUB_SHA"
            echo "validator_authority=$url"
            echo "validator_http_status=$http_code"
            echo "sealed_invoice_sha256=$(sha256sum "$PROOF_DIR/sealed-invoice.xml" | awk '{print $1}')"
            echo 'credential_authority=EPHEMERAL_TEST_PKI_NOT_ZATCA'
          } > "$PROOF_DIR/authority.txt"
          if [ "$http_code" != '200' ]; then
            cat "$PROOF_DIR/response.json" >&2 || true
            exit 1
          fi
          python3 -m json.tool "$PROOF_DIR/response.json" | tee "$PROOF_DIR/response.pretty.json"

          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const payload = JSON.parse(readFileSync(`${process.env.PROOF_DIR}/response.json`, 'utf8'));
          const errors = Array.isArray(payload.errors) ? payload.errors : [];
          const warnings = Array.isArray(payload.warnings) ? payload.warnings : [];
          const allowedTestCredentialErrors = new Set(['X509IssuerName', 'X509SerialNumber']);

          if (warnings.length !== 0) {
            throw new Error(`Official validator returned unexpected warnings: ${JSON.stringify(warnings)}`);
          }

          for (const finding of errors) {
            if (
              finding?.category !== 'SIGNATURE_ERROR' ||
              typeof finding?.code !== 'string' ||
              !allowedTestCredentialErrors.has(finding.code)
            ) {
              throw new Error(`Official validator returned an unexpected compatibility finding: ${JSON.stringify(finding)}`);
            }
          }

          if (errors.some((finding) => finding?.category === 'QR_CODE_ERROR')) {
            throw new Error('Official validator reported a QR cryptographic regression.');
          }

          console.log(
            `official_validator_contract=PASS valid=${String(payload.valid)} allowed_test_credential_findings=${String(errors.length)}`,
          );
          NODE

      - name: Destroy ephemeral secrets
        if: always()
        shell: bash
        run: |
          rm -rf "$SECRET_DIR"
          test ! -e "$SECRET_DIR"
          rm -f "$PROOF_DIR/signature.raw" \
            "$PROOF_DIR/signature.der" \
            "$PROOF_DIR/signing-public-key.pem" \
            "$PROOF_DIR/signing-public-key.spki.der" \
            "$PROOF_DIR/technical-ca-signature.der" \
            "$PROOF_DIR/invoice-hash.raw" \
            "$PROOF_DIR/signature-value.txt" \
            "$PROOF_DIR/qr-code.txt" \
            "$PROOF_DIR/production-signed-info.c14n.xml" \
            "$PROOF_DIR/production-signed-properties.c14n.xml" \
            "$PROOF_DIR/production-invoice-reference.c14n.xml" \
            "$PROOF_DIR/generator-proof.txt" \
            "$PROOF_DIR/sealed-invoice.xml"
          if grep -R --binary-files=without-match -E -- 'BEGIN (EC |)PRIVATE KEY' "$PROOF_DIR"; then
            echo 'Private-key material leaked into official validator probe artifact.' >&2
            exit 1
          fi

      - name: Upload official validator probe
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zatca-39-official-public-validator-${{ github.sha }}
          path: |
            artifacts/zatca-39-official-probe/authority.txt
            artifacts/zatca-39-official-probe/response.json
            artifacts/zatca-39-official-probe/response.pretty.json
          if-no-files-found: error
          retention-days: 30
