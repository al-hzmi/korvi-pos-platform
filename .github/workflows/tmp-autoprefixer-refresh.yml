name: TEMP Autoprefixer Refresh

on:
  push:
    branches:
      - review/zatca-39-csid-lifecycle
    paths:
      - '.github/workflows/tmp-autoprefixer-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: review/zatca-39-csid-lifecycle
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm install -w @korvi/pos-web --save-dev --save-exact autoprefixer@10.5.6 --registry=https://registry.npmjs.org
      - run: |
          set -euo pipefail
          npm run versions:verify
          git config user.name korvi-ci
          git config user.email korvi-ci@users.noreply.github.com
          git add apps/pos-web/package.json package-lock.json
          git diff --cached --check
          git commit -m 'chore(deps): refresh autoprefixer to 10.5.6'
          git push origin HEAD:review/zatca-39-csid-lifecycle
