name: Runtime Stage 5D Dispatcher

on:
  push:
    branches:
      - review/runtime-react-19-3
    paths:
      - .github/workflows/runtime-stage5d-dispatch.yml

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch existing Stage 5D proof on this exact ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run stage-5d-browser-proof.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"

      - name: Remove dispatcher from review branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Publish cleanup
        run: |
          rm .github/workflows/runtime-stage5d-dispatch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/runtime-stage5d-dispatch.yml
          git commit -m "chore(review): remove runtime proof dispatcher"
          git push origin HEAD:review/runtime-react-19-3
