name: Temporary Gate39 E2E Test Formatter

on:
  push:
    branches:
      - review/zatca-39-csid-lifecycle
    paths:
      - .github/workflows/tmp-gate39-e2e-test-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact review head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: review/zatca-39-csid-lifecycle
          fetch-depth: 1
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install exact lockfile
        run: npm ci --registry=https://registry.npmjs.org
      - name: Format only Gate39 E2E sealer test
        run: |
          npx prettier@3.9.6 --write apps/api/src/__tests__/zatca-seal-simplified-invoice.test.ts
          git diff --check
      - name: Commit only if branch has not moved
        shell: bash
        run: |
          set -euo pipefail
          local_head="$(git rev-parse HEAD)"
          git fetch origin review/zatca-39-csid-lifecycle --depth=1
          remote_head="$(git rev-parse FETCH_HEAD)"
          if [ "$local_head" != "$remote_head" ]; then
            echo "Review branch moved during formatting: local=$local_head remote=$remote_head" >&2
            exit 1
          fi
          git add apps/api/src/__tests__/zatca-seal-simplified-invoice.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'korvi-ci'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'style(zatca): format Gate39 E2E sealer test'
          git push origin HEAD:review/zatca-39-csid-lifecycle
