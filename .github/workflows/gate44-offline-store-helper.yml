name: Gate 44 Offline Store Helper
on:
  push:
    branches: [review/offline-44-sync-engine]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: review/offline-44-sync-engine
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - name: Patch durable queue lifecycle
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/pos-web/src/lib/offline-store.ts')
          s=p.read_text()
          def rep(a,b,label):
              global s
              if a not in s: raise SystemExit(label)
              s=s.replace(a,b,1)
          rep("  type QueueOperationInput,\n  type QueuedOperation,\n  type QueuePartition,\n  type TransactionQueuePort,","  type QueueClaimRequest,\n  type QueueClaimResult,\n  type QueueOperationInput,\n  type QueuedOperation,\n  type QueuePartition,\n  type TransactionQueuePort,",'imports')
          rep("export const OFFLINE_DB_VERSION = 2;","export const OFFLINE_DB_VERSION = 3;",'version')
          rep("const MAX_REJECTION_REASON_LENGTH = 2_048;\nconst QUEUE_KIND_PATTERN","const MAX_REJECTION_REASON_LENGTH = 2_048;\nconst MAX_QUEUE_LEASE_MS = 5 * 60 * 1000;\nconst QUEUE_KIND_PATTERN",'lease')
          rep("  readonly attempts: number;\n  readonly enqueuedAt: string;\n  readonly rejectionReason: string | null;","  readonly attempts: number;\n  readonly enqueuedAt: string;\n  readonly nextAttemptAt: string;\n  readonly leaseUntil: string | null;\n  readonly claimToken: string | null;\n  readonly rejectionReason: string | null;",'stored')
          rep("    attempts: 0,\n    enqueuedAt: operation.enqueuedAt,\n    rejectionReason: null,","    attempts: 0,\n    enqueuedAt: operation.enqueuedAt,\n    nextAttemptAt: operation.enqueuedAt,\n    leaseUntil: null,\n    claimToken: null,\n    rejectionReason: null,",'enqueue')
          rep("    typeof value.enqueuedAt !== 'string' ||\n    !Number.isFinite(Date.parse(value.enqueuedAt)) ||\n    !(value.rejectionReason === null || typeof value.rejectionReason === 'string')","    typeof value.enqueuedAt !== 'string' ||\n    !Number.isFinite(Date.parse(value.enqueuedAt)) ||\n    typeof value.nextAttemptAt !== 'string' ||\n    !Number.isFinite(Date.parse(value.nextAttemptAt)) ||\n    !(value.leaseUntil === null || (typeof value.leaseUntil === 'string' && Number.isFinite(Date.parse(value.leaseUntil)))) ||\n    !(value.claimToken === null || (typeof value.claimToken === 'string' && isUuidV7(value.claimToken))) ||\n    !(value.rejectionReason === null || typeof value.rejectionReason === 'string')",'validate')
          rep("    (value.state !== 'rejected' && value.rejectionReason !== null)\n  ) {\n    throw new OfflineStoreError('corrupt', 'Queued operation terminal metadata is inconsistent.');","    (value.state !== 'rejected' && value.rejectionReason !== null) ||\n    (value.state === 'in-flight' && (value.claimToken === null || value.leaseUntil === null)) ||\n    (value.state !== 'in-flight' && (value.claimToken !== null || value.leaseUntil !== null))\n  ) {\n    throw new OfflineStoreError('corrupt', 'Queued operation lifecycle metadata is inconsistent.');",'lifecycle')
          rep("      state: value.state,\n      attempts: value.attempts,\n      rejectionReason: value.rejectionReason,","      state: value.state,\n      attempts: value.attempts,\n      nextAttemptAt: value.nextAttemptAt,\n      leaseUntil: value.leaseUntil,\n      rejectionReason: value.rejectionReason,",'projection')
          schema="""function createQueueSchema(database: IDBDatabase): void {
            const queue = database.createObjectStore(OFFLINE_TRANSACTION_QUEUE_STORE, {
              keyPath: 'queueKey',
            });
            queue.createIndex(QUEUE_PARTITION_INDEX, 'partitionKey', { unique: false });
            queue.createIndex(QUEUE_ORDER_INDEX, ['partitionKey', 'id'], { unique: true });
            queue.createIndex(QUEUE_ID_INDEX, 'id', { unique: true });
          }
          """
          migration=schema+"""
          function migrateQueueLifecycleV3(transaction: IDBTransaction): void {
            const store = transaction.objectStore(OFFLINE_TRANSACTION_QUEUE_STORE);
            const request = store.openCursor();
            request.onerror = () => transaction.abort();
            request.onsuccess = () => {
              const cursor = request.result;
              if (cursor === null) return;
              const row = cursor.value as Record<string, unknown>;
              if (typeof row['enqueuedAt'] !== 'string') { transaction.abort(); return; }
              cursor.update({ ...row, state: row['state'] === 'in-flight' ? 'pending' : row['state'], nextAttemptAt: row['enqueuedAt'], leaseUntil: null, claimToken: null });
              cursor.continue();
            };
          }
          """
          rep(schema,migration,'schema')
          rep("      if (event.oldVersion < 2) createQueueSchema(request.result);\n    };","      if (event.oldVersion < 2) createQueueSchema(request.result);\n      if (event.oldVersion < 3 && event.oldVersion >= 2 && request.transaction !== null) migrateQueueLifecycleV3(request.transaction);\n    };",'upgrade')
          marker="async function loadQueuedOperation<TPayload>(\n"
          if marker not in s: raise SystemExit('load marker')
          claim=r'''
          function validateClaimRequest(request: QueueClaimRequest): number {
            const nowMs=Date.parse(request.now); const leaseMs=Date.parse(request.leaseUntil);
            if (!isUuidV7(request.token) || !Number.isFinite(nowMs) || !Number.isFinite(leaseMs) || leaseMs<=nowMs || leaseMs-nowMs>MAX_QUEUE_LEASE_MS) throw new OfflineStoreError('corrupt','Invalid queue claim lease.');
            return nowMs;
          }
          async function claimNextQueuedOperation<TPayload>(database: IDBDatabase, partition: QueuePartition, input: QueueClaimRequest): Promise<QueueClaimResult<TPayload>> {
            const nowMs=validateClaimRequest(input); const key=queuePartitionKey(partition);
            const tx=database.transaction(OFFLINE_TRANSACTION_QUEUE_STORE,'readwrite'); const done=transactionDone(tx);
            const req=tx.objectStore(OFFLINE_TRANSACTION_QUEUE_STORE).index(QUEUE_ORDER_INDEX).openCursor(IDBKeyRange.bound([key,''],[key,'\uffff']),'next');
            let result: QueueClaimResult<TPayload>={status:'empty'};
            await new Promise<void>((resolve,reject)=>{ req.onerror=()=>reject(classifyIndexedDbError(req.error)); req.onsuccess=()=>{ const cursor=req.result; if(cursor===null){resolve();return;} try { const decoded=decodeStoredQueueRow(cursor.value,partition); if(decoded.operation.state==='settled'||decoded.operation.state==='rejected'){cursor.continue();return;} if(decoded.operation.state==='pending'&&Date.parse(decoded.operation.nextAttemptAt)>nowMs){result={status:'blocked',reason:'retry-delay',until:decoded.operation.nextAttemptAt};resolve();return;} if(decoded.operation.state==='in-flight'){const until=decoded.operation.leaseUntil; if(until===null) throw new OfflineStoreError('corrupt','Missing queue lease.'); if(Date.parse(until)>nowMs){result={status:'blocked',reason:'active-lease',until};resolve();return;}} const attempts=decoded.operation.attempts+1; cursor.update({...decoded.stored,state:'in-flight',attempts,leaseUntil:input.leaseUntil,claimToken:input.token,rejectionReason:null} satisfies StoredQueuedOperation); result={status:'claimed',claim:{token:input.token,operation:{...decoded.operation,state:'in-flight',attempts,leaseUntil:input.leaseUntil} as QueuedOperation<TPayload>}}; resolve(); } catch(error){tx.abort();reject(classifyIndexedDbError(error));}}; });
            await done; return result;
          }
          async function transitionClaim(database: IDBDatabase, partition: QueuePartition, id: string, token: string, target: 'settled'|'rejected'|'pending', value: string|null): Promise<void> {
            if(!isUuidV7(token)) throw new OfflineStoreError('corrupt','Invalid claim token.');
            const reason=target==='rejected'?value?.trim()??null:null;
            if(target==='rejected'&&(reason===null||reason===''||reason.length>MAX_REJECTION_REASON_LENGTH)) throw new OfflineStoreError('corrupt','Invalid rejection reason.');
            if(target==='pending'&&(value===null||!Number.isFinite(Date.parse(value)))) throw new OfflineStoreError('corrupt','Invalid retry timestamp.');
            const tx=database.transaction(OFFLINE_TRANSACTION_QUEUE_STORE,'readwrite'); const done=transactionDone(tx); const store=tx.objectStore(OFFLINE_TRANSACTION_QUEUE_STORE); const req=store.get(queueRecordKey(partition,id)); let failure: OfflineStoreError|null=null;
            req.onerror=()=>{failure=classifyIndexedDbError(req.error);tx.abort();}; req.onsuccess=()=>{try{if(req.result===undefined){failure=new OfflineStoreError('conflict','Queue operation missing.');tx.abort();return;} const decoded=decodeStoredQueueRow(req.result,partition); if(decoded.operation.state!=='in-flight'||decoded.stored.claimToken!==token){failure=new OfflineStoreError('conflict','Stale queue claim.');tx.abort();return;} store.put({...decoded.stored,state:target,nextAttemptAt:target==='pending'?value!:decoded.stored.nextAttemptAt,leaseUntil:null,claimToken:null,rejectionReason:target==='rejected'?reason:null} satisfies StoredQueuedOperation);}catch(error){failure=classifyIndexedDbError(error);tx.abort();}};
            try{await done;}catch(error){if(failure!==null)throw failure;throw classifyIndexedDbError(error);}
          }
          '''
          s=s.replace(marker,claim+marker,1)
          anchor="      if (decoded.operation.state === 'settled' || decoded.operation.state === 'rejected') {"
          rep(anchor,"      if (decoded.operation.state === 'in-flight') { failure = new OfflineStoreError('conflict', 'Claim token required.'); transaction.abort(); return; }\n"+anchor,'direct claim guard')
          method="""    async get<TPayload = unknown>(partition: QueuePartition, id: string) {
                return loadQueuedOperation<TPayload>(database, partition, id);
              },

              async markSettled(partition, id) {
          """
          insert="""    async get<TPayload = unknown>(partition: QueuePartition, id: string) {
                return loadQueuedOperation<TPayload>(database, partition, id);
              },

              async claimNext<TPayload = unknown>(partition: QueuePartition, request: QueueClaimRequest) { return claimNextQueuedOperation<TPayload>(database, partition, request); },
              async settleClaim(partition, id, token) { await transitionClaim(database, partition, id, token, 'settled', null); },
              async retryClaim(partition, id, token, nextAttemptAt) { await transitionClaim(database, partition, id, token, 'pending', nextAttemptAt); },
              async rejectClaim(partition, id, token, reason) { await transitionClaim(database, partition, id, token, 'rejected', reason); },

              async markSettled(partition, id) {
          """
          rep(method,insert,'methods')
          p.write_text(s)
          PY
      - run: npx prettier --write apps/pos-web/src/lib/offline-store.ts
      - run: npm run build --workspace=@korvi/domain && npm run typecheck --workspace=@korvi/pos-web
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/pos-web/src/lib/offline-store.ts
          git diff --cached --check
          git commit -m 'feat(offline): add atomic queue claim lifecycle'
          git push origin HEAD:review/offline-44-sync-engine
