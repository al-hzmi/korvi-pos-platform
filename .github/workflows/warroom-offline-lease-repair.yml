name: War Room Offline Lease Repair

on:
  push:
    branches:
      - strike/product-routing-p0

permissions:
  contents: write
  actions: write

concurrency:
  group: warroom-offline-lease-repair
  cancel-in-progress: true

jobs:
  repair-and-dispatch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out authoritative branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: strike/product-routing-p0
          fetch-depth: 0

      - name: Repair exact-optional typing in lease generator
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/warroom-offline-lease.yml')
          text = path.read_text()
          replacements = {
              "  readonly OFFLINE_LEASE_SIGNING_SEED_B64?: string;":
                  "  readonly OFFLINE_LEASE_SIGNING_SEED_B64: string | undefined;",
              "  readonly OFFLINE_LEASE_KEY_ID?: string;":
                  "  readonly OFFLINE_LEASE_KEY_ID: string | undefined;",
              "  readonly OFFLINE_LEASE_TTL_SECONDS?: number;":
                  "  readonly OFFLINE_LEASE_TTL_SECONDS: number;",
              "registerNativeAuthRoutes(app, { service: native, offlineLease: offlineLeaseServiceFor(config) });":
                  "const offlineLease = offlineLeaseServiceFor(config);\\n    registerNativeAuthRoutes(app, {\\n      service: native,\\n      ...(offlineLease === undefined ? {} : { offlineLease }),\\n    });",
              "if: github.actor != 'github-actions[bot]'":
                  "if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'lease workflow repair anchor missing: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git diff --check

      - name: Commit repaired proof without retaining repair workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/warroom-offline-lease-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/warroom-offline-lease.yml
          git commit -m 'ci(installed): fix offline lease exact optional typing'
          git push origin HEAD:strike/product-routing-p0

      - name: Dispatch repaired offline lease proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/warroom-offline-lease.yml/dispatches" -f ref=strike/product-routing-p0
