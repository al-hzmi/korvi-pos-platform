name: V2-4 One-Shot Canonical Format

on:
  push:
    branches:
      - mastermind/v2-strengthening
    paths:
      - .github/workflows/v2-4-one-shot-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: mastermind/v2-strengthening
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install exact lockfile
        run: npm ci --registry=https://registry.npmjs.org
      - name: Apply canonical formatter
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write             apps/api/src/lots/service.ts             apps/api/src/routes/lots-admin.ts             apps/pos-web/src/components/control/lots-panel.tsx             apps/pos-web/src/components/control/onboarding-panel.tsx             apps/pos-web/src/lib/inventory-command-flight.ts             apps/pos-web/src/lib/__tests__/inventory-command-flight.test.ts
          rm .github/workflows/v2-4-one-shot-format.yml
          git diff --check
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "korvi-v2-4-format"
          git config user.email "actions@users.noreply.github.com"
          git add             apps/api/src/lots/service.ts             apps/api/src/routes/lots-admin.ts             apps/pos-web/src/components/control/lots-panel.tsx             apps/pos-web/src/components/control/onboarding-panel.tsx             apps/pos-web/src/lib/inventory-command-flight.ts             apps/pos-web/src/lib/__tests__/inventory-command-flight.test.ts             .github/workflows/v2-4-one-shot-format.yml
          git commit -m "style(v2-4): format lot authority surfaces"
          git push origin HEAD:mastermind/v2-strengthening
