name: Korvi fix P0 web contract once

on:
  push:
    branches:
      - strike/product-routing-p0
    paths:
      - .github/workflows/korvi-fix-p0-web-contract-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: strike/product-routing-p0
          fetch-depth: 1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - name: Align UI contracts with exact wire truth
        run: |
          python - <<'PY'
          from pathlib import Path

          onboarding = Path('apps/pos-web/src/components/control/onboarding-panel.tsx')
          text = onboarding.read_text()
          old = """    case 'purchasing':\n      return permissions.includes('purchasing.read');\n    case 'home':\n      return true;\n"""
          new = """    case 'purchasing':\n      return permissions.includes('purchasing.read');\n    case 'sales':\n      return permissions.includes('report.read');\n    case 'home':\n      return true;\n"""
          if old not in text:
              raise SystemExit('onboarding switch block not found')
          onboarding.write_text(text.replace(old, new, 1))

          sales = Path('apps/pos-web/src/components/control/sales-panel.tsx')
          text = sales.read_text()
          old = """      const page = await api.list(query, { signal });\n"""
          new = """      const page = await api.list(query, signal === undefined ? undefined : { signal });\n"""
          if old not in text:
              raise SystemExit('sales signal block not found')
          text = text.replace(old, new, 1)
          old = """  const applyFilters = useCallback(() => {\n    setDetail({ kind: 'closed' });\n    setApplied({\n      limit: 50,\n      ...(search.trim() === '' ? {} : { search: search.trim() }),\n      ...(status === 'all' ? {} : { status }),\n      ...(toIso(from) === undefined ? {} : { from: toIso(from) }),\n      ...(toIso(to) === undefined ? {} : { to: toIso(to) }),\n    });\n  }, [from, search, status, to]);\n"""
          new = """  const applyFilters = useCallback(() => {\n    const normalizedFrom = toIso(from);\n    const normalizedTo = toIso(to);\n    setDetail({ kind: 'closed' });\n    setApplied({\n      limit: 50,\n      ...(search.trim() === '' ? {} : { search: search.trim() }),\n      ...(status === 'all' ? {} : { status }),\n      ...(normalizedFrom === undefined ? {} : { from: normalizedFrom }),\n      ...(normalizedTo === undefined ? {} : { to: normalizedTo }),\n    });\n  }, [from, search, status, to]);\n"""
          if old not in text:
              raise SystemExit('sales filter block not found')
          sales.write_text(text.replace(old, new, 1))

          platform = Path('apps/pos-web/src/components/platform/platform-app.tsx')
          text = platform.read_text()
          old = """        {\n          search: appliedSearch === '' ? undefined : appliedSearch,\n          status: status === '' ? undefined : status,\n          limit: 100,\n        },\n"""
          new = """        {\n          ...(appliedSearch === '' ? {} : { search: appliedSearch }),\n          ...(status === '' ? {} : { status }),\n          limit: 100,\n        },\n"""
          if old not in text:
              raise SystemExit('platform tenant query block not found')
          platform.write_text(text.replace(old, new, 1))
          PY
          npx prettier --write apps/pos-web/src/components/control/onboarding-panel.tsx apps/pos-web/src/components/control/sales-panel.tsx apps/pos-web/src/components/platform/platform-app.tsx
          npm run lint
          bash scripts/check-invariants.sh
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/korvi-fix-p0-web-contract-once.yml
          git config user.name korvi-ci
          git config user.email korvi-ci@users.noreply.github.com
          git add apps/pos-web/src/components/control/onboarding-panel.tsx apps/pos-web/src/components/control/sales-panel.tsx apps/pos-web/src/components/platform/platform-app.tsx .github/workflows/korvi-fix-p0-web-contract-once.yml
          git commit -m "fix(web): preserve exact P0 request contracts"
          git push origin HEAD:strike/product-routing-p0
