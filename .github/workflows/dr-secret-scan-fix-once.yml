name: DR Secret Scan Fix Once

on:
  push:
    branches:
      - review/operations-50-production-readiness

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out operations branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: review/operations-50-production-readiness
          fetch-depth: 1

      - name: Make credential scan assignment-specific
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/operations-dr-postgres.yml')
          text = path.read_text(encoding='utf-8')
          old = "postgresql://|PASSWORD[ =]|BEGIN (EC |RSA |)PRIVATE KEY|session[_-]?cookie|authorization:"
          new = "postgresql://|password[[:space:]]*[:=]|BEGIN (EC |RSA |)PRIVATE KEY|session[_-]?cookie|authorization:"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale secret-scan expression, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/dr-secret-scan-fix-once.yml
          git diff --check

      - name: Commit exact correction and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/workflows/operations-dr-postgres.yml .github/workflows/dr-secret-scan-fix-once.yml
          git diff --cached --quiet && exit 1
          git commit -m 'fix(ops): make DR proof secret scan assignment-specific'
          git push origin HEAD:review/operations-50-production-readiness
