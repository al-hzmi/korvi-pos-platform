name: ZATCA 39 Sealing Cryptographic Proof

on:
  push:
    branches:
      - review/zatca-39-csid-lifecycle
    paths:
      - packages/domain/src/ports/zatca.ts
      - packages/domain/src/zatca/**
      - apps/api/src/zatca/**
      - apps/api/src/__tests__/zatca-seal-simplified-invoice.test.ts
      - apps/api/package.json
      - package-lock.json
      - scripts/zatca-39-native-subset-c14n.c
      - .github/workflows/zatca-39-sealing-cryptographic-proof.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sealed-invoice-proof:
    name: Native C14N / OpenSSL / QR binding proof
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PROOF_DIR: artifacts/zatca-39-sealing

    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install and verify repository policy
        run: |
          node scripts/verify-package-manager.mjs
          npm ci --registry=https://registry.npmjs.org
          npm run versions:verify
          npm run audit
          npm run format:check
          npm run lint
          bash scripts/check-invariants.sh

      - name: Generate Prisma client and build production sealing chain
        run: |
          npm run db:generate
          npm run build -w @korvi/domain
          npm run build -w @korvi/database
          npm run build -w @korvi/api
        env:
          DATABASE_URL: postgresql://korvi:korvi@localhost:5432/korvi_pos?schema=public

      - name: Generate sealed proof artifact through production integration test
        run: |
          rm -rf "$PROOF_DIR"
          KORVI_ZATCA_PROOF_DIR="$PROOF_DIR" npx vitest run \
            apps/api/src/__tests__/zatca-seal-simplified-invoice.test.ts \
            -t 'seals the Fatoora profile'
          test -s "$PROOF_DIR/sealed-invoice.xml"
          test -s "$PROOF_DIR/invoice-hash.raw"
          test -s "$PROOF_DIR/signature.der"

      - name: Install native libxml2 proof authority
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          candidate="$(apt-cache policy libxml2-dev | awk '/Candidate:/ {print $2}')"
          if [ -z "$candidate" ] || [ "$candidate" = '(none)' ]; then
            echo 'No libxml2-dev candidate is available.' >&2
            exit 1
          fi
          sudo apt-get install -y --no-install-recommends "libxml2-dev=$candidate"
          printf 'libxml2-dev=%s\n' "$candidate" > "$PROOF_DIR/native-version.txt"
          printf 'openssl=%s\n' "$(openssl version)" >> "$PROOF_DIR/native-version.txt"
          printf 'pkg-config-libxml2=%s\n' "$(pkg-config --modversion libxml-2.0)" >> "$PROOF_DIR/native-version.txt"

      - name: Build native final-context C14N oracle
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror \
            scripts/zatca-39-native-subset-c14n.c \
            $(pkg-config --cflags --libs libxml-2.0) \
            -o "$RUNNER_TEMP/zatca39-native-subset-c14n"
          for target in invoice signed-info signed-properties; do
            "$RUNNER_TEMP/zatca39-native-subset-c14n" \
              "$PROOF_DIR/sealed-invoice.xml" "$target" \
              "$PROOF_DIR/native-$target.c14n.xml"
          done

      - name: Prove production and native C14N bytes match
        shell: bash
        run: |
          set -euo pipefail
          cmp --silent "$PROOF_DIR/production-invoice-reference.c14n.xml" "$PROOF_DIR/native-invoice.c14n.xml"
          cmp --silent "$PROOF_DIR/production-signed-info.c14n.xml" "$PROOF_DIR/native-signed-info.c14n.xml"
          cmp --silent "$PROOF_DIR/production-signed-properties.c14n.xml" "$PROOF_DIR/native-signed-properties.c14n.xml"
          sha256sum \
            "$PROOF_DIR/native-invoice.c14n.xml" \
            "$PROOF_DIR/native-signed-info.c14n.xml" \
            "$PROOF_DIR/native-signed-properties.c14n.xml" \
            > "$PROOF_DIR/native-c14n.sha256"

      - name: Independently bind XML, certificate path and QR tags 6-9
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROOF_DIR" <<'PY'
          import base64
          import pathlib
          import sys
          import xml.etree.ElementTree as ET

          proof = pathlib.Path(sys.argv[1])
          root = ET.parse(proof / 'sealed-invoice.xml').getroot()
          ns = {
              'cac': 'urn:oasis:names:specification:ubl:schema:xsd:CommonAggregateComponents-2',
              'cbc': 'urn:oasis:names:specification:ubl:schema:xsd:CommonBasicComponents-2',
              'ds': 'http://www.w3.org/2000/09/xmldsig#',
          }

          signature = root.find('.//ds:SignatureValue', ns)
          if signature is None or not signature.text:
              raise SystemExit('missing XML SignatureValue')
          signature_text = signature.text.strip()
          signature_der = base64.b64decode(signature_text, validate=True)
          if len(signature_der) < 68 or len(signature_der) > 72 or signature_der[0] != 0x30:
              raise SystemExit('Fatoora SignatureValue is not canonical-looking ECDSA DER')
          if signature_der != (proof / 'signature.der').read_bytes():
              raise SystemExit('XML SignatureValue diverges from sealer DER artifact')

          invoice_reference = None
          for reference in root.findall('.//ds:Reference', ns):
              if reference.attrib.get('Id') == 'invoiceSignedData':
                  invoice_reference = reference
                  break
          if invoice_reference is None:
              raise SystemExit('missing invoiceSignedData reference')
          digest = invoice_reference.find('ds:DigestValue', ns)
          if digest is None or not digest.text:
              raise SystemExit('missing invoice hash DigestValue')
          invoice_hash_text = digest.text.strip()
          invoice_hash_raw = base64.b64decode(invoice_hash_text, validate=True)
          if len(invoice_hash_raw) != 32:
              raise SystemExit('invoice digest is not SHA-256 width')
          if invoice_hash_raw != (proof / 'invoice-hash.raw').read_bytes():
              raise SystemExit('SignedInfo invoice digest diverges from production invoice hash')

          qr_text = None
          for reference in root.findall('.//cac:AdditionalDocumentReference', ns):
              identifier = reference.find('cbc:ID', ns)
              if identifier is not None and identifier.text == 'QR':
                  payload = reference.find('.//cbc:EmbeddedDocumentBinaryObject', ns)
                  if payload is None or not payload.text:
                      raise SystemExit('QR reference has no payload')
                  qr_text = payload.text.strip()
                  break
          if qr_text is None:
              raise SystemExit('missing QR AdditionalDocumentReference')

          qr = base64.b64decode(qr_text, validate=True)
          fields = {}
          offset = 0
          while offset < len(qr):
              if offset + 2 > len(qr):
                  raise SystemExit('truncated QR TLV header')
              tag = qr[offset]
              length = qr[offset + 1]
              offset += 2
              if offset + length > len(qr):
                  raise SystemExit('truncated QR TLV value')
              if tag in fields:
                  raise SystemExit(f'duplicate QR tag {tag}')
              fields[tag] = qr[offset:offset + length]
              offset += length
          if sorted(fields) != list(range(1, 10)):
              raise SystemExit(f'unexpected QR tags: {sorted(fields)}')
          expected = {
              6: invoice_hash_text.encode('utf-8'),
              7: signature_text.encode('utf-8'),
              8: (proof / 'signing-public-key.spki.der').read_bytes(),
              9: (proof / 'technical-ca-signature.der').read_bytes(),
          }
          for tag, value in expected.items():
              if fields[tag] != value:
                  raise SystemExit(f'QR tag {tag} diverges from signed artifact')

          certificates = root.findall('.//ds:X509Certificate', ns)
          if len(certificates) < 2:
              raise SystemExit('X509Data does not contain the certificate path')
          for index, certificate in enumerate(certificates):
              if not certificate.text:
                  raise SystemExit('empty X509Certificate element')
              (proof / f'certificate-{index}.der').write_bytes(
                  base64.b64decode(certificate.text.strip(), validate=True)
              )

          (proof / 'parser-proof.txt').write_text(
              'xml_signature_der_binding=PASS\n'
              'signed_info_invoice_hash_binding=PASS\n'
              'qr_tags_1_9_unique=PASS\n'
              'qr_tags_6_9_binding=PASS\n'
              'x509_path_extracted=PASS\n',
              encoding='utf-8',
          )
          PY

      - name: Verify certificate path and Fatoora stamp with OpenSSL
        shell: bash
        run: |
          set -euo pipefail
          for der in "$PROOF_DIR"/certificate-*.der; do
            openssl x509 -inform DER -in "$der" -out "${der%.der}.pem"
          done
          cert_count="$(find "$PROOF_DIR" -maxdepth 1 -name 'certificate-*.der' | wc -l)"
          if [ "$cert_count" -lt 2 ]; then
            echo 'Certificate path is incomplete.' >&2
            exit 1
          fi
          root_index=$((cert_count - 1))
          if [ "$cert_count" -eq 2 ]; then
            openssl verify \
              -CAfile "$PROOF_DIR/certificate-${root_index}.pem" \
              "$PROOF_DIR/certificate-0.pem" | tee "$PROOF_DIR/openssl-chain.txt"
          else
            cat "$PROOF_DIR"/certificate-{1..$((root_index - 1))}.pem > "$RUNNER_TEMP/intermediates.pem"
            openssl verify \
              -CAfile "$PROOF_DIR/certificate-${root_index}.pem" \
              -untrusted "$RUNNER_TEMP/intermediates.pem" \
              "$PROOF_DIR/certificate-0.pem" | tee "$PROOF_DIR/openssl-chain.txt"
          fi
          openssl dgst -sha256 \
            -verify "$PROOF_DIR/signing-public-key.pem" \
            -signature "$PROOF_DIR/signature.der" \
            "$PROOF_DIR/invoice-hash.raw" | tee "$PROOF_DIR/openssl-signature.txt"
          grep -Fxq 'Verified OK' "$PROOF_DIR/openssl-signature.txt"

      - name: Preserve sanitized proof only
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --binary-files=without-match -E -- 'BEGIN (EC |)PRIVATE KEY' "$PROOF_DIR"; then
            echo 'Private-key material leaked into proof output.' >&2
            exit 1
          fi
          {
            echo "commit=$GITHUB_SHA"
            echo 'production_full_sealer=PASS'
            echo 'native_invoice_c14n11_match=PASS'
            echo 'native_signed_info_c14n11_match=PASS'
            echo 'native_signed_properties_c14n11_match=PASS'
            echo 'openssl_certificate_path=PASS'
            echo 'openssl_fatoora_invoice_hash_signature=PASS'
            echo 'independent_xml_qr_binding=PASS'
            echo 'private_key_artifact_absent=PASS'
            echo 'authority=EPHEMERAL_TEST_PKI_NOT_ZATCA_ACCEPTANCE'
            cat "$PROOF_DIR/proof-generator.txt"
            cat "$PROOF_DIR/parser-proof.txt"
          } > "$PROOF_DIR/proof.txt"
          sha256sum "$PROOF_DIR/sealed-invoice.xml" > "$PROOF_DIR/sealed-invoice.sha256"
          rm -f "$PROOF_DIR"/certificate-*.der "$PROOF_DIR"/certificate-*.pem
          cat "$PROOF_DIR/proof.txt"

      - name: Upload sanitized cryptographic proof
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zatca-39-sealing-proof-${{ github.sha }}
          path: |
            artifacts/zatca-39-sealing/proof.txt
            artifacts/zatca-39-sealing/native-version.txt
            artifacts/zatca-39-sealing/native-c14n.sha256
            artifacts/zatca-39-sealing/sealed-invoice.sha256
            artifacts/zatca-39-sealing/openssl-chain.txt
            artifacts/zatca-39-sealing/openssl-signature.txt
            artifacts/zatca-39-sealing/parser-proof.txt
          if-no-files-found: error
          retention-days: 30
