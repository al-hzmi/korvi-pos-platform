name: TEMP Gate39 Test Format

on:
  push:
    branches:
      - review/zatca-39-csid-lifecycle
    paths:
      - '.github/workflows/tmp-gate39-test-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: review/zatca-39-csid-lifecycle
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - name: Format strict Gate39 test fixes
        run: npx --no-install prettier --write apps/api/src/__tests__/zatca-seal-simplified-invoice.test.ts packages/domain/src/zatca/__tests__/csid-lifecycle.test.ts packages/domain/src/zatca/__tests__/csid-provisioning.test.ts packages/domain/src/zatca/__tests__/x509.test.ts
      - name: Commit formatter output
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No formatter changes required.'
            exit 0
          fi
          git config user.name 'korvi-ci'
          git config user.email 'korvi-ci@users.noreply.github.com'
          git add apps/api/src/__tests__/zatca-seal-simplified-invoice.test.ts packages/domain/src/zatca/__tests__/csid-lifecycle.test.ts packages/domain/src/zatca/__tests__/csid-provisioning.test.ts packages/domain/src/zatca/__tests__/x509.test.ts
          git diff --cached --check
          git commit -m 'style(zatca): format strict Gate39 verifier fixes'
          git push origin HEAD:review/zatca-39-csid-lifecycle
