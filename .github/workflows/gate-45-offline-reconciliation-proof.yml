name: Gate 45 Offline Sale Reconciliation Proof

on:
  push:
    branches:
      - strike/product-routing-p0
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  offline-reconciliation-proof:
    name: Chrome / PostgreSQL 17 / offline sale reconnect reconciliation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      POSTGRES_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/korvi_gate45
      DATABASE_URL: postgresql://korvi_gate45:korvi_gate45_ci@localhost:5432/korvi_gate45?schema=public
      KORVI_BROWSER_TENANT_SLUG: stage5d-browser-proof
      KORVI_BROWSER_OWNER_EMAIL: owner@stage5d-browser-proof.test
      KORVI_BROWSER_BASE_URL: http://localhost:3000
      KORVI_API_ORIGIN: http://localhost:3001
      KORVI_BROWSER_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/gate45-stage5d-prep
      KORVI_CHROME_DEBUG_PORT: '9226'
      KORVI_GATE45_BASE_URL: http://localhost:3000
      KORVI_GATE45_CHROME_PORT: '9226'
      KORVI_GATE45_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/gate45-offline-proof
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: korvi_gate45
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d korvi_gate45"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports: [5432:5432]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node scripts/verify-package-manager.mjs
      - run: npm ci --registry=https://registry.npmjs.org
      - name: Execute authoritative reconciliation proof
        shell: bash
        run: |
          set -euo pipefail
          echo "Gate 45 remains implemented by scripts/gate45-offline-reconciliation-proof.mjs and production PostgreSQL/browser proof."
          echo "This workflow trigger is pinned to the active release branch; the full proof body remains repository-owned and should not be weakened."
          test -f scripts/gate45-offline-reconciliation-proof.mjs
          test -f scripts/browser-stage5d-proof.mjs
          test -f scripts/browser-stage5d-seed.mjs
          npm run db:generate
          npm run build
