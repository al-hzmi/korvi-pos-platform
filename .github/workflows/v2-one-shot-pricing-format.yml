name: V2 One-Shot Pricing Format

on:
  push:
    branches:
      - mastermind/v2-strengthening
    paths:
      - .github/workflows/v2-one-shot-pricing-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: mastermind/v2-strengthening
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact lockfile
        run: npm ci --registry=https://registry.npmjs.org

      - name: Format pricing surfaces and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write \
            apps/api/src/checkout/pricing-hash.ts \
            apps/api/src/checkout/preview-service.ts \
            apps/api/src/checkout/service.ts \
            apps/api/src/checkout/fingerprint.ts \
            apps/api/src/routes/validation.ts \
            apps/api/src/routes/business.ts \
            apps/pos-web/src/lib/api-types.ts \
            apps/pos-web/src/lib/api.ts \
            apps/pos-web/src/lib/checkout-submit.ts \
            apps/pos-web/src/lib/checkout-flight.ts \
            apps/pos-web/src/lib/offline-checkout.ts \
            apps/pos-web/src/lib/checkout-sync-executor.ts \
            apps/pos-web/src/lib/failures.ts \
            apps/pos-web/src/components/cashier-screen.tsx \
            scripts/browser-cashier-sale-proof.mjs
          rm .github/workflows/v2-one-shot-pricing-format.yml
          git diff --check

      - name: Commit exact formatter output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "korvi-v2-format"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "style(v2-2): format pricing preview contract"
          git push origin HEAD:mastermind/v2-strengthening
