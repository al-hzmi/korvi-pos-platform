name: Gate 45 Proof Format Once

on:
  push:
    branches:
      - review/offline-45-reconciliation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out Gate 45 branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: review/offline-45-reconciliation
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact lockfile
        run: npm ci --registry=https://registry.npmjs.org

      - name: Format Gate 45 proof source
        run: npx --no-install prettier --write scripts/gate45-offline-reconciliation-proof.mjs

      - name: Commit formatted proof only
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --quiet -- scripts/gate45-offline-reconciliation-proof.mjs && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/gate45-offline-reconciliation-proof.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'style(offline): format Gate 45 reconciliation proof'
          git push origin HEAD:review/offline-45-reconciliation
