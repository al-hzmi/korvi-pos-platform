name: Temp Wire Fiscal Checkout

on:
  push:
    branches:
      - strike/product-routing-p0
    paths:
      - .github/workflows/_temp-wire-fiscal-checkout.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: strike/product-routing-p0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --registry=https://registry.npmjs.org

      - name: Apply fiscal checkout wiring
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          fiscal = r'''import {
            ZatcaFiscalizationError,
            type InvoiceRecord,
            type SaleRecord,
            type TenantScope,
            type ZatcaFiscalizationRepository,
          } from '@korvi/domain';
          import type { ZatcaSimplifiedInvoiceSealer } from './seal-simplified-invoice.js';

          export interface CheckoutFiscalizationPort {
            fiscalize(scope: TenantScope, sale: SaleRecord, invoice: InvoiceRecord): Promise<void>;
          }

          export interface CheckoutFiscalizationDependencies {
            readonly repository: ZatcaFiscalizationRepository;
            readonly sealer: ZatcaSimplifiedInvoiceSealer;
            readonly now?: () => Date;
          }

          /**
           * Turn one already-persisted finalized sale/invoice pair into one durable
           * sealed fiscal artifact. The fiscal reservation owns ICV/PIH; the sealer
           * owns cryptography; this orchestration layer owns only idempotent ordering.
           */
          export function createCheckoutFiscalizationPort(
            dependencies: CheckoutFiscalizationDependencies,
          ): CheckoutFiscalizationPort {
            const now = dependencies.now ?? (() => new Date());

            return {
              async fiscalize(scope, sale, invoice) {
                assertSameFiscalSale(scope, sale, invoice);

                const existing = await dependencies.repository.findByInvoice(scope, invoice.id);
                if (existing !== null) {
                  if (existing.terminalId !== sale.terminalId) {
                    throw new ZatcaFiscalizationError(
                      'Persisted fiscalization belongs to a different sale terminal.',
                    );
                  }
                  if (existing.state === 'sealed') return;
                }

                const reservation =
                  existing ??
                  (await dependencies.repository.reserve(scope, {
                    invoiceId: invoice.id,
                    terminalId: sale.terminalId,
                    reservedAt: stampingTime(now(), sale.issuedAt),
                  }));

                if (reservation.state === 'sealed') return;

                const sealed = await dependencies.sealer.seal({
                  scope,
                  terminalId: sale.terminalId,
                  stampingTime: reservation.reservedAt,
                  invoice: {
                    sale,
                    invoice,
                    seller: reservation.seller,
                    invoiceCounterValue: reservation.invoiceCounterValue,
                    previousInvoiceHash: reservation.previousInvoiceHash,
                  },
                });

                await dependencies.repository.seal(scope, {
                  invoiceId: invoice.id,
                  terminalId: sale.terminalId,
                  invoiceHash: sealed.invoiceHash,
                  sealedInvoiceXml: new TextEncoder().encode(sealed.xml),
                  qrCodeBase64: sealed.qrCodeBase64,
                  signatureValueBase64: sealed.signatureValueBase64,
                  sealedAt: reservation.reservedAt,
                });
              },
            };
          }

          function assertSameFiscalSale(
            scope: TenantScope,
            sale: SaleRecord,
            invoice: InvoiceRecord,
          ): void {
            if (sale.tenantId !== scope.tenantId || invoice.tenantId !== scope.tenantId) {
              throw new ZatcaFiscalizationError('Checkout fiscalization refuses cross-tenant truth.');
            }
            if (sale.status !== 'finalized' || invoice.saleId !== sale.id) {
              throw new ZatcaFiscalizationError(
                'Checkout fiscalization requires the durable invoice for the finalized sale.',
              );
            }
          }

          function stampingTime(now: Date, issuedAt: string): string {
            const nowMs = now.getTime();
            const issuedMs = Date.parse(issuedAt);
            if (!Number.isFinite(nowMs) || !Number.isFinite(issuedMs)) {
              throw new ZatcaFiscalizationError('Checkout fiscalization timestamp is invalid.');
            }
            const second = Math.max(Math.floor(nowMs / 1_000), Math.floor(issuedMs / 1_000)) * 1_000;
            return new Date(second).toISOString().replace('.000Z', 'Z');
          }
          '''
          Path('apps/api/src/zatca/fiscalize-checkout.ts').write_text(fiscal, encoding='utf-8')

          infra = r'''import type { PrismaClient } from '@korvi/database';
          import { createZatcaCsidBindingRepository } from '@korvi/database/zatca-csid-binding';
          import { createZatcaFiscalizationRepository } from '@korvi/database/zatca-fiscalization';
          import { ZatcaInvoiceError } from '@korvi/domain';
          import {
            AzureClientSecretAccessTokenProvider,
            AzureKeyVaultRestClient,
            AzureKeyVaultSigningKeyPort,
          } from './azure-key-vault-signing-key.js';
          import {
            createCheckoutFiscalizationPort,
            type CheckoutFiscalizationPort,
          } from './fiscalize-checkout.js';
          import { Libxml2ZatcaCanonicalizer } from './libxml2-canonicalizer.js';
          import { createZatcaSimplifiedInvoiceSealer } from './seal-simplified-invoice.js';

          export interface ProductionCheckoutFiscalizationOptions {
            readonly prisma: PrismaClient;
            readonly env?: NodeJS.ProcessEnv;
          }

          /** Production-only composition edge. No CSID, key id or fiscal chain fact comes from a client. */
          export function createProductionCheckoutFiscalization(
            options: ProductionCheckoutFiscalizationOptions,
          ): CheckoutFiscalizationPort {
            const env = options.env ?? process.env;
            const vaultName = required(env, 'AZURE_KEY_VAULT_NAME');
            if (!/^[A-Za-z0-9-]{3,24}$/.test(vaultName)) {
              throw new ZatcaInvoiceError('AZURE_KEY_VAULT_NAME is invalid.');
            }

            const tokenProvider = new AzureClientSecretAccessTokenProvider({
              tenantId: required(env, 'AZURE_TENANT_ID'),
              clientId: required(env, 'AZURE_CLIENT_ID'),
              clientSecret: required(env, 'AZURE_CLIENT_SECRET'),
            });
            const signingKey = new AzureKeyVaultSigningKeyPort({
              client: new AzureKeyVaultRestClient({
                vaultUrl: `https://${vaultName}.vault.azure.net`,
                accessTokenProvider: tokenProvider,
              }),
            });
            const repository = createZatcaFiscalizationRepository(options.prisma);
            const sealer = createZatcaSimplifiedInvoiceSealer({
              canonicalizer: new Libxml2ZatcaCanonicalizer(),
              signingKey,
              csidBindings: createZatcaCsidBindingRepository(options.prisma),
              trustedAnchorSha256Hex: trustAnchors(required(env, 'ZATCA_TRUST_ANCHOR_SHA256_HEX')),
            });
            return createCheckoutFiscalizationPort({ repository, sealer });
          }

          function required(env: NodeJS.ProcessEnv, key: string): string {
            const value = env[key];
            if (value === undefined || value.trim() === '') {
              throw new ZatcaInvoiceError(`${key} is required for production ZATCA fiscalization.`);
            }
            if (value !== value.trim()) {
              throw new ZatcaInvoiceError(`${key} must not contain surrounding whitespace.`);
            }
            return value;
          }

          function trustAnchors(value: string): readonly string[] {
            const anchors = value.split(',').map((entry) => entry.trim().toLowerCase());
            if (anchors.length === 0 || anchors.some((entry) => !/^[0-9a-f]{64}$/.test(entry))) {
              throw new ZatcaInvoiceError(
                'ZATCA_TRUST_ANCHOR_SHA256_HEX must contain comma-separated SHA-256 hex fingerprints.',
              );
            }
            return [...new Set(anchors)];
          }
          '''
          Path('apps/api/src/zatca/checkout-fiscalization-infrastructure.ts').write_text(infra, encoding='utf-8')

          service_path = Path('apps/api/src/checkout/service.ts')
          service = service_path.read_text(encoding='utf-8')
          service = service.replace(
              "import { fingerprintIntent } from './fingerprint.js';\n",
              "import { fingerprintIntent } from './fingerprint.js';\nimport type { CheckoutFiscalizationPort } from '../zatca/fiscalize-checkout.js';\n",
              1,
          )
          service = service.replace(
              "  IdempotencyRepository,\n",
              "  IdempotencyRepository,\n  InvoiceRecord,\n",
              1,
          )
          service = service.replace(
              "  readonly audit: AuditRepository;\n  readonly now?: () => Date;\n",
              "  readonly audit: AuditRepository;\n  readonly fiscalization?: CheckoutFiscalizationPort;\n  readonly now?: () => Date;\n",
              1,
          )
          old = '''    const invoice = await deps.sales.invoiceForSale(scope, existing.id);
              return {
                outcome: 'success',
                replayed: true,
                sale: summarise(existing, invoice?.invoiceNumber ?? '', displayName),
              };'''
          new = '''    const invoice = await deps.sales.invoiceForSale(scope, existing.id);
              if (invoice === null) throw new Error('Finalized checkout is missing its durable invoice.');
              await fiscalize(scope, existing, invoice);
              return {
                outcome: 'success',
                replayed: true,
                sale: summarise(existing, invoice.invoiceNumber, displayName),
              };'''
          if old not in service:
              raise SystemExit('resolveCompetingOperation invoice block not found')
          service = service.replace(old, new, 1)
          old = '''        const invoice = await deps.sales.invoiceForSale(scope, existing.id);
                return {
                  outcome: 'success',
                  replayed: true,
                  sale: summarise(existing, invoice?.invoiceNumber ?? '', input.principal.displayName),
                };'''
          new = '''        const invoice = await deps.sales.invoiceForSale(scope, existing.id);
                if (invoice === null) throw new Error('Finalized checkout is missing its durable invoice.');
                await fiscalize(scope, existing, invoice);
                return {
                  outcome: 'success',
                  replayed: true,
                  sale: summarise(existing, invoice.invoiceNumber, input.principal.displayName),
                };'''
          if old not in service:
              raise SystemExit('preflight replay invoice block not found')
          service = service.replace(old, new, 1)
          service = service.replace(
              "  return {\n    async checkout(input: CheckoutInput): Promise<CheckoutResult> {\n",
              "  async function fiscalize(\n    scope: TenantScope,\n    sale: SaleRecord,\n    invoice: InvoiceRecord,\n  ): Promise<void> {\n    if (deps.fiscalization !== undefined) {\n      await deps.fiscalization.fiscalize(scope, sale, invoice);\n    }\n  }\n\n  return {\n    async checkout(input: CheckoutInput): Promise<CheckoutResult> {\n",
              1,
          )
          service = service.replace(
              "      const invoice = await deps.sales.invoiceForSale(scope, recorded.id);\n\n      // Outside the transaction",
              "      const invoice = await deps.sales.invoiceForSale(scope, recorded.id);\n      if (invoice === null) throw new Error('Finalized checkout is missing its durable invoice.');\n\n      // Outside the transaction",
              1,
          )
          old = '''      return {
                outcome: 'success',
                replayed: false,
                sale: summarise(recorded, invoice?.invoiceNumber ?? '', input.principal.displayName),
              };'''
          new = '''      await fiscalize(scope, recorded, invoice);

              return {
                outcome: 'success',
                replayed: false,
                sale: summarise(recorded, invoice.invoiceNumber, input.principal.displayName),
              };'''
          if old not in service:
              raise SystemExit('fresh return block not found')
          service = service.replace(old, new, 1)
          service_path.write_text(service, encoding='utf-8')

          server_path = Path('apps/api/src/server.ts')
          server = server_path.read_text(encoding='utf-8')
          server = server.replace(
              "import { createMerchantZatcaService } from './zatca/merchant-service.js';\n",
              "import { createMerchantZatcaService } from './zatca/merchant-service.js';\nimport { createProductionCheckoutFiscalization } from './zatca/checkout-fiscalization-infrastructure.js';\n",
              1,
          )
          server = server.replace(
              "    const audit = createAuditRepository(prisma);\n    built = {\n",
              "    const audit = createAuditRepository(prisma);\n    const sales = createSaleRepository(prisma);\n    const fiscalization = config.isProduction\n      ? createProductionCheckoutFiscalization({ prisma })\n      : undefined;\n    built = {\n",
              1,
          )
          server = server.replace(
              "        sales: createSaleRepository(prisma),\n        idempotency,\n        audit,\n",
              "        sales,\n        idempotency,\n        audit,\n        ...(fiscalization === undefined ? {} : { fiscalization }),\n",
              1,
          )
          server_path.write_text(server, encoding='utf-8')

          test_path = Path('apps/api/src/__tests__/checkout-service.test.ts')
          test = test_path.read_text(encoding='utf-8')
          test = test.replace(
              "let counter: number;\n",
              "let counter: number;\nlet fiscalizedInvoiceIds: string[];\nlet fiscalizationFailures: number;\n",
              1,
          )
          test = test.replace(
              "  counter = 0;\n  service = createCheckoutService({\n",
              "  counter = 0;\n  fiscalizedInvoiceIds = [];\n  fiscalizationFailures = 0;\n  service = createCheckoutService({\n",
              1,
          )
          test = test.replace(
              "    audit: memoryAuditRepository(store),\n    now: () => new Date('2026-08-12T09:00:00.000Z'),\n",
              "    audit: memoryAuditRepository(store),\n    fiscalization: {\n      fiscalize: async (_scope, _sale, invoice) => {\n        fiscalizedInvoiceIds.push(invoice.id);\n        if (fiscalizationFailures > 0) {\n          fiscalizationFailures -= 1;\n          throw new Error('fiscalization unavailable');\n        }\n      },\n    },\n    now: () => new Date('2026-08-12T09:00:00.000Z'),\n",
              1,
          )
          marker = "describe('idempotency', () => {\n"
          insert = r'''describe('fiscal checkout wiring', () => {
            it('fiscalizes the same durable invoice on fresh checkout and exact replay', async () => {
              const first = await checkout();
              const second = await checkout();
              if (first.outcome !== 'success' || second.outcome !== 'success') {
                throw new Error('expected success');
              }

              expect(store.invoices).toHaveLength(1);
              expect(fiscalizedInvoiceIds).toEqual([store.invoices[0]?.id, store.invoices[0]?.id]);
              expect(second.replayed).toBe(true);
              expect(second.sale.saleId).toBe(first.sale.saleId);
            });

            it('keeps the sale durable when fiscalization fails and resumes it on replay', async () => {
              fiscalizationFailures = 1;
              await expect(checkout()).rejects.toThrow('fiscalization unavailable');

              expect(store.sales).toHaveLength(1);
              expect(store.invoices).toHaveLength(1);
              expect(store.movements).toHaveLength(1);

              const replay = await checkout();
              if (replay.outcome !== 'success') throw new Error(replay.reason);
              expect(replay.replayed).toBe(true);
              expect(store.sales).toHaveLength(1);
              expect(store.invoices).toHaveLength(1);
              expect(fiscalizedInvoiceIds).toEqual([store.invoices[0]?.id, store.invoices[0]?.id]);
            });
          });

          '''
          if marker not in test:
              raise SystemExit('idempotency marker not found')
          test = test.replace(marker, insert + marker, 1)
          test_path.write_text(test, encoding='utf-8')

          orchestrator_test = r'''import { describe, expect, it } from 'vitest';
          import { tenantId, type InvoiceRecord, type SaleRecord, type ZatcaDurableFiscalization } from '@korvi/domain';
          import { createCheckoutFiscalizationPort } from '../zatca/fiscalize-checkout.js';
          import type { ZatcaSimplifiedInvoiceSealer } from '../zatca/seal-simplified-invoice.js';

          const tenant = tenantId('018f1000-0000-7000-8000-00000000000a');
          const terminal = '018f1000-0000-7000-8000-0000000000a2';
          const invoiceId = '018f1000-0000-7000-8000-0000000000b1';
          const saleId = '018f1000-0000-7000-8000-0000000000b2';
          const seller = {
            registrationName: 'Korvi Merchant',
            vatRegistrationNumber: '300000000000003',
            legalId: '1010123456',
            legalIdScheme: 'CRN' as const,
            streetName: 'King Road',
            buildingNumber: '1234',
            citySubdivisionName: 'Olaya',
            cityName: 'Riyadh',
            postalZone: '12345',
            countryCode: 'SA' as const,
          };
          const sale = {
            id: saleId,
            tenantId: tenant,
            terminalId: terminal,
            status: 'finalized',
            issuedAt: '2026-09-17T12:00:00.500Z',
          } as SaleRecord;
          const invoice = {
            id: invoiceId,
            tenantId: tenant,
            saleId,
            invoiceType: 'simplified',
          } as InvoiceRecord;

          describe('checkout fiscalization orchestration', () => {
            it('reserves, seals, persists once, then reuses the sealed artifact', async () => {
              let durable: ZatcaDurableFiscalization | null = null;
              let reserveCalls = 0;
              let sealerCalls = 0;
              let persistCalls = 0;
              const repository = {
                readSellerProfile: async () => seller,
                upsertSellerProfile: async () => seller,
                findByInvoice: async () => durable,
                reserve: async () => {
                  reserveCalls += 1;
                  durable = {
                    scope: { tenantId: tenant },
                    invoiceId,
                    terminalId: terminal,
                    invoiceCounterValue: '41',
                    previousInvoiceHash: 'YWJjZA==',
                    seller,
                    reservedAt: '2026-09-17T12:00:01Z',
                    state: 'reserved',
                  };
                  return durable;
                },
                seal: async (_scope, input) => {
                  persistCalls += 1;
                  durable = {
                    scope: { tenantId: tenant },
                    invoiceId,
                    terminalId: terminal,
                    invoiceCounterValue: '41',
                    previousInvoiceHash: 'YWJjZA==',
                    seller,
                    reservedAt: '2026-09-17T12:00:01Z',
                    state: 'sealed',
                    invoiceHash: Uint8Array.from(input.invoiceHash),
                    sealedInvoiceXml: Uint8Array.from(input.sealedInvoiceXml),
                    qrCodeBase64: input.qrCodeBase64,
                    signatureValueBase64: input.signatureValueBase64,
                    sealedAt: input.sealedAt,
                  };
                  return durable;
                },
              };
              const sealer: ZatcaSimplifiedInvoiceSealer = {
                seal: async (input) => {
                  sealerCalls += 1;
                  expect(input.invoice.invoiceCounterValue).toBe('41');
                  expect(input.invoice.previousInvoiceHash).toBe('YWJjZA==');
                  return {
                    xml: '<Invoice>sealed</Invoice>',
                    invoiceHashBase64: 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=',
                    invoiceHash: new Uint8Array(32),
                    qrCodeBase64: 'cXI=',
                    signatureValueBase64: 'c2ln',
                    signingPublicKeySpkiDer: new Uint8Array([1]),
                    technicalCaSignatureDer: new Uint8Array([2]),
                    trustAnchorSha256Hex: '0'.repeat(64),
                  };
                },
              };
              const fiscalization = createCheckoutFiscalizationPort({
                repository,
                sealer,
                now: () => new Date('2026-09-17T12:00:01.900Z'),
              });

              await fiscalization.fiscalize({ tenantId: tenant }, sale, invoice);
              await fiscalization.fiscalize({ tenantId: tenant }, sale, invoice);

              expect(reserveCalls).toBe(1);
              expect(sealerCalls).toBe(1);
              expect(persistCalls).toBe(1);
              expect(durable?.state).toBe('sealed');
            });
          });
          '''
          Path('apps/api/src/__tests__/zatca-checkout-fiscalization.test.ts').write_text(orchestrator_test, encoding='utf-8')
          PY

      - name: Format changed source
        run: npx prettier --write apps/api/src/zatca/fiscalize-checkout.ts apps/api/src/zatca/checkout-fiscalization-infrastructure.ts apps/api/src/checkout/service.ts apps/api/src/server.ts apps/api/src/__tests__/checkout-service.test.ts apps/api/src/__tests__/zatca-checkout-fiscalization.test.ts

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Build domain and database dependencies
        run: |
          npm run build -w @korvi/domain
          npm run build -w @korvi/database

      - name: Typecheck API
        run: npm run typecheck -w @korvi/api

      - name: Run targeted fiscal checkout tests
        run: npx vitest run apps/api/src/__tests__/checkout-service.test.ts apps/api/src/__tests__/zatca-checkout-fiscalization.test.ts

      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/zatca/fiscalize-checkout.ts \
            apps/api/src/zatca/checkout-fiscalization-infrastructure.ts \
            apps/api/src/checkout/service.ts \
            apps/api/src/server.ts \
            apps/api/src/__tests__/checkout-service.test.ts \
            apps/api/src/__tests__/zatca-checkout-fiscalization.test.ts
          git commit -m "feat(zatca): wire finalized checkout into durable sealing"
          git push origin HEAD:strike/product-routing-p0
