name: Scratch Fastify Refresh Proof

on:
  push:
    branches:
      - scratch/zatca39-fastify-refresh-20260911
    paths:
      - '.github/workflows/scratch-fastify-refresh.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-and-verify:
    name: Generate exact Fastify refresh and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out exact scratch commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify package manager
        run: node scripts/verify-package-manager.mjs

      - name: Install exact current lockfile
        run: npm ci --registry=https://registry.npmjs.org

      - name: Refresh Fastify exactly
        run: npm install -w @korvi/api fastify@5.12.4 --save-exact --registry=https://registry.npmjs.org

      - name: Format Evidence slice
        run: npx --no-install prettier --write packages/database/src/zatca/compliance-evidence-repository.ts packages/domain/src/ports/zatca-compliance-evidence.ts

      - name: Assert refresh scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain=v1 | awk '{print $2}' | sort)"
          expected=$'apps/api/package.json\npackage-lock.json\npackages/database/src/zatca/compliance-evidence-repository.ts\npackages/domain/src/ports/zatca-compliance-evidence.ts'
          printf 'Changed paths:\n%s\n' "$changed"
          test "$changed" = "$expected"
          grep -F '"fastify": "5.12.4"' apps/api/package.json

      - name: Full verification
        run: npm run verify

      - name: Diff integrity
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git status --porcelain=v1 | awk '{print $2}' | sort)"
          expected=$'apps/api/package.json\npackage-lock.json\npackages/database/src/zatca/compliance-evidence-repository.ts\npackages/domain/src/ports/zatca-compliance-evidence.ts'
          test "$changed" = "$expected"

      - name: Preserve generated permanent files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zatca39-final-files-${{ github.sha }}
          path: |
            apps/api/package.json
            package-lock.json
            packages/database/src/zatca/compliance-evidence-repository.ts
            packages/domain/src/ports/zatca-compliance-evidence.ts
          if-no-files-found: error
          retention-days: 1
