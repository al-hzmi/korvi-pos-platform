name: V2-5 One-Shot ADR Format
on:
  push:
    branches:
      - mastermind/v2-strengthening
    paths:
      - .github/workflows/v2-5-oneshot-adr-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: mastermind/v2-strengthening
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install exact lockfile
        run: npm ci --registry=https://registry.npmjs.org
      - name: Apply canonical formatter and self-delete
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install prettier --write docs/decisions/ADR-0040-restaurant-modifier-authority.md
          rm .github/workflows/v2-5-oneshot-adr-format.yml
          git diff --check
      - name: Commit exact formatter output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "korvi-v2-5-format"
          git config user.email "actions@users.noreply.github.com"
          git add docs/decisions/ADR-0040-restaurant-modifier-authority.md .github/workflows/v2-5-oneshot-adr-format.yml
          git commit -m "style(v2-5): format restaurant modifier ADR"
          git pull --rebase origin mastermind/v2-strengthening
          git push origin HEAD:mastermind/v2-strengthening
