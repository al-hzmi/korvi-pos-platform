name: Gate 45 Implementation Helper

on:
  push:
    branches:
      - review/offline-45-reconciliation

permissions:
  contents: write

jobs:
  implement:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out Gate 45 branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: review/offline-45-reconciliation
          fetch-depth: 1
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install exact lockfile
        run: npm ci --registry=https://registry.npmjs.org
      - name: Apply Gate 45 production patch
        run: python .github/scripts/gate45-implement.py
      - name: Format and validate patch
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install prettier --write \
            apps/api/src/checkout/service.ts \
            apps/api/src/routes/business.ts \
            apps/api/src/routes/validation.ts \
            apps/pos-web/src/lib/api-types.ts \
            apps/pos-web/src/lib/api.ts \
            apps/pos-web/src/lib/checkout-flight.ts \
            apps/pos-web/src/lib/checkout.ts \
            apps/pos-web/src/lib/checkout-submit.ts \
            apps/pos-web/src/lib/offline-store.ts \
            apps/pos-web/src/lib/offline-checkout.ts \
            apps/pos-web/src/lib/checkout-sync-executor.ts \
            apps/pos-web/src/hooks/use-checkout.ts \
            apps/pos-web/src/hooks/use-offline-sale-sync.ts \
            apps/pos-web/src/components/cashier-screen.tsx \
            apps/pos-web/src/lib/__tests__/checkout-sync-executor.test.ts \
            apps/pos-web/src/lib/__tests__/offline-checkout.test.ts
          git diff --check
      - name: Commit production source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api apps/pos-web
          git diff --cached --quiet && { echo 'No Gate 45 source diff.'; exit 1; }
          git commit -m 'feat(offline): wire durable checkout reconciliation'
          git push origin HEAD:review/offline-45-reconciliation
