          old_catch = """    .catch((error: unknown) => {\n      const failure = describeFailure(error);\n      if (failure.action === 'reauthenticate') {\n        flight.reset();\n        onUnauthenticated();\n        return;\n      }\n      flight.settle(outcomeFor(failure.action));\n      dispatch({ type: 'failed', failure });\n    });\n"""
          new_catch = """    .catch(async (error: unknown) => {\n      const failure = describeFailure(error);\n      if (failure.action === 'reauthenticate') {\n        flight.reset();\n        onUnauthenticated();\n        return;\n      }\n      if (failure.action === 'retry-same' && queueAmbiguous !== undefined) {\n        try {\n          // The queue receives the exact intent that may have reached the server.\n          // Only a completed durable write transfers ownership away from this flight.\n          await queueAmbiguous(intent);\n          flight.reset();\n          dispatch({ type: 'queued', intent });\n          return;\n        } catch {\n          // Losing IndexedDB after losing the network is the one case where the\n          // till must stay locked: unlocking would lose a possibly-committed sale.\n          flight.settle('ambiguous');\n          dispatch({ type: 'failed', failure: OFFLINE_QUEUE_UNAVAILABLE });\n          return;\n        }\n      }\n      flight.settle(outcomeFor(failure.action));\n      dispatch({ type: 'failed', failure });\n    });\n"""
