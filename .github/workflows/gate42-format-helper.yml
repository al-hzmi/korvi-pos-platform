name: Gate 42 Format Helper

on:
  push:
    branches:
      - review/offline-42-indexeddb

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: review/offline-42-indexeddb
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install exact lockfile
        run: npm ci --registry=https://registry.npmjs.org
      - name: Format Gate 42 files and remove helper
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write \
            apps/pos-web/src/components/cashier-screen.tsx \
            apps/pos-web/src/hooks/use-durable-sale-draft.ts \
            apps/pos-web/src/hooks/use-product-search.ts \
            apps/pos-web/src/lib/cart.ts \
            apps/pos-web/src/lib/offline-search-source.ts \
            apps/pos-web/src/lib/offline-store.ts \
            apps/pos-web/src/lib/__tests__/offline-store.test.ts \
            scripts/gate42-browser/index.html \
            scripts/gate42-browser/main.ts \
            scripts/gate42-indexeddb-proof.mjs \
            .github/workflows/gate-42-indexeddb-proof.yml
          git rm .github/workflows/gate42-format-helper.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            apps/pos-web/src/components/cashier-screen.tsx \
            apps/pos-web/src/hooks/use-durable-sale-draft.ts \
            apps/pos-web/src/hooks/use-product-search.ts \
            apps/pos-web/src/lib/cart.ts \
            apps/pos-web/src/lib/offline-search-source.ts \
            apps/pos-web/src/lib/offline-store.ts \
            apps/pos-web/src/lib/__tests__/offline-store.test.ts \
            scripts/gate42-browser/index.html \
            scripts/gate42-browser/main.ts \
            scripts/gate42-indexeddb-proof.mjs \
            .github/workflows/gate-42-indexeddb-proof.yml
          git diff --cached --check
          git commit -m 'style(offline): format Gate 42 implementation'
          git push origin HEAD:review/offline-42-indexeddb
