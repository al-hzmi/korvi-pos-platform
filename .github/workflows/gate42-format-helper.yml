name: Gate 42 Format Helper

on:
  push:
    branches:
      - review/offline-42-indexeddb

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install exact lockfile
        run: npm ci --registry=https://registry.npmjs.org
      - name: Format Gate 42 files
        run: |
          npx prettier --write \
            apps/pos-web/src/components/cashier-screen.tsx \
            apps/pos-web/src/hooks/use-durable-sale-draft.ts \
            apps/pos-web/src/hooks/use-product-search.ts \
            apps/pos-web/src/lib/cart.ts \
            apps/pos-web/src/lib/offline-search-source.ts \
            apps/pos-web/src/lib/offline-store.ts \
            apps/pos-web/src/lib/__tests__/offline-store.test.ts \
            scripts/gate42-browser/index.html \
            scripts/gate42-browser/main.ts \
            scripts/gate42-indexeddb-proof.mjs \
            .github/workflows/gate-42-indexeddb-proof.yml
      - name: Upload formatted sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate42-formatted-sources-${{ github.sha }}
          path: |
            apps/pos-web/src/components/cashier-screen.tsx
            apps/pos-web/src/hooks/use-durable-sale-draft.ts
            apps/pos-web/src/hooks/use-product-search.ts
            apps/pos-web/src/lib/cart.ts
            apps/pos-web/src/lib/offline-search-source.ts
            apps/pos-web/src/lib/offline-store.ts
            apps/pos-web/src/lib/__tests__/offline-store.test.ts
            scripts/gate42-browser/index.html
            scripts/gate42-browser/main.ts
            scripts/gate42-indexeddb-proof.mjs
            .github/workflows/gate-42-indexeddb-proof.yml
          retention-days: 1
