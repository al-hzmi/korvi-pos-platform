name: War Room Offline Cashier Shell Repair

on:
  push:
    branches:
      - warroom/offline-full-shift
    paths:
      - .github/workflows/warroom-offline-shell-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact offline lane
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: warroom/offline-full-shift
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact graph
        run: npm ci --registry=https://registry.npmjs.org

      - name: Move shell authority to dedicated cashier route
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          sw = Path('apps/pos-web/public/sw.js')
          text = sw.read_text()
          old = "const SHELL_PATH = '/';"
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one root shell constant')
          sw.write_text(text.replace(old, "const SHELL_PATH = '/cashier';"))

          proof = Path('scripts/browser-offline-shell-proof.mjs')
          text = proof.read_text()
          replacements = {
              'createTarget(`${baseUrl}/`)': 'createTarget(`${baseUrl}/cashier`)',
              "url.pathname === '/'": "url.pathname === '/cashier'",
              'waitForServerDown(`${baseUrl}/`)': 'waitForServerDown(`${baseUrl}/cashier`)',
              '`${baseUrl}/?gate41-offline-proof=${Date.now().toString(10)}`': '`${baseUrl}/cashier?gate41-offline-proof=${Date.now().toString(10)}`',
              "url.pathname === '/';": "url.pathname === '/cashier';",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected Gate 41 proof fragment: {old}')
              text = text.replace(old, new)
          proof.write_text(text)

          workflow = Path('.github/workflows/gate-41-offline-shell-proof.yml')
          text = workflow.read_text()
          old = "    branches:\n      - review/offline-41-service-worker\n"
          new = "    branches:\n      - review/offline-41-service-worker\n      - warroom/offline-full-shift\n      - strike/product-routing-p0\n"
          if text.count(old) != 1:
              raise SystemExit('Expected Gate 41 push branch block once')
          text = text.replace(old, new)
          old = 'curl --fail --silent http://127.0.0.1:3000/ >/dev/null'
          new = 'curl --fail --silent http://127.0.0.1:3000/cashier >/dev/null'
          if text.count(old) != 1:
              raise SystemExit('Expected Gate 41 readiness root exactly once')
          workflow.write_text(text.replace(old, new))
          PY
          npm exec prettier -- --write scripts/browser-offline-shell-proof.mjs .github/workflows/gate-41-offline-shell-proof.yml
          git diff --check
          grep -Fq "const SHELL_PATH = '/cashier';" apps/pos-web/public/sw.js
          if grep -Fq "const SHELL_PATH = '/';" apps/pos-web/public/sw.js; then
            echo 'Root shell authority still present.' >&2
            exit 1
          fi

      - name: Commit cashier-only shell repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/warroom-offline-shell-repair.yml
          git config user.name 'korvi-release-integrator'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/pos-web/public/sw.js scripts/browser-offline-shell-proof.mjs .github/workflows/gate-41-offline-shell-proof.yml .github/workflows/warroom-offline-shell-repair.yml
          git diff --cached --check
          git commit -m 'fix(offline): cache dedicated cashier shell'
          git push origin HEAD:warroom/offline-full-shift
