name: One-shot Stage 5D Input Hardening

on:
  push:
    branches:
      - review/operations-50-production-readiness
    paths:
      - .github/workflows/one-shot-harden-stage5d-input.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact triggering revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: review/operations-50-production-readiness
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact lockfile without package scripts
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org

      - name: Harden real CDP pointer input after scroll
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('scripts/browser-stage5d-proof.mjs')
          source = path.read_text()

          replacements = [
              (
                  """async function pointForButton(text) {\n  const value = await evaluate(`(() => {\n    const button = [...document.querySelectorAll('button')].find((candidate) =>\n      (${normalizedTextExpression(text)})(candidate.textContent ?? '') && !candidate.disabled\n    );\n    if (!(button instanceof HTMLElement)) return null;\n    button.scrollIntoView({ block: 'center', inline: 'center', behavior: 'auto' });\n    const rect = button.getBoundingClientRect();\n    const point = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };\n    if (rect.width <= 0 || rect.height <= 0 || point.x < 0 || point.y < 0 || point.x > innerWidth || point.y > innerHeight) return null;\n    return point;\n  })()`);\n  if (value === null || value === undefined) throw new Error(`Enabled button not found: ${text}`);\n  return value;\n}\n""",
                  """async function pointForButton(text) {\n  const value = await evaluate(`(async () => {\n    const button = [...document.querySelectorAll('button')].find((candidate) =>\n      (${normalizedTextExpression(text)})(candidate.textContent ?? '') && !candidate.disabled\n    );\n    if (!(button instanceof HTMLElement)) return null;\n    button.scrollIntoView({ block: 'center', inline: 'center', behavior: 'auto' });\n    await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));\n    if (!button.isConnected || button.disabled) return null;\n    const rect = button.getBoundingClientRect();\n    const point = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };\n    if (rect.width <= 0 || rect.height <= 0 || point.x < 0 || point.y < 0 || point.x > innerWidth || point.y > innerHeight) return null;\n    const hit = document.elementFromPoint(point.x, point.y);\n    if (hit === null || (hit !== button && !button.contains(hit))) return null;\n    return point;\n  })()`);\n  if (value === null || value === undefined) throw new Error(`Enabled button not found or not hit-testable: ${text}`);\n  return value;\n}\n""",
              ),
              (
                  """async function pointForLabel(text) {\n  const value = await evaluate(`(() => {\n    const label = [...document.querySelectorAll('label')].find((candidate) =>\n      (candidate.textContent ?? '').replace(/\\\\s+/g, ' ').includes(${js(text)})\n    );\n    if (!(label instanceof HTMLElement)) return null;\n    label.scrollIntoView({ block: 'center', inline: 'center', behavior: 'auto' });\n    const rect = label.getBoundingClientRect();\n    const point = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };\n    if (rect.width <= 0 || rect.height <= 0 || point.x < 0 || point.y < 0 || point.x > innerWidth || point.y > innerHeight) return null;\n    return point;\n  })()`);\n  if (value === null || value === undefined) throw new Error(`Label not found: ${text}`);\n  return value;\n}\n""",
                  """async function pointForLabel(text) {\n  const value = await evaluate(`(async () => {\n    const label = [...document.querySelectorAll('label')].find((candidate) =>\n      (candidate.textContent ?? '').replace(/\\\\s+/g, ' ').includes(${js(text)})\n    );\n    if (!(label instanceof HTMLElement)) return null;\n    label.scrollIntoView({ block: 'center', inline: 'center', behavior: 'auto' });\n    await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));\n    if (!label.isConnected) return null;\n    const rect = label.getBoundingClientRect();\n    const point = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };\n    if (rect.width <= 0 || rect.height <= 0 || point.x < 0 || point.y < 0 || point.x > innerWidth || point.y > innerHeight) return null;\n    const hit = document.elementFromPoint(point.x, point.y);\n    if (hit === null || (hit !== label && !label.contains(hit))) return null;\n    return point;\n  })()`);\n  if (value === null || value === undefined) throw new Error(`Label not found or not hit-testable: ${text}`);\n  return value;\n}\n""",
              ),
              (
                  """async function pointForAriaPrefix(prefix, selector = 'input') {\n  const value = await evaluate(`(() => {\n    const element = [...document.querySelectorAll(${js(selector)})].find((candidate) =>\n      (candidate.getAttribute('aria-label') ?? '').startsWith(${js(prefix)}) && !candidate.disabled\n    );\n    if (!(element instanceof HTMLElement)) return null;\n    element.scrollIntoView({ block: 'center', inline: 'center', behavior: 'auto' });\n    const rect = element.getBoundingClientRect();\n    const point = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };\n    if (rect.width <= 0 || rect.height <= 0 || point.x < 0 || point.y < 0 || point.x > innerWidth || point.y > innerHeight) return null;\n    return point;\n  })()`);\n  if (value === null || value === undefined) throw new Error(`ARIA element not found: ${prefix}`);\n  return value;\n}\n""",
                  """async function pointForAriaPrefix(prefix, selector = 'input') {\n  const value = await evaluate(`(async () => {\n    const element = [...document.querySelectorAll(${js(selector)})].find((candidate) =>\n      (candidate.getAttribute('aria-label') ?? '').startsWith(${js(prefix)}) && !candidate.disabled\n    );\n    if (!(element instanceof HTMLElement)) return null;\n    element.scrollIntoView({ block: 'center', inline: 'center', behavior: 'auto' });\n    await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));\n    if (!element.isConnected || element.disabled) return null;\n    const rect = element.getBoundingClientRect();\n    const point = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };\n    if (rect.width <= 0 || rect.height <= 0 || point.x < 0 || point.y < 0 || point.x > innerWidth || point.y > innerHeight) return null;\n    const hit = document.elementFromPoint(point.x, point.y);\n    if (hit === null || (hit !== element && !element.contains(hit))) return null;\n    return point;\n  })()`);\n  if (value === null || value === undefined) throw new Error(`ARIA element not found or not hit-testable: ${prefix}`);\n  return value;\n}\n""",
              ),
              (
                  """async function mouseClickPoint(point) {\n  await cdp.send('Input.dispatchMouseEvent', {\n    type: 'mousePressed',\n""",
                  """async function mouseClickPoint(point) {\n  await cdp.send('Input.dispatchMouseEvent', {\n    type: 'mouseMoved',\n    x: point.x,\n    y: point.y,\n    button: 'none',\n  });\n  await cdp.send('Input.dispatchMouseEvent', {\n    type: 'mousePressed',\n""",
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one source match, found {count}.')
              source = source.replace(old, new)

          path.write_text(source)
          PY

      - name: Format and verify the exact proof source
        run: |
          npx prettier --write scripts/browser-stage5d-proof.mjs
          npx prettier --check scripts/browser-stage5d-proof.mjs
          git diff --check

      - name: Commit only the hardened proof source
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          if [ "$changed" != 'scripts/browser-stage5d-proof.mjs' ]; then
            echo "Unexpected changed paths:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi
          git config user.name 'korvi-release-bot'
          git config user.email 'korvi-release-bot@users.noreply.github.com'
          git add scripts/browser-stage5d-proof.mjs
          git commit -m 'test(browser): stabilize CDP pointer hit testing'
          git push origin HEAD:review/operations-50-production-readiness
