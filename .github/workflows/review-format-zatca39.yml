name: Review Format ZATCA 39

on:
  push:
    branches: [review/zatca-39-sealing-authority]
    paths: [.github/workflows/review-format-zatca39.yml]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: |
          set -euo pipefail
          node scripts/verify-package-manager.mjs
          npm ci --registry=https://registry.npmjs.org
          npx --no-install prettier --write \
            packages/domain/src/ports/zatca.ts \
            packages/domain/src/zatca/__tests__/tlv.test.ts
          rm .github/workflows/review-format-zatca39.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            packages/domain/src/ports/zatca.ts \
            packages/domain/src/zatca/__tests__/tlv.test.ts \
            .github/workflows/review-format-zatca39.yml
          git commit -m 'chore(review): format ZATCA 39 foundation'
          git push origin HEAD:review/zatca-39-sealing-authority
