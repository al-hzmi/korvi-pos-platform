name: Gate 43 Hardening Helper

on:
  push:
    branches:
      - review/offline-43-ordered-queue-run

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: review/offline-43-ordered-queue-run

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact lockfile
        run: npm ci --registry=https://registry.npmjs.org

      - name: Harden canonical queue payload and regression proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          store = Path('apps/pos-web/src/lib/offline-store.ts')
          text = store.read_text()
          old = "return `[${value.map((entry) => canonicalJson(entry, seen)).join(',')}]`;"
          if old in text:
              replacement = """const entries: string[] = [];
              for (let index = 0; index < value.length; index += 1) {
                if (!Object.prototype.hasOwnProperty.call(value, index)) {
                  throw new OfflineStoreError(
                    'corrupt',
                    'Queue payload arrays cannot contain holes.',
                  );
                }
                entries.push(canonicalJson(value[index], seen));
              }
              return `[${entries.join(',')}]`;"""
              store.write_text(text.replace(old, replacement, 1))
          elif 'Queue payload arrays cannot contain holes.' not in text:
              raise SystemExit('canonical array implementation is neither original nor hardened')

          tests = Path('apps/pos-web/src/lib/__tests__/offline-store.test.ts')
          text = tests.read_text()
          marker = "const sparse = new Array<unknown>(2);"
          if marker not in text:
              anchor = "expect(() => serializeQueuePayload({ value: undefined })).toThrow(OfflineStoreError);"
              if anchor not in text:
                  raise SystemExit('queue payload regression anchor did not match expected source')
              addition = """expect(() => serializeQueuePayload({ value: undefined })).toThrow(OfflineStoreError);
              const sparse = new Array<unknown>(2);
              sparse[1] = 'present';
              expect(() => serializeQueuePayload(sparse)).toThrow(OfflineStoreError);"""
              tests.write_text(text.replace(anchor, addition, 1))
          PY

      - name: Format exact Gate 43 source files
        run: |
          npx prettier --write \
            packages/domain/src/ports/offline.ts \
            apps/pos-web/src/lib/offline-store.ts \
            apps/pos-web/src/lib/__tests__/offline-store.test.ts \
            scripts/gate43-browser/index.html \
            scripts/gate43-browser/main.ts \
            scripts/gate43-queue-proof.mjs

      - name: Commit source-only hardening when needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            packages/domain/src/ports/offline.ts \
            apps/pos-web/src/lib/offline-store.ts \
            apps/pos-web/src/lib/__tests__/offline-store.test.ts \
            scripts/gate43-browser/index.html \
            scripts/gate43-browser/main.ts \
            scripts/gate43-queue-proof.mjs
          if git diff --cached --quiet; then
            echo 'Gate 43 source files are already hardened and formatted.'
            exit 0
          fi
          git commit -m 'fix(offline): harden durable queue encoding and formatting'
          git push origin HEAD:review/offline-43-ordered-queue-run
