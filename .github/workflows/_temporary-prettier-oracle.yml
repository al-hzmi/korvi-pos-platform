name: Temporary Prettier Oracle

on:
  push:
    branches:
      - strike/product-routing-p0

permissions:
  contents: read

jobs:
  format-oracle:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact lockfile
        run: npm ci --registry=https://registry.npmjs.org

      - name: Print canonical workflow formatting
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write .github/workflows/installed-cashier-android-proof.yml .github/workflows/installed-cashier-windows-proof.yml
          git diff -- .github/workflows/installed-cashier-android-proof.yml .github/workflows/installed-cashier-windows-proof.yml
