name: War Room Installed Native Runner

on:
  push:
    branches:
      - strike/product-routing-p0
    paths:
      - .github/workflows/warroom-installed-native-runner.yml

permissions:
  contents: write

jobs:
  integrate-product-code:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      KORVI_NATIVE_API_ORIGIN: https://api.staging.invalid/
    steps:
      - name: Check out exact authoritative branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Restore proven cashier-only source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin warroom/installed-cashier
          git checkout origin/warroom/installed-cashier -- apps/cashier-client package-lock.json
          rm -rf apps/cashier-client/src-tauri/target

      - name: Materialize native trust implementation from reviewed integrator
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          text = Path('.github/workflows/warroom-installed-native-integrator.yml').read_text()

          def block(name: str) -> str:
              marker = f'      - name: {name}\n'
              start = text.index(marker) + len(marker)
              run_marker = '        run: |\n'
              run = text.index(run_marker, start) + len(run_marker)
              end = text.find('\n      - name:', run)
              if end == -1:
                  end = len(text)
              lines = text[run:end].splitlines()
              return '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'

          Path('/tmp/install-native.sh').write_text(block('Install native-auth transport and OS custody'))
          Path('/tmp/patch-business.py').write_text(block('Restrict server terminal discovery for native principals'))
          PY
          bash /tmp/install-native.sh
          python /tmp/patch-business.py

      - name: Install canonical dependencies and Linux Tauri prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          npm ci --registry=https://registry.npmjs.org
          npm run versions:verify

      - name: Format, build and prove host-neutral runtime
        shell: bash
        run: |
          set -euo pipefail
          npm exec prettier -- --write apps/cashier-client apps/api/src/routes/business.ts
          npm run build -w @korvi/domain
          npm run build -w @korvi/ui
          npm run typecheck -w @korvi/cashier-client
          npm run build -w @korvi/cashier-client
          cd apps/cashier-client/src-tauri
          cargo generate-lockfile
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --locked
          cd ../../..
          rm -rf apps/cashier-client/src-tauri/target
          git diff --check

      - name: Prove no browser credential fallback or management surface in native transport
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "cookie_store" apps/cashier-client/src-tauri/src apps/cashier-client/src || false
          if grep -R "cookie_store" apps/cashier-client/src-tauri/src apps/cashier-client/src; then
            echo 'Browser cookie store remains in installed transport' >&2
            exit 1
          fi
          if grep -R -E '/v1/(platform|admin)' apps/cashier-client/src apps/cashier-client/src-tauri/src; then
            echo 'Installed cashier exposes management API paths' >&2
            exit 1
          fi
          if grep -R "KORVI_NATIVE_WEB_ORIGIN" apps/cashier-client; then
            echo 'Installed cashier still depends on browser Origin authority' >&2
            exit 1
          fi
          if git ls-files --others --exclude-standard apps/cashier-client/src-tauri/target | grep -q .; then
            echo 'Rust build output leaked into integration' >&2
            exit 1
          fi

      - name: Commit product code only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json apps/cashier-client apps/api/src/routes/business.ts
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo 'Runner must never write workflows' >&2
            exit 1
          fi
          if git diff --cached --name-only | grep -q 'src-tauri/target/'; then
            echo 'target output staged' >&2
            exit 1
          fi
          git commit -m "feat(installed): bind cashier to OS device identity"
          git push origin HEAD:strike/product-routing-p0
