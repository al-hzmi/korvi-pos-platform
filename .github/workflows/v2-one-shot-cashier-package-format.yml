name: V2 One-Shot Cashier Package Format

on:
  push:
    branches:
      - mastermind/v2-strengthening
    paths:
      - .github/workflows/v2-one-shot-cashier-package-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: mastermind/v2-strengthening
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install exact lockfile
        run: npm ci --registry=https://registry.npmjs.org
      - name: Apply canonical formatter
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write \
            apps/api/src/checkout/preview-service.ts \
            apps/pos-web/src/components/cart-panel.tsx \
            apps/pos-web/src/components/cashier-screen.tsx \
            apps/pos-web/src/components/checkout-panel.tsx \
            apps/pos-web/src/components/product-panel.tsx \
            apps/pos-web/src/lib/api-types.ts \
            apps/pos-web/src/lib/api.ts \
            apps/pos-web/src/lib/cart.ts \
            apps/pos-web/src/lib/checkout-flight.ts \
            apps/pos-web/src/lib/checkout-submit.ts \
            apps/pos-web/src/lib/checkout-sync-executor.ts \
            apps/pos-web/src/lib/failures.ts \
            apps/pos-web/src/lib/offline-checkout.ts \
            apps/pos-web/src/lib/offline-store.ts
          rm .github/workflows/v2-one-shot-cashier-package-format.yml
          git diff --check
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "korvi-v2-format"
          git config user.email "actions@users.noreply.github.com"
          git add apps/api/src/checkout/preview-service.ts apps/pos-web/src/components/cart-panel.tsx apps/pos-web/src/components/cashier-screen.tsx apps/pos-web/src/components/checkout-panel.tsx apps/pos-web/src/components/product-panel.tsx apps/pos-web/src/lib/api-types.ts apps/pos-web/src/lib/api.ts apps/pos-web/src/lib/cart.ts apps/pos-web/src/lib/checkout-flight.ts apps/pos-web/src/lib/checkout-submit.ts apps/pos-web/src/lib/checkout-sync-executor.ts apps/pos-web/src/lib/failures.ts apps/pos-web/src/lib/offline-checkout.ts apps/pos-web/src/lib/offline-store.ts .github/workflows/v2-one-shot-cashier-package-format.yml
          git commit -m "style(v2-3): format package cashier workflow"
          git push origin HEAD:mastermind/v2-strengthening
