name: Format Gate 50 evidence harness

on:
  push:
    branches:
      - review/operations-50-production-readiness

permissions:
  contents: write

concurrency:
  group: format-gate50-evidence-review
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: review/operations-50-production-readiness
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact lock
        run: npm ci --registry=https://registry.npmjs.org

      - name: Apply repository Prettier contract
        run: |
          set -euo pipefail
          npx --no-install prettier --write \
            docs/operations/PRODUCTION-OPERATIONS-GATE-50.example.json \
            scripts/check-production-operations-gate50-contract.mjs \
            scripts/verify-production-operations-gate50.mjs
          npx --no-install prettier --check \
            docs/operations/PRODUCTION-OPERATIONS-GATE-50.example.json \
            scripts/check-production-operations-gate50-contract.mjs \
            scripts/verify-production-operations-gate50.mjs

      - name: Remove one-shot workflow and commit formatted result
        run: |
          set -euo pipefail
          rm -f .github/workflows/format-gate50-evidence.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'Expected formatting diff but tree is unchanged.' >&2; exit 1; }
          git commit -m 'style(ops): format Gate 50 evidence harness'
          git push origin HEAD:review/operations-50-production-readiness
