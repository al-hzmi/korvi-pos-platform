name: Mastermind V2 Format Diff

on:
  push:
    branches:
      - mastermind/v2-strengthening
    paths:
      - .github/workflows/mastermind-v2-format-diff.yml
      - apps/api/src/__tests__/no-receipt-exchange-live.test.ts
      - scripts/browser-cashier-sale-proof.mjs

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --registry=https://registry.npmjs.org

      - name: Print exact Prettier patch
        run: |
          npx --no-install prettier --write             apps/api/src/__tests__/no-receipt-exchange-live.test.ts             scripts/browser-cashier-sale-proof.mjs
          git diff --no-ext-diff --             apps/api/src/__tests__/no-receipt-exchange-live.test.ts             scripts/browser-cashier-sale-proof.mjs
