name: Strike 5C Materializer

on:
  push:
    branches:
      - strike/5c-costing-authority

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://korvi:korvi@localhost:5432/korvi_5c_schema?schema=public
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci --registry=https://registry.npmjs.org
      - name: Materialize and verify current 5C slice
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/strike-5c-bootstrap-materialize.mjs')
          source = path.read_text()
          bad = r'\\${'
          good = r'\${'
          count = source.count(bad)
          if count != 8:
              raise SystemExit(f'expected 8 over-escaped template interpolations, found {count}')
          path.write_text(source.replace(bad, good))
          PY

          node scripts/strike-5c-bootstrap-materialize.mjs

          # Extend the lazy adapter through a single, exact method anchor. Avoid
          # replacing the whole object so formatting cannot make the patch brittle.
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/api/src/server.ts')
          source = path.read_text()
          needle = '    balances: (principal, query) => resolve().balances(principal, query),\n'
          addition = needle + '    bootstrapCost: (principal, request) => resolve().bootstrapCost(principal, request),\n'
          if addition not in source:
              count = source.count(needle)
              if count != 1:
                  raise SystemExit(f'expected one lazy inventory balances anchor, found {count}')
              path.write_text(source.replace(needle, addition))
          PY

          npm run format
          npm exec -w @korvi/database -- prisma format

          allowed='^(apps/api/src/inventory/fingerprint\.ts|apps/api/src/inventory/service\.ts|apps/api/src/routes/inventory-admin\.ts|apps/api/src/server\.ts|packages/database/src/costing/bootstrap\.ts|packages/database/src/index\.ts|packages/domain/src/costing/costing\.ts|packages/domain/src/costing/__tests__/costing\.test\.ts|scripts/strike-5c-bootstrap-materialize\.mjs)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected bootstrap materializer changes:' >&2
            echo "$unexpected" >&2
            exit 1
          fi

          npm run db:generate
          npm run verify
          git diff --check
          if ! git diff --quiet; then
            git config user.name 'Korvi Validation Automation'
            git config user.email 'actions@users.noreply.github.com'
            git add \
              apps/api/src/inventory/fingerprint.ts \
              apps/api/src/inventory/service.ts \
              apps/api/src/routes/inventory-admin.ts \
              apps/api/src/server.ts \
              packages/database/src/costing/bootstrap.ts \
              packages/database/src/index.ts \
              packages/domain/src/costing/costing.ts \
              packages/domain/src/costing/__tests__/costing.test.ts \
              scripts/strike-5c-bootstrap-materialize.mjs
            git commit -m 'feat(costing): add prospective cost bootstrap authority'
            git push origin HEAD:strike/5c-costing-authority
          fi
