name: Strike 5C Materializer

on:
  push:
    branches:
      - strike/5c-costing-authority

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://korvi:korvi@localhost:5432/korvi_5c_schema?schema=public
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci --registry=https://registry.npmjs.org
      - name: Materialize and verify current 5C slice
        shell: bash
        run: |
          set -euo pipefail
          node scripts/strike-5c-bootstrap-orchestrate.mjs
          npm run format
          npm exec -w @korvi/database -- prisma format

          allowed='^(apps/api/src/__tests__/inventory-admin-routes\.test\.ts|apps/api/src/inventory/fingerprint\.ts|apps/api/src/inventory/service\.ts|apps/api/src/routes/inventory-admin\.ts|apps/api/src/server\.ts|packages/database/src/costing/bootstrap\.ts|packages/database/src/index\.ts|packages/domain/src/costing/costing\.ts|packages/domain/src/costing/__tests__/costing\.test\.ts|scripts/strike-5c-bootstrap-materialize\.mjs|scripts/strike-5c-bootstrap-orchestrate\.mjs)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected bootstrap materializer changes:' >&2
            echo "$unexpected" >&2
            exit 1
          fi

          npm run db:generate
          npm run verify
          git diff --check
          git add \
            apps/api/src/__tests__/inventory-admin-routes.test.ts \
            apps/api/src/inventory/fingerprint.ts \
            apps/api/src/inventory/service.ts \
            apps/api/src/routes/inventory-admin.ts \
            apps/api/src/server.ts \
            packages/database/src/costing/bootstrap.ts \
            packages/database/src/index.ts \
            packages/domain/src/costing/costing.ts \
            packages/domain/src/costing/__tests__/costing.test.ts \
            scripts/strike-5c-bootstrap-materialize.mjs \
            scripts/strike-5c-bootstrap-orchestrate.mjs
          if ! git diff --cached --quiet; then
            git config user.name 'Korvi Validation Automation'
            git config user.email 'actions@users.noreply.github.com'
            git commit -m 'feat(costing): add prospective cost bootstrap authority'
            git push origin HEAD:strike/5c-costing-authority
          fi
