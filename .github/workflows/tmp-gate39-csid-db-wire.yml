name: Temporary Gate39 CSID DB Wire
on:
  push:
    branches: [review/zatca-39-csid-lifecycle]
    paths: [.github/workflows/tmp-gate39-csid-db-wire.yml]
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install exact lockfile
        run: npm ci --registry=https://registry.npmjs.org
      - name: Wire schema and database export
        run: |
          python3 - <<'PY'
          from pathlib import Path

          schema_path = Path('packages/database/prisma/schema.prisma')
          schema = schema_path.read_text()
          if 'ZatcaCsidProvisioningAttempt[]' not in schema:
              anchor = '  planEntitlements         TenantPlanEntitlement[]\n'
              assert anchor in schema
              schema = schema.replace(anchor, anchor + '  zatcaCsidProvisioningAttempts ZatcaCsidProvisioningAttempt[]\n', 1)
              terminal_anchor = '  returns Return[]\n\n  @@unique([tenantId, code])'
              assert terminal_anchor in schema
              schema = schema.replace(
                  terminal_anchor,
                  '  returns Return[]\n  zatcaCsidProvisioningAttempts ZatcaCsidProvisioningAttempt[]\n\n  @@unique([tenantId, code])',
                  1,
              )
              schema += '''\n\n// ---------------------------------------------------------------------------\n// ZATCA Compliance-CSID provisioning evidence (Gate 39)\n// ---------------------------------------------------------------------------\n\nmodel ZatcaCsidProvisioningAttempt {\n  id         String @id @db.Uuid\n  tenantId   String @db.Uuid\n  terminalId String @db.Uuid\n\n  operationId String\n  requestHash String @db.Char(64)\n  environment String\n\n  keyProvider   String\n  keyId         String\n  keyExportable Boolean\n  csrSha256Hex  String @db.Char(64)\n\n  state            String\n  preparedAt       DateTime\n  requestStartedAt DateTime?\n  resolvedAt       DateTime?\n\n  remoteRequestId String?\n  credentialId    String?\n  certificateDer  Bytes?\n  secretProvider  String?\n  secretId        String?\n\n  rejectionCode     String?\n  uncertaintyReason String?\n\n  createdAt DateTime @default(now())\n  updatedAt DateTime @updatedAt\n\n  tenant   Tenant   @relation(fields: [tenantId], references: [id], onDelete: Cascade)\n  terminal Terminal @relation(fields: [tenantId, terminalId], references: [tenantId, id], onDelete: NoAction)\n\n  @@unique([tenantId, operationId], map: "zatca_csid_attempts_tenantId_operationId_key")\n  @@unique([tenantId, id], map: "zatca_csid_attempts_tenantId_id_key")\n  @@unique([tenantId, credentialId], map: "zatca_csid_attempts_tenantId_credentialId_key")\n  @@unique([tenantId, remoteRequestId], map: "zatca_csid_attempts_tenantId_remoteRequestId_key")\n  @@index([tenantId, terminalId, state], map: "zatca_csid_attempts_tenantId_terminalId_state_idx")\n  @@index([tenantId, state, resolvedAt], map: "zatca_csid_attempts_tenantId_state_resolvedAt_idx")\n  @@map("zatca_csid_provisioning_attempts")\n}\n'''
              schema_path.write_text(schema)

          index_path = Path('packages/database/src/index.ts')
          index = index_path.read_text()
          export = "\n// ZATCA Compliance-CSID durable uncertainty boundary (Gate 39).\nexport { createZatcaCsidProvisioningRepository } from './zatca/csid-provisioning-repository.js';\n"
          if 'createZatcaCsidProvisioningRepository' not in index:
              index_path.write_text(index.rstrip() + export)

          migration_path = Path('packages/database/prisma/migrations/20260910104000_zatca_csid_provisioning/migration.sql')
          migration = migration_path.read_text()
          migration = migration.replace(
              'CREATE UNIQUE INDEX "zatca_csid_attempts_tenantId_credentialId_key"\n  ON "zatca_csid_provisioning_attempts"("tenantId", "credentialId")\n  WHERE "credentialId" IS NOT NULL;',
              'CREATE UNIQUE INDEX "zatca_csid_attempts_tenantId_credentialId_key"\n  ON "zatca_csid_provisioning_attempts"("tenantId", "credentialId");',
          )
          migration = migration.replace(
              'CREATE UNIQUE INDEX "zatca_csid_attempts_tenantId_remoteRequestId_key"\n  ON "zatca_csid_provisioning_attempts"("tenantId", "remoteRequestId")\n  WHERE "remoteRequestId" IS NOT NULL;',
              'CREATE UNIQUE INDEX "zatca_csid_attempts_tenantId_remoteRequestId_key"\n  ON "zatca_csid_provisioning_attempts"("tenantId", "remoteRequestId");',
          )
          migration_path.write_text(migration)
          PY
      - name: Format generated surfaces
        run: |
          npx prisma format --schema packages/database/prisma/schema.prisma
          npx prettier@3.9.6 --write packages/database/src/index.ts packages/database/src/zatca/csid-provisioning-repository.ts packages/database/src/__tests__/zatca-csid-provisioning-live.test.ts
      - name: Commit source-only result
        run: |
          git config user.name korvi-ci
          git config user.email korvi-ci@users.noreply.github.com
          git add packages/database/prisma/schema.prisma packages/database/prisma/migrations/20260910104000_zatca_csid_provisioning/migration.sql packages/database/src/index.ts packages/database/src/zatca/csid-provisioning-repository.ts packages/database/src/__tests__/zatca-csid-provisioning-live.test.ts
          git diff --cached --check
          git commit -m "feat(zatca): wire durable CSID provisioning persistence"
          git push origin HEAD:review/zatca-39-csid-lifecycle
