name: ZATCA Official SDK Probe

on:
  push:
    branches:
      - review/zatca-official-sdk-probe

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Download official SDK artifact from the public ZATCA download target
        shell: bash
        run: |
          set -euo pipefail
          url='https://sadzit.sharepoint.com/:u:/g/EfjCGimzSjNPpVrWgn4f-mgBZ55D3EtCizFD7E8caZ4Kcg?download=1&e=gfOEcw'
          out="$RUNNER_TEMP/zatca-sdk.bin"
          curl --fail --show-error --location \
            --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 \
            --output "$out" "$url"
          printf 'sdk_size_bytes='; stat --format='%s' "$out"
          printf 'sdk_sha256='; sha256sum "$out" | awk '{print $1}'
          file "$out"
          case "$(file --brief --mime-type "$out")" in
            application/zip|application/x-zip-compressed)
              unzip -t "$out" >/dev/null
              echo 'archive_integrity=PASS'
              ;;
            *)
              echo 'Unexpected SDK artifact type.' >&2
              exit 1
              ;;
          esac

      - name: Inspect SDK structure and CLI authority without persisting the artifact
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/zatca-sdk.bin"
          dir="$RUNNER_TEMP/zatca-sdk"
          mkdir -p "$dir"
          unzip -q "$out" -d "$dir"
          echo '--- candidate CLI/runtime files ---'
          find "$dir" -maxdepth 4 -type f \
            \( -iname 'fatoora*' -o -iname '*.jar' -o -iname '*readme*' -o -iname '*manual*' \) \
            -printf '%P\n' | sort | head -n 160
          echo '--- top-level directories ---'
          find "$dir" -maxdepth 2 -type d -printf '%P\n' | sort | head -n 120
          echo '--- Java authority ---'
          java -version

      - name: Erase SDK bytes
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf "$RUNNER_TEMP/zatca-sdk" "$RUNNER_TEMP/zatca-sdk.bin"

      - name: Remove probe workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/zatca-official-sdk-probe.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/zatca-official-sdk-probe.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git diff --cached --check
          git commit -m 'chore(review): remove ZATCA SDK probe'
          git push origin HEAD:review/zatca-official-sdk-probe
